<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>The Library · TricknoLodge</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  :root {
    --green:   rgb(144,171,153);
    --green2:  rgb(110,135,118);
    --green3:  rgb(80,105,90);
    --brown:   rgb(43,28,16);
    --brown2:  rgb(60,42,26);
    --brown3:  rgb(80,58,36);
    --purple:  rgb(76,46,87);
    --purple2: rgb(100,65,112);
    --parchment: rgb(220,210,190);
    --parchment2: rgb(200,188,168);
    --dim: rgb(120,100,80);
    --mono: 'Courier New', Courier, monospace;
    --serif: Georgia, 'Times New Roman', serif;
  }
  body { background:var(--brown); color:var(--parchment); font-family:var(--serif); font-size:14px; min-height:100vh; }

  header { background:var(--brown2); border-bottom:2px solid var(--purple); padding:12px 24px; display:flex; align-items:center; gap:16px; }
  .back-link { color:var(--green); text-decoration:none; font-family:var(--mono); font-size:12px; letter-spacing:0.06em; }
  .back-link:hover { color:var(--parchment); }
  .page-title { font-size:18px; color:var(--green); font-weight:normal; letter-spacing:0.08em; }
  .page-sub { font-size:11px; color:var(--dim); font-family:var(--mono); }

  .library-wrap { max-width:900px; margin:0 auto; padding:24px 20px; }

  /* Filters */
  .filters { display:flex; gap:8px; margin-bottom:20px; flex-wrap:wrap; align-items:center; }
  .filter-btn { background:var(--brown2); border:1px solid var(--brown3); color:var(--dim); font-family:var(--mono); font-size:11px; padding:5px 12px; border-radius:20px; cursor:pointer; letter-spacing:0.05em; transition:all 0.15s; }
  .filter-btn:hover, .filter-btn.active { border-color:var(--green); color:var(--green); background:var(--brown3); }
  .search-wrap { margin-left:auto; }
  .search-input { background:var(--brown2); border:1px solid var(--brown3); color:var(--parchment); font-family:var(--mono); font-size:12px; padding:5px 12px; border-radius:4px; outline:none; width:200px; }
  .search-input:focus { border-color:var(--green3); }
  .search-input::placeholder { color:var(--dim); }

  /* Entry count */
  .entry-count { font-size:11px; color:var(--dim); font-family:var(--mono); margin-bottom:14px; }

  /* Entry grid */
  .entries { display:grid; gap:10px; }
  .entry-card { background:var(--brown2); border:1px solid var(--brown3); border-radius:6px; padding:14px 16px; cursor:pointer; transition:border-color 0.15s; display:flex; gap:14px; align-items:flex-start; }
  .entry-card:hover { border-color:var(--green3); }
  .entry-swatch { width:6px; border-radius:3px; flex-shrink:0; align-self:stretch; min-height:40px; background:var(--purple); }
  .entry-body { flex:1; min-width:0; }
  .entry-header { display:flex; align-items:center; gap:10px; margin-bottom:6px; flex-wrap:wrap; }
  .entry-emoji { font-size:16px; flex-shrink:0; }
  .entry-title { font-size:15px; color:var(--parchment); }
  .entry-badge { font-size:10px; font-family:var(--mono); color:var(--dim); background:var(--brown3); padding:2px 7px; border-radius:10px; letter-spacing:0.04em; }
  .entry-content { font-size:12px; color:var(--parchment2); line-height:1.5; overflow:hidden; display:-webkit-box; -webkit-line-clamp:2; -webkit-box-orient:vertical; }
  .entry-footer { display:flex; gap:12px; margin-top:8px; align-items:center; flex-wrap:wrap; }
  .entry-meta { font-size:11px; color:var(--dim); font-family:var(--mono); }
  .entry-rgb { display:flex; align-items:center; gap:5px; }
  .rgb-dot { width:10px; height:10px; border-radius:50%; border:0.5px solid rgba(255,255,255,0.15); }
  .entry-tags { font-size:11px; color:var(--purple2); font-family:var(--mono); }

  /* Modal */
  .modal-bg { display:none; position:fixed; inset:0; background:rgba(20,12,8,0.88); z-index:200; align-items:center; justify-content:center; padding:20px; }
  .modal-bg.open { display:flex; }
  .modal { background:var(--brown2); border:1px solid var(--purple); border-radius:8px; padding:28px; max-width:580px; width:100%; max-height:85vh; overflow-y:auto; position:relative; }
  .modal-close { position:absolute; top:14px; right:18px; background:none; border:none; color:var(--dim); font-size:20px; cursor:pointer; padding:0; line-height:1; }
  .modal-close:hover { color:var(--parchment); }
  .modal-swatch { width:100%; height:5px; border-radius:2px; margin-bottom:16px; }
  .modal-title { font-size:20px; color:var(--green); margin-bottom:6px; font-weight:normal; }
  .modal-meta { font-size:12px; color:var(--dim); font-family:var(--mono); margin-bottom:16px; }
  .modal-content { font-size:14px; line-height:1.7; color:var(--parchment2); margin-bottom:16px; }
  .modal-section-label { font-size:11px; color:var(--dim); font-family:var(--mono); letter-spacing:0.08em; margin-bottom:8px; margin-top:14px; text-transform:uppercase; }
  .modal-cards { display:flex; flex-wrap:wrap; gap:6px; }
  .modal-card-chip { display:flex; align-items:center; gap:5px; background:var(--brown3); border:0.5px solid var(--brown3); border-radius:12px; padding:3px 10px; font-size:11px; font-family:var(--mono); color:var(--parchment2); }
  .chip-dot { width:8px; height:8px; border-radius:50%; flex-shrink:0; border:0.5px solid rgba(255,255,255,0.1); }
  .modal-rgb-row { display:flex; align-items:center; gap:10px; }
  .modal-rgb-swatch { width:40px; height:20px; border-radius:3px; border:0.5px solid rgba(255,255,255,0.15); }
  .modal-rgb-val { font-size:12px; font-family:var(--mono); color:var(--green); }

  .loading { color:var(--dim); font-family:var(--mono); font-size:13px; font-style:italic; padding:40px; text-align:center; }
  .empty { color:var(--dim); font-family:var(--mono); font-size:13px; padding:40px; text-align:center; }

  ::-webkit-scrollbar { width:5px; }
  ::-webkit-scrollbar-track { background:var(--brown); }
  ::-webkit-scrollbar-thumb { background:var(--brown3); border-radius:3px; }
</style>
</head>
<body>

<header>
  <a class="back-link" href="index.html">← Lodge</a>
  <div>
    <div class="page-title">📚 The Library</div>
    <div class="page-sub">great library · all entries</div>
  </div>
</header>

<div class="library-wrap">
  <div class="filters" id="filters">
    <button class="filter-btn active" onclick="setFilter('all',this)">all</button>
    <button class="filter-btn" onclick="setFilter('item',this)">📖 items</button>
    <button class="filter-btn" onclick="setFilter('character',this)">🧙 characters</button>
    <button class="filter-btn" onclick="setFilter('place',this)">🗺️ places</button>
    <button class="filter-btn" onclick="setFilter('concept',this)">🌀 concepts</button>
    <button class="filter-btn" onclick="setFilter('session',this)">🎭 sessions</button>
    <div class="search-wrap">
      <input class="search-input" type="text" id="search" placeholder="search…" oninput="applySearch(this.value)">
    </div>
  </div>

  <div class="entry-count" id="entry-count"></div>
  <div class="entries" id="entries"><div class="loading">*Mu retrieves the records…*</div></div>
</div>

<!-- Entry Detail Modal -->
<div class="modal-bg" id="modal-bg" onclick="if(event.target===this)closeModal()">
  <div class="modal">
    <button class="modal-close" onclick="closeModal()">×</button>
    <div class="modal-swatch" id="modal-swatch"></div>
    <div class="modal-title" id="modal-title"></div>
    <div class="modal-meta" id="modal-meta"></div>
    <div class="modal-content" id="modal-content"></div>
    <div id="modal-extra"></div>
  </div>
</div>

<script>
const SUPABASE_URL = 'https://tngvginwtsldulqgufoe.supabase.co';
const SUPABASE_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InRuZ3ZnaW53dHNsZHVscWd1Zm9lIiwicm9sZSI6ImFub24iLCJpYXQiOjE3Nzg5NTc3NTAsImV4cCI6MjA5NDUzMzc1MH0.4NzjqjdB_56gtbt_lf3ZAiE6Gfn0zpaZC36hIcjmIMI';
const db = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

const ENTRY_EMOJI={item:"📖",character:"🧙",session:"🎭",concept:"🌀",place:"🗺️"};
let allEntries=[];
let activeFilter="all";
let activeSearch="";

async function loadEntries(){
  const el=document.getElementById("entries");
  const{data,error}=await db.from("library_entries").select("*").order("created_at",{ascending:false});
  if(error){ el.innerHTML=`<div class="loading">error: ${error.message}</div>`; return; }
  if(!data||data.length===0){ el.innerHTML=`<div class="empty">*The archive is quiet. Nothing has been filed yet.*</div>`; return; }
  allEntries=data;
  render();
}

function setFilter(type,btn){
  activeFilter=type;
  document.querySelectorAll(".filter-btn").forEach(b=>b.classList.remove("active"));
  btn.classList.add("active");
  render();
}

function applySearch(q){
  activeSearch=q.toLowerCase();
  render();
}

function render(){
  let entries=allEntries;
  if(activeFilter!=="all") entries=entries.filter(e=>e.entry_type===activeFilter);
  if(activeSearch) entries=entries.filter(e=>
    e.title?.toLowerCase().includes(activeSearch)||
    e.content?.toLowerCase().includes(activeSearch)||
    e.tags?.toLowerCase().includes(activeSearch)||
    e.subtype?.toLowerCase().includes(activeSearch)
  );

  document.getElementById("entry-count").textContent=`${entries.length} entr${entries.length===1?"y":"ies"}`;

  if(entries.length===0){
    document.getElementById("entries").innerHTML=`<div class="empty">*Mu searches the stacks. Nothing matches.*</div>`;
    return;
  }

  document.getElementById("entries").innerHTML=entries.map(e=>{
    const rgb=e.r!=null?`rgb(${e.r},${e.g},${e.b})`:null;
    const swatch=rgb?`background:${rgb}`:`background:var(--purple)`;
    const emoji=ENTRY_EMOJI[e.entry_type]||"📜";
    const preview=(e.content||"").slice(0,120)+(e.content?.length>120?"…":"");
    const date=new Date(e.created_at).toLocaleDateString();
    const tags=e.tags?`<span class="entry-tags">${e.tags}</span>`:"";
    return`<div class="entry-card" onclick="openEntry(${e.id})">
      <div class="entry-swatch" style="${swatch}"></div>
      <div class="entry-body">
        <div class="entry-header">
          <span class="entry-emoji">${emoji}</span>
          <span class="entry-title">${e.title}</span>
          <span class="entry-badge">${e.entry_type}${e.subtype?" · "+e.subtype:""}</span>
        </div>
        ${preview?`<div class="entry-content">${preview}</div>`:""}
        <div class="entry-footer">
          <span class="entry-meta">by ${e.author||"unknown"} · ${date}</span>
          ${rgb?`<div class="entry-rgb"><span class="rgb-dot" style="background:${rgb}"></span><span class="entry-meta">RGB ${e.r}·${e.g}·${e.b}</span></div>`:""}
          ${tags}
        </div>
      </div>
    </div>`;
  }).join("");
}

async function openEntry(id){
  const entry=allEntries.find(e=>e.id===id);
  if(!entry)return;
  const emoji=ENTRY_EMOJI[entry.entry_type]||"📜";
  const rgb=entry.r!=null?`rgb(${entry.r},${entry.g},${entry.b})`:null;

  document.getElementById("modal-swatch").style.cssText=rgb?`background:${rgb};`:"display:none";
  document.getElementById("modal-title").innerHTML=`${emoji} ${entry.title}`;
  document.getElementById("modal-meta").innerHTML=
    `<strong>${entry.entry_type}${entry.subtype?" · "+entry.subtype:""}</strong> · by ${entry.author||"unknown"} · ${new Date(entry.created_at).toLocaleDateString()}${entry.tags?` · <em>${entry.tags}</em>`:""}`;
  document.getElementById("modal-content").textContent=entry.content||"—";

  let extra="";
  if(rgb){
    extra+=`<div class="modal-section-label">color token</div>
      <div class="modal-rgb-row">
        <div class="modal-rgb-swatch" style="background:${rgb}"></div>
        <span class="modal-rgb-val">R:${entry.r} · G:${entry.g} · B:${entry.b}</span>
      </div>`;
  }

  // Fetch assigned cards
  const{data:assignments}=await db.from("library_card_assignments").select("card_id").eq("entry_id",id);
  if(assignments&&assignments.length>0){
    const ids=assignments.map(a=>a.card_id);
    const{data:cards}=await db.from("cards").select("card_id,name,suit,suit_number,r,g,b").in("card_id",ids);
    if(cards&&cards.length>0){
      const chips=cards.map(c=>{
        const cardRgb=`rgb(${c.r},${c.g},${c.b})`;
        const label=c.suit==="major"?c.name:`${c.suit_number}·${c.suit[0].toUpperCase()}·${c.name}`;
        return`<div class="modal-card-chip"><span class="chip-dot" style="background:${cardRgb}"></span>${label}</div>`;
      }).join("");
      extra+=`<div class="modal-section-label">cards</div><div class="modal-cards">${chips}</div>`;
    }
  }

  document.getElementById("modal-extra").innerHTML=extra;
  document.getElementById("modal-bg").classList.add("open");
}

function closeModal(){ document.getElementById("modal-bg").classList.remove("open"); }
document.addEventListener("keydown",e=>{ if(e.key==="Escape")closeModal(); });

loadEntries();
</script>
</body>
</html>
