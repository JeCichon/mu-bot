<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>What's New · TricknoLodge</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
  *,*::before,*::after{box-sizing:border-box;margin:0;padding:0;}
  :root{
    --green:rgb(144,171,153);--green2:rgb(110,135,118);--green3:rgb(80,105,90);
    --brown:rgb(43,28,16);--brown2:rgb(60,42,26);--brown3:rgb(80,58,36);
    --purple:rgb(76,46,87);--purple2:rgb(100,65,112);
    --parchment:rgb(220,210,190);--parchment2:rgb(200,188,168);
    --dim:rgb(120,100,80);--gold:rgb(201,169,110);
    --mono:'Courier New',Courier,monospace;--serif:Georgia,'Times New Roman',serif;
  }
  body{background:var(--brown);color:var(--parchment);font-family:var(--serif);font-size:14px;min-height:100vh;}
  header{background:var(--brown2);border-bottom:2px solid var(--purple);padding:12px 24px;display:flex;align-items:center;gap:16px;}
  .back-link{color:var(--green);text-decoration:none;font-family:var(--mono);font-size:12px;}
  .back-link:hover{color:var(--parchment);}
  .page-title{font-size:18px;color:var(--green);font-weight:normal;letter-spacing:0.08em;}
  .page-sub{font-size:11px;color:var(--dim);font-family:var(--mono);}
  .header-right{margin-left:auto;}
  .btn-new{background:var(--purple);border:1px solid var(--purple2);color:var(--parchment);font-family:var(--mono);font-size:12px;padding:6px 14px;border-radius:4px;cursor:pointer;}
  .btn-new:hover{background:var(--purple2);}

  .wrap{max-width:700px;margin:0 auto;padding:28px 20px;}

  /* Timeline */
  .timeline{position:relative;padding-left:28px;}
  .timeline::before{content:'';position:absolute;left:8px;top:0;bottom:0;width:1px;background:var(--brown3);}
  .entry{position:relative;margin-bottom:28px;}
  .entry::before{content:'';position:absolute;left:-24px;top:8px;width:9px;height:9px;border-radius:50%;background:var(--green3);border:2px solid var(--brown);box-shadow:0 0 0 1px var(--green3);}
  .entry-date{font-size:11px;color:var(--dim);font-family:var(--mono);margin-bottom:5px;display:flex;align-items:center;gap:8px;}
  .entry-version{background:var(--brown3);color:var(--green);font-family:var(--mono);font-size:10px;padding:1px 7px;border-radius:10px;letter-spacing:0.06em;}
  .entry-title{font-size:16px;color:var(--gold);margin-bottom:8px;font-weight:normal;}
  .entry-body{font-size:13px;color:var(--parchment2);line-height:1.7;}
  .entry-body p{margin-bottom:0.8em;}
  .entry-body p:last-child{margin-bottom:0;}
  .entry-author{font-size:11px;color:var(--dim);font-family:var(--mono);margin-top:8px;}

  /* New entry form */
  .form-wrap{background:var(--brown2);border:1px solid var(--purple);border-radius:8px;padding:20px;margin-bottom:28px;display:none;}
  .form-wrap.open{display:block;}
  .form-label{font-size:11px;color:var(--dim);font-family:var(--mono);letter-spacing:0.06em;text-transform:uppercase;margin-bottom:5px;}
  .form-row{margin-bottom:12px;}
  .form-input{width:100%;background:var(--brown);border:1px solid var(--brown3);color:var(--parchment);font-family:var(--serif);font-size:13px;padding:7px 10px;border-radius:4px;outline:none;}
  .form-input:focus{border-color:var(--green3);}
  .form-row-2{display:grid;grid-template-columns:1fr 1fr;gap:12px;}
  .form-actions{display:flex;gap:8px;margin-top:14px;}
  .btn-save{background:var(--purple);border:1px solid var(--purple2);color:var(--parchment);font-family:var(--mono);font-size:12px;padding:6px 16px;border-radius:4px;cursor:pointer;}
  .btn-save:hover{background:var(--purple2);}
  .btn-cancel{background:var(--brown);border:1px solid var(--brown3);color:var(--dim);font-family:var(--mono);font-size:12px;padding:6px 14px;border-radius:4px;cursor:pointer;}
  .form-status{font-size:12px;font-family:var(--mono);color:var(--green);margin-top:8px;min-height:18px;}

  .loading{color:var(--dim);font-family:var(--mono);font-size:13px;font-style:italic;padding:40px;text-align:center;}

  ::-webkit-scrollbar{width:5px;}
  ::-webkit-scrollbar-track{background:var(--brown);}
  ::-webkit-scrollbar-thumb{background:var(--brown3);border-radius:3px;}
</style>

<script>
// Hide header when loaded inside the Lodge content panel
if(window.location.search.includes('embed=1')||window.self!==window.top){
  document.addEventListener('DOMContentLoaded',()=>{
    const h=document.querySelector('header');
    if(h) h.style.display='none';
  });
}
</script>
</head>
<body>
<header>
  <a class="back-link" href="index.html">← Lodge</a>
  <div>
    <div class="page-title">📋 What's New</div>
    <div class="page-sub">tricknolodge · changelog</div>
  </div>
  <div class="header-right">
    <button class="btn-new" id="btn-new" style="display:none" onclick="toggleForm()">+ Add Entry</button>
  </div>
</header>

<div class="wrap">
  <!-- New entry form (archmage only) -->
  <div class="form-wrap" id="form-wrap">
    <div class="form-row-2">
      <div class="form-row">
        <div class="form-label">Title *</div>
        <input class="form-input" id="f-title" placeholder="What changed?">
      </div>
      <div class="form-row">
        <div class="form-label">Version / Tag</div>
        <input class="form-input" id="f-version" placeholder="e.g. v1.4, Lodge Phase 2…">
      </div>
    </div>
    <div class="form-row">
      <div class="form-label">Details</div>
      <textarea class="form-input" id="f-body" rows="4" placeholder="What was added, fixed, or changed…"></textarea>
    </div>
    <div class="form-actions">
      <button class="btn-cancel" onclick="toggleForm()">cancel</button>
      <button class="btn-save" onclick="saveEntry()">save entry</button>
    </div>
    <div class="form-status" id="form-status"></div>
  </div>

  <!-- Timeline -->
  <div class="timeline" id="timeline">
    <div class="loading">*Mu retrieves the records…*</div>
  </div>
</div>

<script>
const SUPABASE_URL = 'https://tngvginwtsldulqgufoe.supabase.co';
const SUPABASE_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InRuZ3ZnaW53dHNsZHVscWd1Zm9lIiwicm9sZSI6ImFub24iLCJpYXQiOjE3Nzg5NTc3NTAsImV4cCI6MjA5NDUzMzc1MH0.4NzjqjdB_56gtbt_lf3ZAiE6Gfn0zpaZC36hIcjmIMI';
const db = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

let currentUser = null;
let userRole = null;

db.auth.onAuthStateChange(async(_e, session) => {
  currentUser = session?.user || null;
  if(currentUser){
    const{data}=await db.from('user_roles').select('role').eq('user_id',currentUser.id).maybeSingle();
    userRole = data?.role || 'apprentice';
    if(userRole === 'archmage'){
      document.getElementById('btn-new').style.display='block';
    }
  }
});

async function loadEntries(){
  const{data,error}=await db.from('changelog')
    .select('*').order('created_at',{ascending:false}).limit(50);
  const el=document.getElementById('timeline');
  if(error||!data||data.length===0){
    el.innerHTML=`<div class="loading">*The record is blank. The first entry awaits.*</div>`;
    return;
  }
  el.innerHTML=data.map(e=>{
    const body=e.body?(e.body.split('\n\n').map(p=>`<p>${p.replace(/\n/g,'<br>')}</p>`).join('')):'';
    return`<div class="entry">
      <div class="entry-date">
        ${new Date(e.created_at).toLocaleDateString('en-US',{month:'long',day:'numeric',year:'numeric'})}
        ${e.version?`<span class="entry-version">${e.version}</span>`:''}
      </div>
      <div class="entry-title">${e.title}</div>
      ${body?`<div class="entry-body">${body}</div>`:''}
      ${e.author?`<div class="entry-author">by ${e.author}</div>`:''}
    </div>`;
  }).join('');
}



async function getNextVersion(){
  const{data}=await db.from('changelog').select('version').order('created_at',{ascending:false}).limit(20);
  let max=0;
  (data||[]).forEach(r=>{
    const m=r.version&&r.version.match(/trickno\.(\d+)/i);
    if(m) max=Math.max(max,parseInt(m[1]));
  });
  return 'trickno.'+String(max+1).padStart(4,'0');
}

function toggleForm(){
  const fw=document.getElementById('form-wrap');
  fw.classList.toggle('open');
  if(fw.classList.contains('open')){
    document.getElementById('f-title').focus();
    getNextVersion().then(v=>{ document.getElementById('f-version').value=v; });
  }
}

async function saveEntry(){
  const title=document.getElementById('f-title').value.trim();
  const body=document.getElementById('f-body').value.trim()||null;
  const version=document.getElementById('f-version').value.trim()||null;
  const statusEl=document.getElementById('form-status');
  if(!title){statusEl.textContent='Title is required.';statusEl.style.color='#e06060';return;}
  statusEl.textContent='saving…';statusEl.style.color='var(--dim)';
  const author=currentUser?.user_metadata?.full_name||currentUser?.user_metadata?.name||'unknown';
  const{error}=await db.from('changelog').insert({title,body,version,author});
  if(error){statusEl.textContent=`Error: ${error.message}`;statusEl.style.color='#e06060';return;}
  // Post to Lodge chat
  try{
    const lines=["What's new",version?version+' — '+title:title];
    if(body) lines.push(body);
    await db.from('messages').insert({
      user_id:'system',user_name:'update',user_avatar:null,
      content:lines.join('\n'),is_mu:false,card_line:null,is_system:true,
    });
  }catch(e){ console.warn('Chat post failed:',e.message); }
  statusEl.textContent='✓ Saved + shared to chat.';statusEl.style.color='var(--green)';
  document.getElementById('f-title').value='';
  document.getElementById('f-body').value='';
  setTimeout(()=>{toggleForm();loadEntries();},900);
}

loadEntries();
</script>
</body>
</html>
