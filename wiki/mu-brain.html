  {id:21,name:"The Universe",suit:"major",sn:21,r:145,g:0,b:178,adj:"Karmic",noun:"Conclusion",subject:"All that is",verb:"spins together",adv:"freely",timeframe:"As this cycle ends",command:"Complete"},
  {id:22,name:"Ace of Wands",suit:"wands",sn:1,r:255,g:255,b:255,...W},
  {id:23,name:"Dominion",suit:"wands",sn:2,r:0,g:148,b:214,...W},
  {id:36,name:"Ace of Cups",suit:"cups",sn:1,r:250,g:250,b:250,...C},
  {id:37,name:"Love",suit:"cups",sn:2,r:174,g:177,b:178,...C},
  {id:38,name:"Abundance",suit:"cups",sn:3,r:0,g:0,b:0,...C},
  {id:44,name:"Happiness",suit:"cups",sn:9,r:178,g:0,b:109,...C},
  {id:50,name:"Ace of Swords",suit:"swords",sn:1,r:242,g:242,b:242,...So},
  {id:64,name:"Ace of Disks",suit:"disks",sn:1,r:255,g:246,b:205,...D},
  {id:66,name:"Works",suit:"disks",sn:3,r:202,g:184,b:184,...D},

const pick=arr=>arr[Math.floor(Math.random()*arr.length)];
const clean=s=>s.replace(/\s{2,}/g," ").replace(/ \./g,".").replace(/ ,/g,",").trim();

const KOAN_FRAMES=[
  (a,b)=>`${a.adj} ${a.noun} does not explain itself to ${b.adj} ${b.noun}.`,
  (a,b)=>`You are looking for ${b.noun}. ${a.adj} is the door.`,
  (a,b)=>`Before ${a.adj} ${a.noun} — what were you?`,
  (a,b)=>`${b.adj} ${b.noun} waits at the end of every ${a.adj} path.`,
  (a,b)=>`${a.noun} and ${b.noun} are the same word in a language no one speaks anymore.`,
  (a,b)=>`You already have ${b.noun}. That's why ${a.adj} ${a.noun} is so loud right now.`,
  (a,b)=>`${a.adj} ${a.noun} crossed the river. On the other side: ${b.adj} ${b.noun}. It turned back.`,
  (a,b)=>`Ask ${a.adj} ${a.noun} what it costs. Then ask ${b.noun} what it gives.`,
];
const SENTENCE_TEMPLATES=[
  c=>`${c[0].subject} ${c[1].verb} ${c[0].adv}.`,
  c=>`${c[0].adj} ${c[0].noun} — ${c[1].verb} ${c[1].adv}.`,
  c=>`${c[0].subject} ${c[1].verb} — ${c[1].adj} ${c[1].noun} ${c[0].adv}.`,
  c=>`${c[0].adj} ${c[1].noun} ${c[0].verb} ${c[1].adv}. ${c[1].subject} listens.`,
];
const MU_INTROS=[
  "*Mu sets something on the table.*",
  "*The library is quiet. Mu draws two threads together.*",
  "*Mu looks at you the way water looks at a stone.*",
  "*He draws. He does not interpret. He offers.*",
  "*Something shifts in the archive.*",
];

function drawCards(n){ return [...CARDS].sort(()=>Math.random()-0.5).slice(0,n); }
function cardName(c){ return c.suit==="major"?c.name:`${c.sn}·${c.suit[0].toUpperCase()}·${c.name}`; }

function isCasualGreeting(text){
  const t=text.toLowerCase();
  return /\bmu\b/.test(t) && (/\bsup\b/.test(t) || /what.?s?\s*up/.test(t));
}

// Best-effort verb -> gerund. Card verbs are written 3rd-person-present
// ("dominates", "confronts"), sometimes multi-word ("dissolves and bonds") —
// this only reshapes the first word and leaves the rest, which is loose but
// keeps the playful, slightly-off tone the rest of Mu's voice already has.
function gerund(verbPhrase){
  const words=verbPhrase.trim().split(/\s+/);
  const irregular={are:"being",is:"being",were:"having been",was:"having been"};
  const head=words[0].toLowerCase();
  let out;
  if(irregular[head]){ out=irregular[head]; }
  else{
    let v=head.replace(/s$/,"");
    if(/e$/.test(v)&&!/ee$/.test(v)) v=v.slice(0,-1);
    out=v+"ing";
  }
  return [out,...words.slice(1)].join(" ");
}

function buildCasualReply(){
  const card=drawCards(1)[0];
  const article=/^[aeiou]/i.test(card.noun)?"an":"a";
  return{sentence:`Not much, just ${gerund(card.verb)} like ${article} ${card.noun.toLowerCase()}.`,cards:[card]};
}

function buildMuReply(userText, topEntry){
  if(isCasualGreeting(userText)) return buildCasualReply();
  const cards=drawCards(2);
  let sentence;
  const isQuestion=userText.includes("?");
  if(!userText||!userText.trim()||(!userText.toLowerCase().includes("mu")&&!isQuestion)){
    sentence=pick(KOAN_FRAMES)(cards[0],cards[1]);
  } else {
    const intro=Math.random()>0.4?pick(MU_INTROS)+"\n\n":"";
    sentence=intro+clean(pick(SENTENCE_TEMPLATES)(cards));
    // Prefer referencing something Mu actually knows (a matched library
    // entry, passed in by index.html) over echoing a random word back from
    // what you said. Only ever the entry's title — never its full text.
    let ref=null;
    if(topEntry&&topEntry.title){
      ref=topEntry.title;
    } else {
      const kw=userText.toLowerCase().replace(/[^a-z\s]/g,"").split(/\s+/).filter(w=>w.length>3&&!["what","does","that","this","with","from","have","your","they","will"].includes(w));
      if(kw.length>0&&Math.random()>0.5) ref=pick(kw);
    }
    if(ref){
      sentence=pick([`*${ref}* — ${sentence}`,`${sentence} What of *${ref}*?`,`Before *${ref}* — ${sentence}`]);
    }
  }
  return{sentence,cards};
}



const GREETING_TEMPLATES=[
  (n,c)=>`Hello ${n} — ${c.timeframe}, ${c.command} the ${c.adj} ${c.noun}.`,
  (n,c)=>`${n}. *${c.adj} ${c.noun}* greets you today.`,
  (n,c)=>`Welcome, ${n}. ${c.timeframe} — ${c.command} your ${c.adj} ${c.noun}.`,
  (n,c)=>`The archive stirs. ${n} has entered. *${c.command} the ${c.adj} ${c.noun}.*`,
  (n,c)=>`${n} — ${c.timeframe}. *${c.adj} ${c.noun}.*`,
  (n,c)=>`*${c.timeframe}.* Hello ${n} — the ${c.adj} ${c.noun} is yours today.`,
];

async function checkDailyGreeting(user){
  const today=new Date().toISOString().split('T')[0];
  try{
    const{data}=await db.from('daily_greeted').select('id')
      .eq('user_id',user.id).eq('greeted_date',today).maybeSingle();
    if(data) return; // already greeted today
    const card=pick(CARDS);
    const name=user.user_metadata?.full_name||user.user_metadata?.name||'traveler';
    const sentence=clean(pick(GREETING_TEMPLATES)(name,card));
    await saveMuMessage(sentence,cardName(card));
    await db.from('daily_greeted').insert({user_id:user.id,greeted_date:today});
  } catch(err){ console.log('Greeting check failed (non-fatal):',err.message); }
}


// ── Message interface ─────────────────────────────────────────────────────────
window.addEventListener('message', e => {
  if(!e.data || e.data.type !== 'mu_query') return;
  const { queryType, text, name, date, topEntry } = e.data;

  if(queryType === 'response'){
    const { sentence, cards } = buildMuReply(text||'', topEntry||null);
    window.parent.postMessage({
      type:     'mu_response',
      sentence,
      cardLine: cards.map(c=>cardName(c)).join(' · ')
    }, '*');

  } else if(queryType === 'greeting'){
    const card   = pick(CARDS);
    const sentence = clean(pick(GREETING_TEMPLATES)(name||'traveler', card));
    window.parent.postMessage({
      type:     'mu_greeting',
      sentence,
      cardLine: cardName(card),
      date
    }, '*');

  } else if(queryType === 'test'){
    // Diagnostic — check all systems, report back immediately
    const errors=[];
    try{
      if(!CARDS||!CARDS.length)        errors.push('CARDS array empty');
      else{
        const tc=pick(CARDS);
        if(!tc.adj)     errors.push('card missing .adj');
        if(!tc.noun)    errors.push('card missing .noun');
        if(!tc.verb)    errors.push('card missing .verb');
        if(!tc.command) errors.push('card missing .command');
      }
      if(!KOAN_FRAMES||!KOAN_FRAMES.length)           errors.push('KOAN_FRAMES empty');
      if(!GREETING_TEMPLATES||!GREETING_TEMPLATES.length) errors.push('GREETING_TEMPLATES empty');
      const tr=buildMuReply('test mu');
      if(!tr||!tr.sentence) errors.push('buildMuReply returned nothing');
    }catch(e){ errors.push('runtime error: '+e.message); }
    window.parent.postMessage({
      type:    'mu_response',
      sentence: errors.length
        ? '🔴 *Mu found issues:* '+errors.join(' · ')
        : '🟢 *Mu is present.* '+CARDS.length+' cards loaded, all systems nominal.',
      cardLine: null
    },'*');
  }
});

// Signal ready
window.parent.postMessage({ type: 'mu_ready' }, '*');
</script>
