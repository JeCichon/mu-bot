<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Feedback · TricknoLodge</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
  *,*::before,*::after{box-sizing:border-box;margin:0;padding:0;}
  :root{
    --green:rgb(144,171,153);--green2:rgb(110,135,118);--green3:rgb(80,105,90);
    --brown:rgb(43,28,16);--brown2:rgb(60,42,26);--brown3:rgb(80,58,36);
    --purple:rgb(76,46,87);--purple2:rgb(100,65,112);
    --parchment:rgb(220,210,190);--parchment2:rgb(200,188,168);
    --dim:rgb(120,100,80);--gold:rgb(201,169,110);
    --bug:#cc4444;--suggest:#4477cc;--question:#aa66cc;
    --new:#555;--noted:#886622;--planned:#225588;--done:#336633;
    --mono:'Courier New',Courier,monospace;--serif:Georgia,'Times New Roman',serif;
  }
  body{background:var(--brown);color:var(--parchment);font-family:var(--serif);font-size:14px;min-height:100vh;}
  header{background:var(--brown2);border-bottom:2px solid var(--purple);padding:12px 24px;display:flex;align-items:center;gap:14px;flex-wrap:wrap;}
  .back-link{color:var(--green);text-decoration:none;font-family:var(--mono);font-size:12px;}
  .back-link:hover{color:var(--parchment);}
  .page-title{font-size:18px;color:var(--green);font-weight:normal;letter-spacing:0.08em;}
  .page-sub{font-size:11px;color:var(--dim);font-family:var(--mono);}
  .header-right{margin-left:auto;display:flex;gap:8px;}

  button{background:var(--brown3);border:1px solid var(--brown3);color:var(--parchment);font-family:var(--mono);font-size:12px;padding:6px 14px;border-radius:4px;cursor:pointer;transition:border-color .15s;}
  button:hover{border-color:var(--green3);}
  .btn-export{background:var(--purple);border-color:var(--purple2);color:var(--parchment);}
  .btn-export:hover{background:var(--purple2);}

  .wrap{max-width:900px;margin:0 auto;padding:20px;}

  /* Filter tabs */
  .filter-bar{display:flex;gap:6px;margin-bottom:16px;flex-wrap:wrap;align-items:center;}
  .tab{background:var(--brown2);border:1px solid var(--brown3);color:var(--dim);font-family:var(--mono);font-size:11px;padding:4px 12px;border-radius:16px;cursor:pointer;letter-spacing:0.04em;}
  .tab:hover,.tab.active{border-color:var(--green);color:var(--green);background:var(--brown3);}
  .count-badge{font-size:10px;background:var(--brown3);padding:1px 5px;border-radius:8px;margin-left:4px;color:var(--dim);}
  .search-input{margin-left:auto;background:var(--brown2);border:1px solid var(--brown3);color:var(--parchment);font-family:var(--mono);font-size:12px;padding:5px 10px;border-radius:4px;outline:none;width:180px;}
  .search-input:focus{border-color:var(--green3);}
  .search-input::placeholder{color:var(--dim);}
  .item-count{font-size:11px;color:var(--dim);font-family:var(--mono);margin-bottom:12px;}

  /* Feedback cards */
  .feedback-list{display:flex;flex-direction:column;gap:8px;}
  .fb-card{background:var(--brown2);border:1px solid var(--brown3);border-radius:6px;overflow:hidden;transition:border-color .15s;}
  .fb-card:hover{border-color:var(--brown3);}
  .fb-main{display:flex;gap:10px;padding:12px 14px;cursor:pointer;align-items:flex-start;}
  .fb-type-dot{width:8px;height:8px;border-radius:50%;flex-shrink:0;margin-top:5px;}
  .fb-body{flex:1;min-width:0;}
  .fb-header{display:flex;gap:8px;align-items:center;margin-bottom:4px;flex-wrap:wrap;}
  .fb-page{font-size:11px;font-family:var(--mono);background:var(--brown3);padding:2px 8px;border-radius:10px;color:var(--parchment2);}
  .fb-type{font-size:10px;font-family:var(--mono);padding:2px 7px;border-radius:10px;font-weight:bold;letter-spacing:0.04em;}
  .fb-type.bug{background:rgba(204,68,68,.2);color:var(--bug);border:1px solid rgba(204,68,68,.3);}
  .fb-type.suggestion{background:rgba(68,119,204,.2);color:var(--suggest);border:1px solid rgba(68,119,204,.3);}
  .fb-type.question{background:rgba(170,102,204,.2);color:var(--question);border:1px solid rgba(170,102,204,.3);}
  .fb-status{font-size:10px;font-family:var(--mono);padding:2px 7px;border-radius:10px;}
  .fb-status.new{background:rgba(85,85,85,.3);color:#aaa;}
  .fb-status.noted{background:rgba(136,102,34,.3);color:#cc9944;}
  .fb-status.planned{background:rgba(34,85,136,.3);color:#6699cc;}
  .fb-status.done{background:rgba(51,102,51,.3);color:#66bb66;}
  .fb-desc{font-size:13px;color:var(--parchment);line-height:1.5;margin-bottom:4px;}
  .fb-meta{font-size:11px;color:var(--dim);font-family:var(--mono);}
  .fb-expand{font-size:14px;color:var(--dim);padding:4px;flex-shrink:0;user-select:none;}
  .fb-detail{display:none;padding:0 14px 14px;border-top:1px solid var(--brown3);}
  .fb-detail.open{display:block;}
  .fb-notes-label{font-size:11px;color:var(--dim);font-family:var(--mono);letter-spacing:0.06em;text-transform:uppercase;margin-bottom:5px;margin-top:10px;}
  .fb-notes{width:100%;background:var(--brown);border:1px solid var(--brown3);color:var(--parchment);font-family:var(--serif);font-size:13px;padding:8px 10px;border-radius:4px;outline:none;resize:vertical;min-height:60px;}
  .fb-notes:focus{border-color:var(--green3);}
  .fb-actions{display:flex;gap:6px;margin-top:10px;flex-wrap:wrap;align-items:center;}
  .status-btn{font-size:11px;padding:4px 10px;}
  .status-btn.active-status{border-color:var(--green);color:var(--green);}
  .save-note-btn{background:var(--brown3);border:1px solid var(--green3);color:var(--green);font-size:11px;padding:4px 12px;}
  .save-note-btn:hover{background:rgba(80,105,90,.2);}
  .note-saved{font-size:11px;font-family:var(--mono);color:var(--green);margin-left:6px;}

  /* Export panel */
  .export-panel{display:none;background:var(--brown2);border:1px solid var(--purple);border-radius:6px;padding:16px;margin-bottom:16px;}
  .export-panel.open{display:block;}
  .export-textarea{width:100%;background:var(--brown);border:1px solid var(--brown3);color:var(--parchment);font-family:var(--mono);font-size:11px;padding:10px;border-radius:4px;min-height:200px;resize:vertical;outline:none;}
  .export-actions{display:flex;gap:8px;margin-top:10px;}
  .btn-copy{background:var(--green3);border:1px solid var(--green3);color:var(--parchment);}
  .btn-copy:hover{background:var(--green2);}

  .empty{color:var(--dim);font-family:var(--mono);font-size:13px;font-style:italic;padding:30px;text-align:center;}

  ::-webkit-scrollbar{width:5px;}
  ::-webkit-scrollbar-track{background:var(--brown);}
  ::-webkit-scrollbar-thumb{background:var(--brown3);border-radius:3px;}

<script>
// Hide header when embedded
if(window.location.search.includes('embed=1')||window.self!==window.top){
  document.addEventListener('DOMContentLoaded',()=>{const h=document.querySelector('header');if(h)h.style.display='none';});
}
</script>
</style>
</head>
<body>
<header>
  <a class="back-link" href="index.html">← Lodge</a>
  <div>
    <div class="page-title">✎ Feedback</div>
    <div class="page-sub">bugs · suggestions · questions</div>
  </div>
  <div class="header-right">
    <button class="btn-export" onclick="toggleExport()">⬇ Export for AI</button>
  </div>
</header>

<div class="wrap">
  <!-- Export panel -->
  <div class="export-panel" id="export-panel">
    <div style="font-size:12px;color:var(--dim);font-family:var(--mono);margin-bottom:10px;">include statuses:</div>
    <div style="display:flex;gap:14px;margin-bottom:12px;flex-wrap:wrap;">
      <label style="display:flex;align-items:center;gap:6px;font-family:var(--mono);font-size:12px;cursor:pointer;">
        <input type="checkbox" id="ex-new" checked onchange="buildExport()"> <span style="color:#aaa">new</span>
      </label>
      <label style="display:flex;align-items:center;gap:6px;font-family:var(--mono);font-size:12px;cursor:pointer;">
        <input type="checkbox" id="ex-noted" checked onchange="buildExport()"> <span style="color:#cc9944">noted</span>
      </label>
      <label style="display:flex;align-items:center;gap:6px;font-family:var(--mono);font-size:12px;cursor:pointer;">
        <input type="checkbox" id="ex-planned" onchange="buildExport()"> <span style="color:#6699cc">planned</span>
      </label>
      <label style="display:flex;align-items:center;gap:6px;font-family:var(--mono);font-size:12px;cursor:pointer;">
        <input type="checkbox" id="ex-done" onchange="buildExport()"> <span style="color:#66bb66">done</span>
      </label>
    </div>
    <div style="font-size:12px;color:var(--dim);font-family:var(--mono);margin-bottom:8px;">paste this into your Claude chat:</div>
    <textarea class="export-textarea" id="export-text" readonly></textarea>
    <div class="export-actions">
      <button class="btn-copy" onclick="copyExport()">copy to clipboard</button>
      <button onclick="toggleExport()">close</button>
      <span id="copy-confirm" style="font-size:11px;font-family:var(--mono);color:var(--green);display:none;">✓ copied!</span>
    </div>
  </div>

  <!-- Filters -->
  <div class="filter-bar">
    <button class="tab active" onclick="setFilter('all',this)">all <span class="count-badge" id="cnt-all">0</span></button>
    <button class="tab" onclick="setFilter('new',this)">new <span class="count-badge" id="cnt-new">0</span></button>
    <button class="tab" onclick="setFilter('noted',this)">noted <span class="count-badge" id="cnt-noted">0</span></button>
    <button class="tab" onclick="setFilter('planned',this)">planned <span class="count-badge" id="cnt-planned">0</span></button>
    <button class="tab" onclick="setFilter('done',this)">done <span class="count-badge" id="cnt-done">0</span></button>
    <button class="tab" onclick="setFilter('bug',this)">🐛 bugs</button>
    <button class="tab" onclick="setFilter('suggestion',this)">💡 suggestions</button>
    <input class="search-input" placeholder="search…" oninput="applySearch(this.value)">
  </div>
  <div class="item-count" id="item-count"></div>
  <div class="feedback-list" id="feedback-list">
    <div class="empty">loading…</div>
  </div>
</div>

<script>
const SUPABASE_URL = 'https://tngvginwtsldulqgufoe.supabase.co';
const SUPABASE_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InRuZ3ZnaW53dHNsZHVscWd1Zm9lIiwicm9sZSI6ImFub24iLCJpYXQiOjE3Nzg5NTc3NTAsImV4cCI6MjA5NDUzMzc1MH0.4NzjqjdB_56gtbt_lf3ZAiE6Gfn0zpaZC36hIcjmIMI';
const db = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

let all=[], activeFilter='all', activeSearch='';
let currentUser=null, userRole='';
const TYPE_EMOJI={bug:'🐛',suggestion:'💡',question:'❓'};

async function init(){
  // getSession() is more reliable than onAuthStateChange inside iframes
  const{data:{session}}=await db.auth.getSession();
  currentUser=session?.user||null;
  if(currentUser){
    const{data}=await db.from('user_roles').select('role').eq('user_id',currentUser.id).maybeSingle();
    userRole=data?.role||'';
  }
  load();
}

async function load(){
  const{data}=await db.from('feedback').select('*').order('created_at',{ascending:false});
  all=data||[];
  updateCounts();
  render();
}

function updateCounts(){
  document.getElementById('cnt-all').textContent=all.length;
  ['new','noted','planned','done'].forEach(s=>{
    const el=document.getElementById('cnt-'+s);
    if(el) el.textContent=all.filter(f=>f.status===s).length;
  });
}

function setFilter(f,btn){
  activeFilter=f;
  document.querySelectorAll('.tab').forEach(t=>t.classList.remove('active'));
  btn.classList.add('active');
  render();
}
function applySearch(q){ activeSearch=q.toLowerCase(); render(); }

function render(){
  let items=all;
  if(activeFilter==='bug'||activeFilter==='suggestion'||activeFilter==='question')
    items=items.filter(f=>f.type===activeFilter);
  else if(activeFilter!=='all')
    items=items.filter(f=>f.status===activeFilter);
  if(activeSearch) items=items.filter(f=>
    f.description?.toLowerCase().includes(activeSearch)||
    f.page?.toLowerCase().includes(activeSearch)||
    f.notes?.toLowerCase().includes(activeSearch)||
    f.title?.toLowerCase().includes(activeSearch)
  );
  const countEl=document.getElementById('item-count');
  if(countEl) countEl.textContent=`${items.length} item${items.length===1?'':'s'}`;
  const listEl=document.getElementById('feedback-list');
  if(!listEl) return;
  if(!items.length){ listEl.innerHTML=`<div class="empty">nothing here yet</div>`; return; }
  try{
    listEl.innerHTML=items.map(f=>buildCard(f)).join('');
  }catch(err){
    listEl.innerHTML=`<div class="empty" style="color:#e06060">Render error: ${err.message}</div>`;
    console.error('Feedback render error:',err);
  }
}

function buildCard(f){
  const typeColor=f.type==='bug'?'var(--bug)':f.type==='suggestion'?'var(--suggest)':'var(--question)';
  const pageSpan=f.page?`<span class="fb-page">${f.page}</span>`:'';
  const titleDiv=f.title
    ? `<div style="font-weight:bold;font-size:14px;color:var(--parchment);margin-bottom:3px;">${f.title}</div>`
    : `<div style="display:flex;gap:6px;align-items:center;margin-bottom:3px;">
        <input id="ti-${f.id}" type="text" placeholder="title…" onkeydown="if(event.key==='Enter')saveTitle(${f.id})"
          style="flex:1;background:rgba(80,58,36,.4);border:1px dashed var(--brown3);color:var(--parchment);font-family:var(--mono);font-size:12px;padding:3px 8px;border-radius:3px;outline:none;">
        <button onclick="saveTitle(${f.id})" style="background:none;border:1px solid var(--brown3);color:var(--dim);font-family:var(--mono);font-size:10px;padding:3px 9px;border-radius:3px;cursor:pointer;" onmouseover="this.style.borderColor='var(--green3)'" onmouseout="this.style.borderColor='var(--brown3)'">save</button>
      </div>`;
  const descDiv=f.description?`<div class="fb-desc">${f.description}</div>`:'';
  const notesNote=f.notes?' · <em>has notes</em>':'';
  const meta=`<div class="fb-meta">by ${f.submitter||'anonymous'} · ${new Date(f.created_at).toLocaleDateString()}${notesNote}</div>`;
  const statusBtns=['new','noted','planned','done'].map(s=>
    `<button class="status-btn ${f.status===s?'active-status':''}" onclick="setStatus(${f.id},'${s}',this)">${s}</button>`
  ).join('');
  const promoteForm=`<div id="promote-form-${f.id}" style="display:none;margin-top:10px;padding-top:10px;border-top:1px solid var(--brown3);">
    <div style="font-size:11px;font-family:var(--mono);color:var(--dim);margin-bottom:8px;text-transform:uppercase;letter-spacing:.05em;">add to roadmap as</div>
    <div style="display:flex;gap:8px;flex-wrap:wrap;margin-bottom:8px;">
      <select id="pr-sys-${f.id}" style="background:var(--brown);border:1px solid var(--brown3);color:var(--parchment);font-family:var(--mono);font-size:12px;padding:5px 8px;border-radius:4px;flex:1;">
        <option value="lodge">Lodge</option><option value="organ">Organ</option>
        <option value="library">Library</option><option value="cards">Cards</option><option value="engine">Engine</option>
      </select>
      <select id="pr-status-${f.id}" style="background:var(--brown);border:1px solid var(--brown3);color:var(--parchment);font-family:var(--mono);font-size:12px;padding:5px 8px;border-radius:4px;">
        <option value="idea">idea</option><option value="active">active</option>
      </select>
    </div>
    <div style="display:flex;gap:8px;align-items:center;">
      <button onclick="promoteToRoadmap(${f.id})" style="background:var(--brown3);border:1px solid var(--green3);color:var(--green);font-family:var(--mono);font-size:12px;padding:5px 14px;border-radius:4px;cursor:pointer;">confirm</button>
      <button onclick="togglePromote(${f.id})" style="background:none;border:1px solid var(--brown3);color:var(--dim);font-family:var(--mono);font-size:12px;padding:5px 10px;border-radius:4px;cursor:pointer;">cancel</button>
      <span id="pr-msg-${f.id}" style="font-size:11px;font-family:var(--mono);color:var(--green);"></span>
    </div>
  </div>`;
  const doneWrap=f.status==='done'?'margin-left:22px;background:rgba(80,105,90,.1);border-color:rgba(80,105,90,.4);':'';
  return `<div class="fb-card" id="fbc-${f.id}" style="${doneWrap}">
    <div class="fb-main" onclick="toggleDetail(${f.id})">
      <div class="fb-type-dot" style="background:${typeColor}"></div>
      <div class="fb-body">
        <div class="fb-header">${pageSpan}
          <span class="fb-type ${f.type}">${TYPE_EMOJI[f.type]||''} ${f.type}</span>
          <span class="fb-status ${f.status}">${f.status}</span>
        </div>
        ${titleDiv}${descDiv}${meta}
      </div>
      <div class="fb-expand">›</div>
    </div>
    <div class="fb-detail" id="fbd-${f.id}">
      <div class="fb-notes-label">archmage notes</div>
      <textarea class="fb-notes" id="fbn-${f.id}" placeholder="Add notes here...">${f.notes||''}</textarea>
      <div class="fb-actions">
        <span style="font-size:11px;color:var(--dim);font-family:var(--mono)">status:</span>
        ${statusBtns}
        <button class="save-note-btn" onclick="saveNote(${f.id})">save notes</button>
        <span class="note-saved" id="saved-${f.id}"></span>
        <button class="save-note-btn" id="promote-btn-${f.id}" onclick="togglePromote(${f.id})" style="margin-left:auto;border-color:rgba(80,105,90,.6);color:var(--green);">to roadmap</button>
      </div>
      ${promoteForm}
    </div>
  </div>`;
}

async function saveTitle(id){
  const inp=document.getElementById('ti-'+id);
  if(!inp) return;
  const title=inp.value.trim();
  if(!title) return;
  inp.disabled=true;
  await db.from('feedback').update({title}).eq('id',id);
  const item=all.find(f=>f.id===id);
  if(item) item.title=title;
  render();
}

function toggleDetail(id){
  const d=document.getElementById('fbd-'+id);
  const e=document.querySelector(`#fbc-${id} .fb-expand`);
  d.classList.toggle('open');
  e.textContent=d.classList.contains('open')?'∨':'›';
}

async function setStatus(id, status, btn){
  await db.from('feedback').update({status}).eq('id',id);
  const item=all.find(f=>f.id===id);
  if(item) item.status=status;
  // Update button styles in card
  btn.closest('.fb-actions').querySelectorAll('.status-btn').forEach(b=>b.classList.remove('active-status'));
  btn.classList.add('active-status');
  // Update badge
  const badge=document.querySelector(`#fbc-${id} .fb-status`);
  if(badge){ badge.className=`fb-status ${status}`; badge.textContent=status; }
  updateCounts();
}

async function saveNote(id){
  const text=document.getElementById('fbn-'+id).value;
  await db.from('feedback').update({notes:text}).eq('id',id);
  const item=all.find(f=>f.id===id);
  if(item) item.notes=text;
  const el=document.getElementById('saved-'+id);
  el.style.display='inline'; el.textContent='✓ saved';
  setTimeout(()=>el.style.display='none',2000);
}

// ── Export ──────────────────────────────────────────────────────────────────
function toggleExport(){
  const panel=document.getElementById('export-panel');
  if(panel.classList.toggle('open')) buildExport();
}

function buildExport(){
  const date=new Date().toLocaleDateString('en-US',{month:'long',day:'numeric',year:'numeric'});
  let md=`## TricknoLodge Feedback — ${date}\n\n`;
  const statuses=[
    {k:'new',    label:'🔴 New',    cb:'ex-new'},
    {k:'noted',  label:'🟡 Noted',  cb:'ex-noted'},
    {k:'planned',label:'🔵 Planned',cb:'ex-planned'},
    {k:'done',   label:'🟢 Done',   cb:'ex-done'},
  ];
  statuses.forEach(({k,label,cb})=>{
    const el=document.getElementById(cb);
    if(el&&!el.checked) return;
    const items=all.filter(f=>f.status===k);
    if(!items.length) return;
    md+=`### ${label}\n\n`;
    items.forEach(f=>{
      md+=`**[${f.page||'General'}]** ${TYPE_EMOJI[f.type]||''} ${f.type.toUpperCase()} — ${f.description}\n`;
      if(f.notes) md+=`> ${f.notes}\n`;
      md+=`*by ${f.submitter||'anonymous'} · ${new Date(f.created_at).toLocaleDateString()}*\n\n`;
    });
  });
  document.getElementById('export-text').value=md;
}

function copyExport(){
  const ta=document.getElementById('export-text');
  navigator.clipboard.writeText(ta.value).then(()=>{
    const c=document.getElementById('copy-confirm');
    c.style.display='inline';
    setTimeout(()=>c.style.display='none',2000);
  });
}

function togglePromote(id){
  const f=document.getElementById('promote-form-'+id);
  if(f) f.style.display=f.style.display==='none'?'block':'none';
}

async function promoteToRoadmap(id){
  const item=all.find(f=>f.id===id);
  if(!item) return;
  const sys=document.getElementById('pr-sys-'+id)?.value||'lodge';
  const status=document.getElementById('pr-status-'+id)?.value||'idea';
  const msg=document.getElementById('pr-msg-'+id);
  if(msg){msg.textContent='promoting…';msg.style.color='var(--dim)';}
  const title=item.title||item.description?.slice(0,60)||'Untitled';
  const parts=[item.description];
  if(item.page&&item.page!=='General') parts.push(`From: ${item.page}`);
  if(item.submitter) parts.push(`Submitted by: ${item.submitter}`);
  const{error}=await db.from('roadmap').insert({
    title, description:parts.filter(Boolean).join('\n'),
    system:sys, status, sort_order:999
  });
  if(error){if(msg){msg.textContent=`Error: ${error.message}`;msg.style.color='#e06060';}return;}
  if(msg){msg.textContent='✓ Added to roadmap!';msg.style.color='var(--green)';}
  const btn=document.getElementById('promote-btn-'+id);
  if(btn){btn.textContent='✓ on roadmap';btn.style.color='var(--green)';btn.disabled=true;}
  setTimeout(()=>{const f=document.getElementById('promote-form-'+id);if(f)f.style.display='none';},1800);
}

init();
</script>
</body>
</html>
