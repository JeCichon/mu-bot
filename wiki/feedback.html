<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Feedback · TricknoLodge</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
  *,*::before,*::after{box-sizing:border-box;margin:0;padding:0;}
  :root{
    --green:rgb(144,171,153);--green2:rgb(110,135,118);--green3:rgb(80,105,90);
    --brown:rgb(43,28,16);--brown2:rgb(60,42,26);--brown3:rgb(80,58,36);
    --purple:rgb(76,46,87);--purple2:rgb(100,65,112);
    --parchment:rgb(220,210,190);--parchment2:rgb(200,188,168);
    --dim:rgb(120,100,80);--gold:rgb(201,169,110);
    --bug:#cc4444;--suggest:#4477cc;--question:#aa66cc;
    --new:#555;--noted:#886622;--planned:#225588;--done:#336633;
    --mono:'Courier New',Courier,monospace;--serif:Georgia,'Times New Roman',serif;
  }
  body{background:var(--brown);color:var(--parchment);font-family:var(--serif);font-size:14px;min-height:100vh;}
  header{background:var(--brown2);border-bottom:2px solid var(--purple);padding:12px 24px;display:flex;align-items:center;gap:14px;flex-wrap:wrap;}
  .back-link{color:var(--green);text-decoration:none;font-family:var(--mono);font-size:12px;}
  .back-link:hover{color:var(--parchment);}
  .page-title{font-size:18px;color:var(--green);font-weight:normal;letter-spacing:0.08em;}
  .page-sub{font-size:11px;color:var(--dim);font-family:var(--mono);}
  .header-right{margin-left:auto;display:flex;gap:8px;}

  button{background:var(--brown3);border:1px solid var(--brown3);color:var(--parchment);font-family:var(--mono);font-size:12px;padding:6px 14px;border-radius:4px;cursor:pointer;transition:border-color .15s;}
  button:hover{border-color:var(--green3);}
  .btn-export{background:var(--purple);border-color:var(--purple2);color:var(--parchment);}
  .btn-export:hover{background:var(--purple2);}

  .wrap{max-width:900px;margin:0 auto;padding:20px;}

  /* Filter tabs */
  .filter-bar{display:flex;gap:6px;margin-bottom:16px;flex-wrap:wrap;align-items:center;}
  .tab{background:var(--brown2);border:1px solid var(--brown3);color:var(--dim);font-family:var(--mono);font-size:11px;padding:4px 12px;border-radius:16px;cursor:pointer;letter-spacing:0.04em;}
  .tab:hover,.tab.active{border-color:var(--green);color:var(--green);background:var(--brown3);}
  .count-badge{font-size:10px;background:var(--brown3);padding:1px 5px;border-radius:8px;margin-left:4px;color:var(--dim);}
  .search-input{margin-left:auto;background:var(--brown2);border:1px solid var(--brown3);color:var(--parchment);font-family:var(--mono);font-size:12px;padding:5px 10px;border-radius:4px;outline:none;width:180px;}
  .search-input:focus{border-color:var(--green3);}
  .search-input::placeholder{color:var(--dim);}
  .item-count{font-size:11px;color:var(--dim);font-family:var(--mono);margin-bottom:12px;}

  /* Feedback cards */
  .feedback-list{display:flex;flex-direction:column;gap:8px;}
  .fb-card{background:var(--brown2);border:1px solid var(--brown3);border-radius:6px;overflow:hidden;transition:border-color .15s;}
  .fb-card:hover{border-color:var(--brown3);}
  .fb-main{display:flex;gap:10px;padding:12px 14px;cursor:pointer;align-items:flex-start;}
  .fb-type-dot{width:8px;height:8px;border-radius:50%;flex-shrink:0;margin-top:5px;}
  .fb-body{flex:1;min-width:0;}
  .fb-header{display:flex;gap:8px;align-items:center;margin-bottom:4px;flex-wrap:wrap;}
  .fb-page{font-size:11px;font-family:var(--mono);background:var(--brown3);padding:2px 8px;border-radius:10px;color:var(--parchment2);}
  .fb-type{font-size:10px;font-family:var(--mono);padding:2px 7px;border-radius:10px;font-weight:bold;letter-spacing:0.04em;}
  .fb-type.bug{background:rgba(204,68,68,.2);color:var(--bug);border:1px solid rgba(204,68,68,.3);}
  .fb-type.suggestion{background:rgba(68,119,204,.2);color:var(--suggest);border:1px solid rgba(68,119,204,.3);}
  .fb-type.question{background:rgba(170,102,204,.2);color:var(--question);border:1px solid rgba(170,102,204,.3);}
  .fb-status{font-size:10px;font-family:var(--mono);padding:2px 7px;border-radius:10px;}
  .fb-status.new{background:rgba(85,85,85,.3);color:#aaa;}
  .fb-status.noted{background:rgba(136,102,34,.3);color:#cc9944;}
  .fb-status.planned{background:rgba(34,85,136,.3);color:#6699cc;}
  .fb-status.done{background:rgba(51,102,51,.3);color:#66bb66;}
  .fb-type.branch{background:rgba(80,105,90,.2);color:var(--green2);border:1px solid rgba(80,105,90,.35);}
  .branch-link{font-size:11px;font-family:var(--mono);color:var(--green3);margin-top:5px;display:flex;align-items:center;gap:5px;flex-wrap:wrap;}
  .branch-link a{color:var(--green2);cursor:pointer;text-decoration:none;}
  .branch-link a:hover{color:var(--parchment);}
  .branch-badge{font-size:10px;background:rgba(80,105,90,.15);border:1px solid rgba(80,105,90,.3);padding:1px 7px;border-radius:8px;color:var(--green3);}
  .fb-status.passive{background:rgba(100,0,30,.25);color:#cc4455;}
  @keyframes passivePulse{
    0%,100%{box-shadow:0 0 5px rgba(139,0,30,.3),0 0 10px rgba(139,0,30,.1);}
    50%{box-shadow:0 0 10px rgba(139,0,30,.55),0 0 20px rgba(139,0,30,.25);}
  }
  /* Done card collapse */
  .fb-card.done-card{transition:margin-left .2s,opacity .2s;}
  .collapse-btn{background:none;border:none;color:var(--dim);cursor:pointer;font-size:14px;padding:0 4px;margin-left:auto;line-height:1;}
  .collapse-btn:hover{color:var(--parchment);}
  .fb-card.collapsed .fb-desc,.fb-card.collapsed .fb-meta{display:none;}
  .fb-card.collapsed .fb-detail{display:none!important;}
  .fb-card.collapsed .fb-main{opacity:.55;}
  /* Drag highlight */
  .fb-card.drag-over{border-color:var(--gold)!important;box-shadow:0 0 8px rgba(201,169,110,.3);}
  .drag-handle{cursor:grab;color:var(--brown3);font-size:15px;padding:0 8px;display:flex;align-items:center;flex-shrink:0;user-select:none;border-right:1px solid var(--brown3);margin-right:2px;}
  .drag-handle:hover{color:var(--dim);}
  .drag-handle:active{cursor:grabbing;}
  .fb-card-inner{flex:1;min-width:0;}
  /* Planned: outdented + glowing border to signal "needs attention" */
  @keyframes plannedPulse{
    0%,100%{box-shadow:0 0 6px rgba(201,169,110,.45),0 0 14px rgba(201,169,110,.2);}
    50%{box-shadow:0 0 14px rgba(201,169,110,.8),0 0 28px rgba(201,169,110,.4);}
  }
  .fb-desc{font-size:13px;color:var(--parchment);line-height:1.5;margin-bottom:4px;}
  .fb-meta{font-size:11px;color:var(--dim);font-family:var(--mono);}
  .fb-expand{font-size:14px;color:var(--dim);padding:4px;flex-shrink:0;user-select:none;}
  .fb-detail{display:none;padding:0 14px 14px;border-top:1px solid var(--brown3);}
  .fb-detail.open{display:block;}
  .fb-notes-label{font-size:11px;color:var(--dim);font-family:var(--mono);letter-spacing:0.06em;text-transform:uppercase;margin-bottom:5px;margin-top:10px;}
  .fb-notes{width:100%;background:var(--brown);border:1px solid var(--brown3);color:var(--parchment);font-family:var(--serif);font-size:13px;padding:8px 10px;border-radius:4px;outline:none;resize:vertical;min-height:60px;}
  .fb-notes:focus{border-color:var(--green3);}
  .fb-actions{display:flex;gap:6px;margin-top:10px;flex-wrap:wrap;align-items:center;}
  .status-btn{font-size:11px;padding:4px 10px;}
  .status-btn.active-status{border-color:var(--green);color:var(--green);}
  .save-note-btn{background:var(--brown3);border:1px solid var(--green3);color:var(--green);font-size:11px;padding:4px 12px;}
  .save-note-btn:hover{background:rgba(80,105,90,.2);}
  .note-saved{font-size:11px;font-family:var(--mono);color:var(--green);margin-left:6px;}

  /* Export panel */
  .export-panel{display:none;background:var(--brown2);border:1px solid var(--purple);border-radius:6px;padding:16px;margin-bottom:16px;}
  .export-panel.open{display:block;}
  .export-textarea{width:100%;background:var(--brown);border:1px solid var(--brown3);color:var(--parchment);font-family:var(--mono);font-size:11px;padding:10px;border-radius:4px;min-height:200px;resize:vertical;outline:none;}
  .export-actions{display:flex;gap:8px;margin-top:10px;}
  .btn-copy{background:var(--green3);border:1px solid var(--green3);color:var(--parchment);}
  .btn-copy:hover{background:var(--green2);}

  /* Phases strip */
  .phases-strip{background:var(--brown2);border:1px solid var(--brown3);border-radius:6px;padding:10px 14px;margin-bottom:12px;}
  .phases-hdr{font-size:11px;color:var(--dim);font-family:var(--mono);text-transform:uppercase;letter-spacing:.06em;margin-bottom:8px;display:flex;align-items:center;gap:8px;cursor:pointer;user-select:none;}
  .phases-hdr:hover{color:var(--parchment);}
  .phase-chips{display:flex;flex-wrap:wrap;gap:6px;align-items:center;}
  .phase-chip{background:var(--brown);border:1px solid var(--brown3);border-radius:5px;padding:5px 10px;font-family:var(--mono);font-size:11px;display:flex;align-items:center;gap:7px;}
  .phase-chip.done{opacity:.45;filter:grayscale(.5);}
  .phase-chip-lbl{color:var(--gold);font-weight:bold;}
  .phase-chip-title{color:var(--parchment2);}
  .phase-chip-count{color:var(--dim);}
  .chip-done-btn{background:none;border:none;color:var(--dim);cursor:pointer;font-size:12px;padding:0;line-height:1;}
  .chip-done-btn:hover{color:var(--green);}
  .chip-new{background:none;border:1px dashed var(--brown3);color:var(--dim);cursor:pointer;padding:5px 10px;border-radius:5px;font-family:var(--mono);font-size:11px;}
  .chip-new:hover{border-color:var(--green3);color:var(--green);}
  .history-section{margin-top:16px;border-top:1px solid var(--brown3);padding-top:10px;}
  .history-hdr{font-size:11px;color:var(--dim);font-family:var(--mono);cursor:pointer;user-select:none;letter-spacing:.06em;}
  .history-hdr:hover{color:var(--parchment);}
  /* Phase tag on planned items */
  .phase-tag{font-size:10px;font-family:var(--mono);background:rgba(201,169,110,.12);color:var(--gold);border:1px solid rgba(201,169,110,.3);padding:1px 7px;border-radius:8px;margin-left:2px;}
  /* Phase picker */
  .phase-picker{margin-top:8px;padding:10px 0 4px;border-top:1px solid var(--brown3);display:none;}
  .phase-picker.open{display:block;}
  .phase-picker-title{font-size:11px;color:var(--dim);font-family:var(--mono);text-transform:uppercase;letter-spacing:.05em;margin-bottom:7px;}
  .phase-opts{display:flex;flex-wrap:wrap;gap:6px;}
  .phase-opt{background:var(--brown);border:1px solid var(--brown3);color:var(--parchment2);font-family:var(--mono);font-size:11px;padding:4px 11px;border-radius:4px;cursor:pointer;transition:border-color .15s;}
  .phase-opt:hover,.phase-opt.active-phase{border-color:var(--gold);color:var(--gold);}
  .phase-opt.create{border-style:dashed;color:var(--dim);}
  .phase-opt.create:hover{border-color:var(--green3);color:var(--green);}

  .empty{color:var(--dim);font-family:var(--mono);font-size:13px;font-style:italic;padding:30px;text-align:center;}

  ::-webkit-scrollbar{width:5px;}
  ::-webkit-scrollbar-track{background:var(--brown);}
  ::-webkit-scrollbar-thumb{background:var(--brown3);border-radius:3px;}

<script>
// Hide header when embedded
if(window.location.search.includes('embed=1')||window.self!==window.top){
  document.addEventListener('DOMContentLoaded',()=>{const h=document.querySelector('header');if(h)h.style.display='none';});
}
</script>
</style>
</head>
<body>
<header>
  <a class="back-link" href="index.html">← Lodge</a>
  <div>
    <div class="page-title">✎ Feedback</div>
    <div class="page-sub">bugs · suggestions · questions</div>
  </div>
  <div class="header-right">
    <button class="btn-export" onclick="toggleExport()">⬇ Export for AI</button>
  </div>
</header>

<div class="wrap">
  <!-- Export panel -->
  <div class="export-panel" id="export-panel">
    <div style="font-size:12px;color:var(--dim);font-family:var(--mono);margin-bottom:10px;">include statuses:</div>
    <div style="display:flex;gap:14px;margin-bottom:12px;flex-wrap:wrap;">
      <label style="display:flex;align-items:center;gap:6px;font-family:var(--mono);font-size:12px;cursor:pointer;">
        <input type="checkbox" id="ex-new" checked onchange="buildExport()"> <span style="color:#aaa">new</span>
      </label>
      <label style="display:flex;align-items:center;gap:6px;font-family:var(--mono);font-size:12px;cursor:pointer;">
        <input type="checkbox" id="ex-noted" checked onchange="buildExport()"> <span style="color:#cc9944">noted</span>
      </label>
      <label style="display:flex;align-items:center;gap:6px;font-family:var(--mono);font-size:12px;cursor:pointer;">
        <input type="checkbox" id="ex-planned" onchange="buildExport()"> <span style="color:#6699cc">planned</span>
      </label>
      <label style="display:flex;align-items:center;gap:6px;font-family:var(--mono);font-size:12px;cursor:pointer;">
        <input type="checkbox" id="ex-done" onchange="buildExport()"> <span style="color:#66bb66">done</span>
      </label>
    </div>
    <div style="font-size:12px;color:var(--dim);font-family:var(--mono);margin-bottom:8px;">paste this into your Claude chat:</div>
    <textarea class="export-textarea" id="export-text" readonly></textarea>
    <div class="export-actions">
      <button class="btn-copy" onclick="copyExport()">copy to clipboard</button>
      <button onclick="toggleExport()">close</button>
      <span id="copy-confirm" style="font-size:11px;font-family:var(--mono);color:var(--green);display:none;">✓ copied!</span>
    </div>
  </div>

  <!-- Phases strip (archmage only) -->
  <div class="phases-strip" id="phases-strip" style="display:none;">
    <div class="phases-hdr" onclick="togglePhasesStrip()">
      <span id="phases-hdr-text">ACTIVE PHASES</span>
      <span id="phases-toggle" style="color:var(--dim);font-size:10px;">▾</span>
    </div>
    <div id="phases-body">
      <div class="phase-chips" id="phase-chips"></div>
      <div class="history-section" id="history-section" style="display:none;">
        <div class="history-hdr" onclick="toggleHistory()">◈ history <span id="hist-toggle">▸</span></div>
        <div id="history-chips" style="display:none;margin-top:8px;"></div>
      </div>
    </div>
  </div>

  <!-- Filters -->
  <div class="filter-bar">
    <button class="tab active" onclick="setFilter('all',this)">all <span class="count-badge" id="cnt-all">0</span></button>
    <button class="tab" onclick="setFilter('new',this)">new <span class="count-badge" id="cnt-new">0</span></button>
    <button class="tab" onclick="setFilter('noted',this)">noted <span class="count-badge" id="cnt-noted">0</span></button>
    <button class="tab" onclick="setFilter('planned',this)">planned <span class="count-badge" id="cnt-planned">0</span></button>
    <button class="tab" onclick="setFilter('passive',this)">passive <span class="count-badge" id="cnt-passive">0</span></button>
    <button class="tab" onclick="setFilter('done',this)">done <span class="count-badge" id="cnt-done">0</span></button>
    <button class="tab" onclick="setFilter('bug',this)">🐛 bugs</button>
    <button class="tab" onclick="setFilter('suggestion',this)">💡 suggestions</button>
    <input class="search-input" placeholder="search…" oninput="applySearch(this.value)">
  </div>
  <div class="item-count" id="item-count"></div>
  <div class="feedback-list" id="feedback-list">
    <div class="empty">loading…</div>
  </div>
</div>

<script>
const SUPABASE_URL = 'https://tngvginwtsldulqgufoe.supabase.co';
const SUPABASE_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InRuZ3ZnaW53dHNsZHVscWd1Zm9lIiwicm9sZSI6ImFub24iLCJpYXQiOjE3Nzg5NTc3NTAsImV4cCI6MjA5NDUzMzc1MH0.4NzjqjdB_56gtbt_lf3ZAiE6Gfn0zpaZC36hIcjmIMI';
const db = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

let all=[], activeFilter='all', activeSearch='';
let currentUser=null, userRole='';
let allPhases=[];
const TYPE_EMOJI={bug:'🐛',suggestion:'💡',question:'❓'};

async function init(){
  // getSession() is more reliable than onAuthStateChange inside iframes
  const{data:{session}}=await db.auth.getSession();
  currentUser=session?.user||null;
  if(currentUser){
    const{data}=await db.from('user_roles').select('role').eq('user_id',currentUser.id).maybeSingle();
    userRole=data?.role||'';
  }
  load();
}

async function load(){
  const[fbRes,phRes]=await Promise.all([
    db.from('feedback').select('*').order('sort_order',{ascending:true}).order('created_at',{ascending:false}),
    db.from('feedback_phases').select('*').order('group_num').order('phase_letter')
  ]);
  all=fbRes.data||[];
  allPhases=phRes.data||[];
  updateCounts();
  render();
  if(userRole==='archmage') renderPhases();
}

function updateCounts(){
  document.getElementById('cnt-all').textContent=all.length;
  ['new','noted','passive','planned','done'].forEach(s=>{
    const el=document.getElementById('cnt-'+s);
    if(el) el.textContent=all.filter(f=>f.status===s).length;
  });
}

function setFilter(f,btn){
  activeFilter=f;
  document.querySelectorAll('.tab').forEach(t=>t.classList.remove('active'));
  btn.classList.add('active');
  render();
}
function applySearch(q){ activeSearch=q.toLowerCase(); render(); }

function render(){
  let items=all;
  if(activeFilter==='bug'||activeFilter==='suggestion'||activeFilter==='question')
    items=items.filter(f=>f.type===activeFilter);
  else if(activeFilter!=='all')
    items=items.filter(f=>f.status===activeFilter);
  if(activeSearch) items=items.filter(f=>
    f.description?.toLowerCase().includes(activeSearch)||
    f.page?.toLowerCase().includes(activeSearch)||
    f.notes?.toLowerCase().includes(activeSearch)||
    f.title?.toLowerCase().includes(activeSearch)
  );
  const countEl=document.getElementById('item-count');
  if(countEl) countEl.textContent=`${items.length} item${items.length===1?'':'s'}`;
  const listEl=document.getElementById('feedback-list');
  if(!listEl) return;
  if(!items.length){ listEl.innerHTML=`<div class="empty">nothing here yet</div>`; return; }
  try{
    listEl.innerHTML=items.map(f=>buildCard(f)).join('');
    checkAutoCollapse();
    enableDragSort();
  }catch(err){
    listEl.innerHTML=`<div class="empty" style="color:#e06060">Render error: ${err.message}</div>`;
    console.error('Feedback render error:',err);
  }
}

function buildCard(f){
  const typeColor=f.type==='bug'?'var(--bug)':f.type==='suggestion'?'var(--suggest)':'var(--question)';
  const pageSpan=f.page?`<span class="fb-page">${f.page}</span>`:'';
  const titleDiv=f.title
    ? `<div style="font-weight:bold;font-size:14px;color:var(--parchment);margin-bottom:3px;">${f.title}</div>`
    : `<div style="display:flex;gap:6px;align-items:center;margin-bottom:3px;">
        <input id="ti-${f.id}" type="text" placeholder="title…" onkeydown="if(event.key==='Enter')saveTitle(${f.id})"
          style="flex:1;background:rgba(80,58,36,.4);border:1px dashed var(--brown3);color:var(--parchment);font-family:var(--mono);font-size:12px;padding:3px 8px;border-radius:3px;outline:none;">
        <button onclick="saveTitle(${f.id})" style="background:none;border:1px solid var(--brown3);color:var(--dim);font-family:var(--mono);font-size:10px;padding:3px 9px;border-radius:3px;cursor:pointer;" onmouseover="this.style.borderColor='var(--green3)'" onmouseout="this.style.borderColor='var(--brown3)'">save</button>
      </div>`;
  const descDiv=f.description?`<div class="fb-desc">${f.description}</div>`:'';
  // Branch lineage links
  const rootLink=f.branched_from?`<div class="branch-link">🌿 root: <a onclick="scrollToPanel(${f.branched_from})">#${f.branched_from}</a></div>`:'';
  const branchLink=f.branched_to?`<div class="branch-link">🌿 branch: <a onclick="scrollToPanel(${f.branched_to})">#${f.branched_to}</a></div>`:'';
  const notesNote=f.notes?' · <em>has notes</em>':'';
  const meta=`<div class="fb-meta">by ${f.submitter||'anonymous'} · ${new Date(f.created_at).toLocaleDateString()}${notesNote}</div>`;
  const phaseMap=allPhases.reduce((m,p)=>{m[p.id]=p;return m;},{});
  const fPhase=f.phase_id&&phaseMap[f.phase_id]?phaseMap[f.phase_id]:null;
  const phaseTag=fPhase?`<span class="phase-tag">G${fPhase.group_num}·${fPhase.phase_letter}</span>`:'';
  const isCollapsed=f.status==='done'&&localStorage.getItem('fc_'+f.id)==='1';
  const collapseBtn=f.status==='done'
    ?`<button class="collapse-btn" onclick="toggleCollapse(${f.id},this)" title="${isCollapsed?'Expand':'Collapse'}">${isCollapsed?'›':'‹'}</button>`:'';
  const statusBtns=['new','noted','passive','planned','done'].map(s=>
    `<button class="status-btn ${f.status===s?'active-status':''}" onclick="handleStatusClick(${f.id},'${s}',this)">${s}</button>`
  ).join('');
  const promoteForm=`<div id="promote-form-${f.id}" style="display:none;margin-top:10px;padding-top:10px;border-top:1px solid var(--brown3);">

// ── Phase system ─────────────────────────────────────────────────────────────
function handleStatusClick(id,status,btn){
  if(status==='planned'){
    // Show phase picker instead of directly setting status
    const picker=document.getElementById('ppick-'+id);
    if(!picker) return;
    const isOpen=picker.classList.contains('open');
    document.querySelectorAll('.phase-picker').forEach(p=>p.classList.remove('open'));
    if(isOpen) return;
    renderPhasePicker(id);
    picker.classList.add('open');
  } else {
    document.querySelectorAll('.phase-picker').forEach(p=>p.classList.remove('open'));
    setStatus(id,status,btn);
  }
}

function renderPhasePicker(feedbackId){
  const optsEl=document.getElementById('popts-'+feedbackId);
  if(!optsEl) return;
  const active=allPhases.filter(p=>p.status==='active');
  const item=all.find(f=>f.id===feedbackId);
  optsEl.innerHTML='';
  active.forEach(p=>{
    const btn=document.createElement('button');
    btn.className='phase-opt'+(item&&item.phase_id===p.id?' active-phase':'');
    btn.textContent=`G${p.group_num}·${p.phase_letter}${p.title?' — '+p.title:''}`;
    btn.onclick=()=>assignPhase(feedbackId,p.id);
    optsEl.appendChild(btn);
  });
  // Create new phase in latest active group
  const maxGroup=active.length>0?Math.max(...active.map(p=>p.group_num)):0;
  if(maxGroup>0){
    const nb=document.createElement('button');
    nb.className='phase-opt create';
    nb.textContent=`+ New Phase in Group ${maxGroup}`;
    nb.onclick=()=>showPhaseCreateForm(feedbackId,'phase',maxGroup);
    optsEl.appendChild(nb);
  }
  const gb=document.createElement('button');
  gb.className='phase-opt create';
  gb.textContent='+ New Phase Group';
  gb.onclick=()=>showPhaseCreateForm(feedbackId,'group',null);
  optsEl.appendChild(gb);
}

async function assignPhase(feedbackId,phaseId){
  await db.from('feedback').update({status:'planned',phase_id:phaseId}).eq('id',feedbackId);
  const item=all.find(f=>f.id===feedbackId); if(item){item.status='planned';item.phase_id=phaseId;}
  document.querySelectorAll('.phase-picker').forEach(p=>p.classList.remove('open'));
  updateCounts(); render(); renderPhases();
}

// Show inline create form inside the phase picker (no browser prompt)
function showPhaseCreateForm(feedbackId, mode, groupNum){
  const optsEl=document.getElementById('popts-'+feedbackId);
  if(!optsEl) return;
  // Remove any existing form
  const old=optsEl.querySelector('.phase-create-form');
  if(old) old.remove();

  const existing=allPhases.filter(p=>p.group_num===groupNum);
  const nextLetter=mode==='group'?'A':(existing.length===0?'A':String.fromCharCode(Math.max(...existing.map(p=>p.phase_letter.charCodeAt(0)))+1));
  const targetGroup=mode==='group'?(allPhases.length>0?Math.max(...allPhases.map(p=>p.group_num))+1:1):groupNum;
  const label=mode==='group'?`Group ${targetGroup} · Phase A`:`Group ${groupNum} · Phase ${nextLetter}`;

  const form=document.createElement('div');
  form.className='phase-create-form';
  form.style.cssText='display:flex;gap:6px;align-items:center;flex-wrap:wrap;margin-top:6px;width:100%;';
  const inp=document.createElement('input');
  inp.type='text'; inp.placeholder=`Name for ${label} (optional)`;
  inp.style.cssText='flex:1;min-width:140px;background:var(--brown);border:1px solid var(--brown3);color:var(--parchment);font-family:var(--mono);font-size:11px;padding:4px 8px;border-radius:4px;outline:none;';
  inp.addEventListener('focus',()=>inp.style.borderColor='var(--green3)');
  inp.addEventListener('blur',()=>inp.style.borderColor='var(--brown3)');
  inp.addEventListener('keydown',e=>{if(e.key==='Enter')doCreatePhase(feedbackId,mode,groupNum,nextLetter,targetGroup,inp.value.trim()||null);});
  const okBtn=document.createElement('button');
  okBtn.textContent='Create'; okBtn.className='phase-opt';
  okBtn.style.cssText='border-color:var(--green3);color:var(--green);';
  okBtn.onclick=()=>doCreatePhase(feedbackId,mode,groupNum,nextLetter,targetGroup,inp.value.trim()||null);
  const cancelBtn=document.createElement('button');
  cancelBtn.textContent='cancel'; cancelBtn.className='phase-opt';
  cancelBtn.onclick=()=>form.remove();
  form.append(inp,okBtn,cancelBtn);
  optsEl.appendChild(form);
  setTimeout(()=>inp.focus(),50);
}

async function doCreatePhase(feedbackId,mode,groupNum,nextLetter,targetGroup,title){
  const gn=mode==='group'?targetGroup:groupNum;
  const letter=mode==='group'?'A':nextLetter;
  const{data,error}=await db.from('feedback_phases').insert({group_num:gn,phase_letter:letter,title}).select().single();
  if(error){console.error('Phase create error:',error);return;}
  if(!data) return;
  allPhases.push(data);
  if(feedbackId) await assignPhase(feedbackId,data.id);
  else{ render(); renderPhases(); }
}

// Kept for the phases strip buttons (no feedbackId)
async function createPhase(groupNum,feedbackId){
  if(feedbackId){ showPhaseCreateForm(feedbackId,'phase',groupNum); return; }
  // From strip button — use inline form in strip
  const existing=allPhases.filter(p=>p.group_num===groupNum);
  const nextLetter=existing.length===0?'A':String.fromCharCode(Math.max(...existing.map(p=>p.phase_letter.charCodeAt(0)))+1);
  const title=await inlineStripPrompt(`Name for Group ${groupNum} Phase ${nextLetter} (optional)`);
  const{data,error}=await db.from('feedback_phases').insert({group_num:groupNum,phase_letter:nextLetter,title}).select().single();
  if(error||!data) return;
  allPhases.push(data); render(); renderPhases();
}

async function createGroup(feedbackId){
  if(feedbackId){ showPhaseCreateForm(feedbackId,'group',null); return; }
  const maxGroup=allPhases.length>0?Math.max(...allPhases.map(p=>p.group_num)):0;
  const newGroup=maxGroup+1;
  const title=await inlineStripPrompt(`Name for Group ${newGroup} Phase A (optional)`);
  const{data,error}=await db.from('feedback_phases').insert({group_num:newGroup,phase_letter:'A',title}).select().single();
  if(error||!data) return;
  allPhases.push(data); render(); renderPhases();
}

// Inline prompt for the phases strip (returns a promise)
function inlineStripPrompt(label){
  return new Promise(resolve=>{
    const chipsEl=document.getElementById('phase-chips');
    const old=chipsEl.querySelector('.strip-prompt'); if(old) old.remove();
    const wrap=document.createElement('div');
    wrap.className='strip-prompt';
    wrap.style.cssText='display:flex;gap:6px;align-items:center;flex-wrap:wrap;margin-top:6px;';
    const lbl=document.createElement('span');
    lbl.style.cssText='font-size:11px;color:var(--dim);font-family:var(--mono);';
    lbl.textContent=label+':';
    const inp=document.createElement('input');
    inp.type='text'; inp.placeholder='optional name';
    inp.style.cssText='background:var(--brown);border:1px solid var(--green3);color:var(--parchment);font-family:var(--mono);font-size:11px;padding:4px 8px;border-radius:4px;outline:none;flex:1;min-width:100px;';
    inp.addEventListener('keydown',e=>{ if(e.key==='Enter'){wrap.remove();resolve(inp.value.trim()||null);} if(e.key==='Escape'){wrap.remove();resolve(null);} });
    const ok=document.createElement('button'); ok.textContent='create'; ok.className='chip-new';
    ok.onclick=()=>{wrap.remove();resolve(inp.value.trim()||null);};
    const cx=document.createElement('button'); cx.textContent='cancel'; cx.className='chip-new';
    cx.onclick=()=>{wrap.remove();resolve(null);};
    wrap.append(lbl,inp,ok,cx); chipsEl.appendChild(wrap);
    setTimeout(()=>inp.focus(),50);
  });
}

async function markPhaseDone(phaseId){
  await db.from('feedback_phases').update({status:'done'}).eq('id',phaseId);
  const p=allPhases.find(x=>x.id===phaseId); if(p) p.status='done';
  renderPhases();
}

async function markGroupDone(groupNum){
  const phases=allPhases.filter(p=>p.group_num===groupNum);
  await Promise.all(phases.map(p=>db.from('feedback_phases').update({status:'done'}).eq('id',p.id)));
  phases.forEach(p=>p.status='done');
  renderPhases();
}

// ── Phases strip rendering ────────────────────────────────────────────────────
let phasesCollapsed=false, historyOpen=false;
function togglePhasesStrip(){
  phasesCollapsed=!phasesCollapsed;
  document.getElementById('phases-body').style.display=phasesCollapsed?'none':'block';
  document.getElementById('phases-toggle').textContent=phasesCollapsed?'▸':'▾';

function toggleHistory(){

  document.getElementById('hist-toggle').textContent=historyOpen?'▾':'▸';
  if(historyOpen) document.getElementById('history-chips').style.flexWrap='wrap';

function renderPhases(){
  const strip=document.getElementById('phases-strip');
  const chipsEl=document.getElementById('phase-chips');
  const historyEl=document.getElementById('history-chips');
  const histSection=document.getElementById('history-section');
  if(!strip||!chipsEl) return;
  strip.style.display='block';

  const active=allPhases.filter(p=>p.status==='active');
  const done=allPhases.filter(p=>p.status==='done');
  const phaseCounts={};
  all.forEach(f=>{ if(f.phase_id&&f.status==='planned') phaseCounts[f.phase_id]=(phaseCounts[f.phase_id]||0)+1; });

  // Group active phases by group_num
  const groups={};
  active.forEach(p=>{ if(!groups[p.group_num]) groups[p.group_num]=[]; groups[p.group_num].push(p); });

  chipsEl.innerHTML='';
  Object.entries(groups).forEach(([gn,phases])=>{
    const gDiv=document.createElement('div');
    gDiv.style.cssText='display:flex;align-items:center;gap:5px;flex-wrap:wrap;margin-bottom:3px;';
    const gLabel=document.createElement('span');
    gLabel.style.cssText='font-size:10px;color:var(--dim);font-family:var(--mono);';
    gLabel.textContent=`G${gn}:`;
    gDiv.appendChild(gLabel);
    phases.forEach(p=>{
      const chip=document.createElement('div');
      chip.className='phase-chip';
      const count=phaseCounts[p.id]||0;
      chip.innerHTML=`<span class="phase-chip-lbl">${p.phase_letter}</span>
        ${p.title?`<span class="phase-chip-title">${p.title}</span>`:''}
        <span class="phase-chip-count">(${count})</span>
        <button class="chip-done-btn" onclick="markPhaseDone(${p.id})" title="Mark Phase ${p.phase_letter} done">✓</button>`;
      gDiv.appendChild(chip);
    });
    // + New Phase button
    const np=document.createElement('button');
    np.className='chip-new'; np.textContent='+ Phase';
    np.onclick=()=>createPhase(parseInt(gn),null);
    gDiv.appendChild(np);
    // Group done button
    const gd=document.createElement('button');
    gd.className='chip-new'; gd.style.borderColor='rgba(80,105,90,.5)'; gd.style.color='var(--green2)';
    gd.textContent='Group done';
    gd.onclick=()=>{ if(confirm(`Mark all of Group ${gn} as done?`)) markGroupDone(parseInt(gn)); };
    gDiv.appendChild(gd);
    chipsEl.appendChild(gDiv);
  });

  // + New Group button
  const ng=document.createElement('button');
  ng.className='chip-new'; ng.textContent='+ New Group';
  ng.onclick=()=>createGroup(null);
  chipsEl.appendChild(ng);

  // History section
  if(done.length>0){
    histSection.style.display='block';
    const doneGroups={};
    done.forEach(p=>{ if(!doneGroups[p.group_num]) doneGroups[p.group_num]=[]; doneGroups[p.group_num].push(p); });
    historyEl.innerHTML=Object.entries(doneGroups).map(([gn,phases])=>
      `<div class="phase-chip done" style="gap:5px;">
        <span class="phase-chip-lbl" style="color:var(--dim)">G${gn}</span>
        <span class="phase-chip-title" style="color:var(--dim)">${phases.map(p=>p.phase_letter).join(',')} ✓</span>
      </div>`).join('');
  } else { histSection.style.display='none'; }
}

// ── Collapse, auto-collapse, drag sort ───────────────────────────────────────
function toggleCollapse(id,btn){
  const card=document.getElementById('fbc-'+id);
  if(!card) return;
  const collapsed=card.classList.toggle('collapsed');
  if(btn) btn.title=collapsed?'Expand':'Collapse';
  // Store explicit user choice (prevents auto-collapse from fighting manual choice)
  localStorage.setItem('fc_'+id, collapsed?'1':'0');
}

function checkAutoCollapse(){
  const THRESHOLD=24*60*60*1000; // 24h default
  const now=Date.now();
  all.filter(f=>f.status==='done').forEach(f=>{
    const storedPref=localStorage.getItem('fc_'+f.id);
    if(storedPref!==null) return; // user made explicit choice — respect it
    const doneTime=parseInt(localStorage.getItem('done_time_'+f.id)||'0');
    if(doneTime&&(now-doneTime)>THRESHOLD){
      const card=document.getElementById('fbc-'+f.id);
      if(card){ card.classList.add('collapsed'); localStorage.setItem('fc_'+f.id,'1'); }
    }
  });
}

async function saveDragOrder(){
  const cards=[...document.querySelectorAll('.fb-card[data-id]')];
  if(!cards.length) return;
  // Space by 10 so future items can slot in without full renumber
  const updates=cards.map((c,i)=>({id:parseInt(c.dataset.id),sort_order:i*10}));
  // Update local array to match new order
  updates.forEach(u=>{ const item=all.find(f=>f.id===u.id); if(item) item.sort_order=u.sort_order; });
  // Persist to DB in parallel
  await Promise.all(updates.map(u=>db.from('feedback').update({sort_order:u.sort_order}).eq('id',u.id)));
}

function enableDragSort(){
  let dragEl=null;
  // Only the handle initiates drag — rest of card stays text-selectable
  document.querySelectorAll('.drag-handle').forEach(handle=>{
    handle.setAttribute('draggable','true');
    const card=handle.closest('.fb-card');
    handle.addEventListener('dragstart',e=>{
      dragEl=card;
      setTimeout(()=>card.style.opacity='.4',0);
      e.dataTransfer.effectAllowed='move';
    });
    handle.addEventListener('dragend',()=>{
      if(dragEl) dragEl.style.opacity='1';
      dragEl=null;
      document.querySelectorAll('.fb-card').forEach(c=>c.classList.remove('drag-over'));
    });
  });
  document.querySelectorAll('.fb-card').forEach(card=>{
    card.addEventListener('dragover',e=>{
      e.preventDefault();
      if(!dragEl||card===dragEl) return;
      document.querySelectorAll('.fb-card').forEach(c=>c.classList.remove('drag-over'));
      card.classList.add('drag-over');
      const rect=card.getBoundingClientRect();
      if(e.clientY>rect.top+rect.height/2) card.after(dragEl);
      else card.before(dragEl);
    });
    card.addEventListener('dragleave',()=>card.classList.remove('drag-over'));
    card.addEventListener('drop',e=>{e.preventDefault();card.classList.remove('drag-over');saveDragOrder();});
  });
}

async function setStatus(id, status, btn){
  await db.from('feedback').update({status}).eq('id',id);
  const item=all.find(f=>f.id===id);
  if(item) item.status=status;
  // Track when item is first marked done (for auto-collapse)
  if(status==='done'&&!localStorage.getItem('done_time_'+id)){
    localStorage.setItem('done_time_'+id, Date.now().toString());
  }
  // Update button styles in card
  btn.closest('.fb-actions').querySelectorAll('.status-btn').forEach(b=>b.classList.remove('active-status'));
  btn.classList.add('active-status');
  // Update badge
  const badge=document.querySelector(`#fbc-${id} .fb-status`);
  if(badge){ badge.className=`fb-status ${status}`; badge.textContent=status; }
  updateCounts();
}

async function saveNote(id){
  const text=document.getElementById('fbn-'+id).value;
  await db.from('feedback').update({notes:text}).eq('id',id);
  const item=all.find(f=>f.id===id);
  if(item) item.notes=text;
  // Auto-promote new → noted when a note is first saved
  if(item&&item.status==='new'&&text.trim()){
    await db.from('feedback').update({status:'noted'}).eq('id',id);
    item.status='noted';
    const badge=document.querySelector('#fbc-'+id+' .fb-status');
    if(badge){badge.className='fb-status noted';badge.textContent='noted';}
    updateCounts();
  }
  const el=document.getElementById('saved-'+id);
  el.style.display='inline'; el.textContent='✓ saved';
  setTimeout(()=>el.style.display='none',2000);
}

function toggleExport(){
  const panel=document.getElementById('export-panel');
  if(panel.classList.toggle('open')) buildExport();

function buildExport(){
  const date=new Date().toLocaleDateString('en-US',{month:'long',day:'numeric',year:'numeric'});
  let md=`## TricknoLodge Feedback — ${date}\n\n`;
  const statuses=[
    {k:'new',    label:'🔴 New',    cb:'ex-new'},
    {k:'noted',  label:'🟡 Noted',  cb:'ex-noted'},
    {k:'planned',label:'🔵 Planned',cb:'ex-planned'},
    {k:'done',   label:'🟢 Done',   cb:'ex-done'},
  ];
  statuses.forEach(({k,label,cb})=>{
    const el=document.getElementById(cb);
    if(el&&!el.checked) return;
    const items=all.filter(f=>f.status===k);
    if(!items.length) return;
    md+=`### ${label}\n\n`;
    items.forEach(f=>{
      md+=`**[${f.page||'General'}]** ${TYPE_EMOJI[f.type]||''} ${f.type.toUpperCase()} — ${f.description}\n`;
      if(f.notes) md+=`> ${f.notes}\n`;
      md+=`*by ${f.submitter||'anonymous'} · ${new Date(f.created_at).toLocaleDateString()}*\n\n`;
    });
  });
  document.getElementById('export-text').value=md;
}

function copyExport(){
  const ta=document.getElementById('export-text');
  navigator.clipboard.writeText(ta.value).then(()=>{
    const c=document.getElementById('copy-confirm');
    c.style.display='inline';
    setTimeout(()=>c.style.display='none',2000);
  });
}

async function promoteToRoadmap(id){
  const item=all.find(f=>f.id===id);
  if(!item) return;
  const sys=document.getElementById('pr-sys-'+id)?.value||'lodge';
  const status=document.getElementById('pr-status-'+id)?.value||'idea';
  const msg=document.getElementById('pr-msg-'+id);
  if(msg){msg.textContent='promoting…';msg.style.color='var(--dim)';}
  const title=item.title||item.description?.slice(0,60)||'Untitled';
  const parts=[item.description];
  if(item.page&&item.page!=='General') parts.push(`From: ${item.page}`);
  if(item.submitter) parts.push(`Submitted by: ${item.submitter}`);
  const{error}=await db.from('roadmap').insert({
    title, description:parts.filter(Boolean).join('\n'),
    system:sys, status, sort_order:999
  });
  if(error){if(msg){msg.textContent=`Error: ${error.message}`;msg.style.color='#e06060';}return;}
  if(msg){msg.textContent='✓ Added to roadmap!';msg.style.color='var(--green)';}
  const btn=document.getElementById('promote-btn-'+id);
  if(btn){btn.textContent='✓ on roadmap';btn.style.color='var(--green)';btn.disabled=true;}
  setTimeout(()=>{const f=document.getElementById('promote-form-'+id);if(f)f.style.display='none';},1800);
}

// ── Branch system ─────────────────────────────────────────────────────────────
let _branchSourceId=null;

function openBranchModal(id){
  _branchSourceId=id;
  const source=all.find(f=>f.id===id);
  if(!source) return;
  const titleEl=document.getElementById('branch-title');
  if(titleEl) titleEl.value=(source.title||source.description?.slice(0,60)||'Untitled')+' — Branch';
  const pageEl=document.getElementById('branch-page');
  if(pageEl&&source.page){
    [...pageEl.options].forEach(o=>{if(o.text===source.page||o.value===source.page) pageEl.value=o.value;});
  }
  document.getElementById('branch-desc').value='';
  document.getElementById('branch-status').textContent='';
  const bg=document.getElementById('branch-modal-bg');
  bg.style.cssText='display:flex;align-items:center;justify-content:center;position:fixed;inset:0;background:rgba(0,0,0,.55);z-index:300;';
  setTimeout(()=>document.getElementById('branch-title')?.select(),50);
}
function closeBranchModal(){
  document.getElementById('branch-modal-bg').style.display='none';
  _branchSourceId=null;
}
async function submitBranch(){
  if(!_branchSourceId||!currentUser) return;
  const title=document.getElementById('branch-title').value.trim();
  const desc=document.getElementById('branch-desc').value.trim();
  const page=document.getElementById('branch-page').value;
  const status=document.getElementById('branch-status');
  if(!title){if(status){status.textContent='Title required.';status.style.color='#e06060';}return;}
  if(status){status.textContent='creating…';status.style.color='var(--dim)';}
  const{data:newPanel,error}=await db.from('feedback').insert({
    title, description:desc||'', page, type:'branch', status:'new',
    submitter:currentUser.user_metadata?.full_name||currentUser.user_metadata?.name||'archmage',
    user_id:currentUser.id, branched_from:_branchSourceId
  }).select().single();
  if(error||!newPanel){if(status){status.textContent='Error: '+(error?.message||'unknown');status.style.color='#e06060';}return;}
  await db.from('feedback').update({branched_to:newPanel.id}).eq('id',_branchSourceId);
  const src=all.find(f=>f.id===_branchSourceId);
  if(src) src.branched_to=newPanel.id;
  all.unshift(newPanel);
  if(status){status.textContent='🌿 Branch created!';status.style.color='var(--green)';}
  setTimeout(()=>{closeBranchModal();render();},800);
}
function scrollToPanel(id){
  const el=document.getElementById('fbc-'+id);
  if(el){el.scrollIntoView({behavior:'smooth',block:'center'});el.style.outline='2px solid var(--green)';setTimeout(()=>el.style.outline='',2000);}
  else{alert('Panel #'+id+' is not visible with the current filter. Switch to "all" to find it.');}
}

init();
</script>

<!-- Branch modal -->
<div id="branch-modal-bg" style="display:none;" onclick="if(event.target===this)closeBranchModal()">
  <div class="fb-modal" style="max-width:480px;width:92%;position:relative;">
    <button class="modal-close" onclick="closeBranchModal()">×</button>
    <div class="modal-title" style="margin-bottom:4px;">🌿 Branch Panel</div>
    <div style="font-size:11px;color:var(--dim);font-family:var(--mono);margin-bottom:14px;">spawns a new panel linked back to this one</div>
    <div style="font-size:11px;color:var(--dim);font-family:var(--mono);text-transform:uppercase;letter-spacing:.05em;margin-bottom:5px;">page</div>
    <select id="branch-page" class="sr-select" style="margin-bottom:12px;">
      <option>Lodge Chat</option><option>Library</option><option>Cards</option>
      <option>Characters</option><option>Slide Rules</option><option>✎ Feedback</option>
      <option>Roadmap</option><option>Systems</option><option>Organ</option><option>General</option>
    </select>
    <div style="font-size:11px;color:var(--dim);font-family:var(--mono);text-transform:uppercase;letter-spacing:.05em;margin-bottom:5px;">type</div>
    <div style="display:flex;align-items:center;gap:8px;margin-bottom:12px;">
      <span class="fb-type branch" style="font-size:12px;padding:3px 10px;">🌿 branch</span>
      <span style="font-size:11px;color:var(--dim);font-family:var(--mono);">this panel becomes the root · the new one is its branch</span>
    </div>
    <div style="font-size:11px;color:var(--dim);font-family:var(--mono);text-transform:uppercase;letter-spacing:.05em;margin-bottom:5px;">title</div>
    <input id="branch-title" type="text" placeholder="Branch title…"
      style="width:100%;background:var(--brown);border:1px solid var(--brown3);color:var(--parchment);font-family:var(--serif);font-size:13px;padding:7px 10px;border-radius:4px;outline:none;margin-bottom:12px;">
    <div style="font-size:11px;color:var(--dim);font-family:var(--mono);text-transform:uppercase;letter-spacing:.05em;margin-bottom:5px;">description</div>
    <textarea id="branch-desc" rows="3" placeholder="What does this branch explore? Why does it deserve its own space?"
      style="width:100%;background:var(--brown);border:1px solid var(--brown3);color:var(--parchment);font-family:var(--serif);font-size:13px;padding:7px 10px;border-radius:4px;outline:none;resize:vertical;margin-bottom:0;"></textarea>
    <div style="display:flex;gap:8px;margin-top:14px;">
      <button onclick="closeBranchModal()">cancel</button>
      <button onclick="submitBranch()" style="flex:1;background:var(--green3);border:1px solid var(--green3);color:var(--parchment);">🌿 Create Branch</button>
    </div>
    <div id="branch-status" style="font-size:11px;font-family:var(--mono);color:var(--green);margin-top:8px;min-height:16px;"></div>
  </div>
</div>

</body>
</html>
