<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Roadmap · TricknoLodge</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
if(window.location.search.includes('embed=1')||window.self!==window.top){
  document.addEventListener('DOMContentLoaded',()=>{const h=document.querySelector('header');if(h)h.style.display='none';});
}
</script>
<style>
  *,*::before,*::after{box-sizing:border-box;margin:0;padding:0;}
  :root{
    --green:rgb(144,171,153);--green2:rgb(110,135,118);--green3:rgb(80,105,90);
    --brown:rgb(43,28,16);--brown2:rgb(60,42,26);--brown3:rgb(80,58,36);
    --purple:rgb(76,46,87);--purple2:rgb(100,65,112);
    --parchment:rgb(220,210,190);--parchment2:rgb(200,188,168);
    --dim:rgb(120,100,80);--gold:rgb(201,169,110);
    --done-col:rgb(144,171,153);
    --active-col:rgb(201,169,110);
    --idea-col:rgb(120,100,80);
    --lodge-col:rgb(144,171,153);
    --organ-col:rgb(201,169,110);
    --library-col:rgb(100,65,112);
    --cards-col:rgb(80,140,160);
    --engine-col:rgb(180,100,60);
    --mono:'Courier New',Courier,monospace;--serif:Georgia,'Times New Roman',serif;
  }
  body{background:var(--brown);color:var(--parchment);font-family:var(--serif);font-size:14px;min-height:100vh;}
  header{background:var(--brown2);border-bottom:2px solid var(--purple);padding:12px 24px;display:flex;align-items:center;gap:14px;}
  .back-link{color:var(--green);text-decoration:none;font-family:var(--mono);font-size:12px;}
  .back-link:hover{color:var(--parchment);}
  .page-title{font-size:18px;color:var(--green);font-weight:normal;letter-spacing:0.08em;}
  .page-sub{font-size:11px;color:var(--dim);font-family:var(--mono);}

  /* Filter bar */
  .filter-bar{background:var(--brown2);border-bottom:1px solid var(--brown3);padding:10px 24px;display:flex;gap:8px;flex-wrap:wrap;align-items:center;position:sticky;top:0;z-index:20;}
  .filter-group{display:flex;gap:5px;flex-wrap:wrap;align-items:center;}
  .filter-sep{width:1px;height:20px;background:var(--brown3);margin:0 4px;}
  .f-btn{background:var(--brown3);border:1px solid var(--brown3);color:var(--dim);font-family:var(--mono);font-size:11px;padding:4px 10px;border-radius:12px;cursor:pointer;transition:all .15s;white-space:nowrap;}
  .f-btn:hover{border-color:var(--green3);color:var(--parchment);}
  .f-btn.on{background:rgba(80,105,90,.25);border-color:var(--green);color:var(--green);}
  .f-btn.sys-lodge.on{border-color:var(--lodge-col);color:var(--lodge-col);background:rgba(144,171,153,.12);}
  .f-btn.sys-organ.on{border-color:var(--organ-col);color:var(--organ-col);background:rgba(201,169,110,.12);}
  .f-btn.sys-library.on{border-color:var(--library-col);color:var(--library-col);background:rgba(100,65,112,.2);}
  .f-btn.sys-cards.on{border-color:var(--cards-col);color:var(--cards-col);background:rgba(80,140,160,.12);}
  .f-btn.sys-engine.on{border-color:var(--engine-col);color:var(--engine-col);background:rgba(180,100,60,.12);}
  .counts{font-size:11px;color:var(--dim);font-family:var(--mono);margin-left:auto;}

  /* Main layout */
  .wrap{max-width:860px;margin:0 auto;padding:24px 20px;}

  /* System sections */
  .sys-section{margin-bottom:32px;}
  .sys-header{display:flex;align-items:center;gap:10px;margin-bottom:12px;padding-bottom:8px;border-bottom:2px solid;}
  .sys-header.lodge{border-color:rgba(144,171,153,.4);}
  .sys-header.organ{border-color:rgba(201,169,110,.4);}
  .sys-header.library{border-color:rgba(100,65,112,.4);}
  .sys-header.cards{border-color:rgba(80,140,160,.4);}
  .sys-header.engine{border-color:rgba(180,100,60,.4);}
  .sys-name{font-size:13px;font-weight:bold;font-family:var(--mono);letter-spacing:0.1em;text-transform:uppercase;}
  .sys-name.lodge{color:var(--lodge-col);}
  .sys-name.organ{color:var(--organ-col);}
  .sys-name.library{color:var(--library-col);}
  .sys-name.cards{color:var(--cards-col);}
  .sys-name.engine{color:var(--engine-col);}
  .sys-count{font-size:11px;color:var(--dim);font-family:var(--mono);}
  .btn-add-item{margin-left:auto;background:none;border:1px dashed var(--brown3);color:var(--dim);font-family:var(--mono);font-size:11px;padding:3px 10px;border-radius:4px;cursor:pointer;transition:all .15s;}
  .btn-add-item:hover{border-color:var(--green3);color:var(--green);}

  /* Item cards */
  .item-list{display:flex;flex-direction:column;gap:5px;}
  .item{border-radius:5px;border:1px solid var(--brown3);overflow:hidden;cursor:pointer;transition:border-color .15s;}
  .item:hover{border-color:var(--brown3);}
  .item.done{opacity:.72;}
  .item.done:hover{opacity:1;}
  .item-main{display:flex;align-items:center;gap:0;background:var(--brown2);}
  .item-bar{width:4px;flex-shrink:0;align-self:stretch;}
  .item-bar.done{background:var(--done-col);}
  .item-bar.active{background:var(--active-col);}
  .item-bar.idea{background:var(--idea-col);}
  .item-content{flex:1;padding:9px 12px;min-width:0;}
  .item-title{font-size:13px;font-family:var(--mono);display:flex;align-items:center;gap:8px;}
  .item-title.done{color:var(--done-col);text-decoration:line-through;text-decoration-color:rgba(144,171,153,.4);}
  .item-title.active{color:var(--active-col);}
  .item-title.idea{color:var(--parchment2);}
  .status-pip{width:7px;height:7px;border-radius:50%;flex-shrink:0;}
  .status-pip.done{background:var(--done-col);}
  .status-pip.active{background:var(--active-col);}
  .status-pip.idea{background:var(--idea-col);}
  .item-expand{padding:8px 12px;color:var(--dim);font-size:13px;flex-shrink:0;}
  .item-detail{display:none;background:var(--brown);border-top:1px solid var(--brown3);padding:10px 16px 12px;}
  .item-detail.open{display:block;}
  .item-desc{font-size:13px;color:var(--parchment2);line-height:1.65;margin-bottom:10px;}
  .item-actions{display:flex;gap:6px;flex-wrap:wrap;align-items:center;}
  .status-btn{font-size:10px;font-family:var(--mono);padding:3px 9px;border-radius:3px;cursor:pointer;border:1px solid var(--brown3);background:none;color:var(--dim);transition:all .15s;}
  .status-btn:hover{border-color:var(--green3);}
  .status-btn.cur-done{border-color:var(--done-col);color:var(--done-col);background:rgba(144,171,153,.1);}
  .status-btn.cur-active{border-color:var(--active-col);color:var(--active-col);background:rgba(201,169,110,.1);}
  .status-btn.cur-idea{border-color:var(--idea-col);color:var(--idea-col);}
  .del-btn{font-size:10px;font-family:var(--mono);padding:3px 9px;border-radius:3px;cursor:pointer;border:1px solid var(--brown3);background:none;color:var(--dim);margin-left:auto;}
  .del-btn:hover{border-color:#cc4444;color:#cc4444;}
  .save-confirm{font-size:11px;font-family:var(--mono);color:var(--green);display:none;}

  /* Add item form */
  .add-form{background:var(--brown);border:1px dashed var(--brown3);border-radius:5px;padding:12px 14px;margin-top:8px;display:none;}
  .add-form.open{display:block;}
  .add-row{display:flex;gap:8px;margin-bottom:8px;flex-wrap:wrap;}
  .af-input{background:var(--brown2);border:1px solid var(--brown3);color:var(--parchment);font-family:var(--mono);font-size:12px;padding:6px 9px;border-radius:4px;outline:none;flex:1;min-width:120px;}
  .af-input:focus{border-color:var(--green3);}
  .af-input::placeholder{color:var(--dim);}
  .af-textarea{width:100%;background:var(--brown2);border:1px solid var(--brown3);color:var(--parchment);font-family:var(--serif);font-size:13px;padding:7px 9px;border-radius:4px;outline:none;resize:vertical;min-height:60px;margin-bottom:8px;}
  .af-textarea:focus{border-color:var(--green3);}
  .af-textarea::placeholder{color:var(--dim);}
  .af-select{background:var(--brown2);border:1px solid var(--brown3);color:var(--parchment);font-family:var(--mono);font-size:12px;padding:6px 9px;border-radius:4px;outline:none;cursor:pointer;}
  .af-select option{background:var(--brown2);}
  .af-btn{background:var(--purple);border:1px solid var(--purple2);color:var(--parchment);font-family:var(--mono);font-size:12px;padding:6px 14px;border-radius:4px;cursor:pointer;}
  .af-btn:hover{background:var(--purple2);}
  .af-cancel{background:none;border:1px solid var(--brown3);color:var(--dim);font-family:var(--mono);font-size:12px;padding:6px 12px;border-radius:4px;cursor:pointer;}

  .loading{color:var(--dim);font-family:var(--mono);font-size:13px;font-style:italic;padding:40px;text-align:center;}
  ::-webkit-scrollbar{width:5px;}
  ::-webkit-scrollbar-track{background:var(--brown);}
  ::-webkit-scrollbar-thumb{background:var(--brown3);border-radius:3px;}
</style>
</head>
<body>
<header>
  <a class="back-link" href="index.html">← Lodge</a>
  <div>
    <div class="page-title">✦ Roadmap</div>
    <div class="page-sub">what is · what grows · what is coming</div>
  </div>
</header>

<div class="filter-bar">
  <div class="filter-group">
    <button class="f-btn on" onclick="setStatusFilter('all',this)">all</button>
    <button class="f-btn" onclick="setStatusFilter('done',this)" style="color:var(--done-col)">✓ done</button>
    <button class="f-btn" onclick="setStatusFilter('active',this)" style="color:var(--active-col)">→ active</button>
    <button class="f-btn" onclick="setStatusFilter('idea',this)" style="color:var(--idea-col)">○ idea</button>
  </div>
  <div class="filter-sep"></div>
  <div class="filter-group">
    <button class="f-btn sys-lodge on" onclick="toggleSys('lodge',this)">Lodge</button>
    <button class="f-btn sys-organ on" onclick="toggleSys('organ',this)">Organ</button>
    <button class="f-btn sys-library on" onclick="toggleSys('library',this)">Library</button>
    <button class="f-btn sys-cards on" onclick="toggleSys('cards',this)">Cards</button>
    <button class="f-btn sys-engine on" onclick="toggleSys('engine',this)">Engine</button>
  </div>
  <span class="counts" id="counts"></span>
</div>

<div class="wrap" id="wrap"><div class="loading">*gathering the threads…*</div></div>

<script>
const SUPABASE_URL='https://tngvginwtsldulqgufoe.supabase.co';
const SUPABASE_KEY='eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InRuZ3ZnaW53dHNsZHVscWd1Zm9lIiwicm9sZSI6ImFub24iLCJpYXQiOjE3Nzg5NTc3NTAsImV4cCI6MjA5NDUzMzc1MH0.4NzjqjdB_56gtbt_lf3ZAiE6Gfn0zpaZC36hIcjmIMI';
const db=supabase.createClient(SUPABASE_URL,SUPABASE_KEY);

const SYSTEMS=['lodge','organ','library','cards','engine'];
const SYS_LABEL={lodge:'Lodge',organ:'Organ',library:'Library',cards:'Cards',engine:'Engine'};
const STATUS_LABEL={done:'✓ done',active:'→ active',idea:'○ idea'};

let all=[], currentUser=null, userRole='', statusFilter='all', visibleSys=new Set(SYSTEMS);
let addingTo=null;

db.auth.onAuthStateChange(async(_e,session)=>{
  currentUser=session?.user||null;
  if(currentUser){
    const{data}=await db.from('user_roles').select('role').eq('user_id',currentUser.id).maybeSingle();
    userRole=data?.role||'';
  }
  load();
});

async function load(){
  const{data}=await db.from('roadmap').select('*').order('system').order('sort_order').order('id');
  all=data||[];
  render();
}

function setStatusFilter(s,btn){
  statusFilter=s;
  document.querySelectorAll('.filter-bar .f-btn').forEach(b=>{
    if(['all','done','active','idea'].some(x=>b.textContent.includes(x.charAt(0).toUpperCase()||x))) b.classList.remove('on');
  });
  // simpler: target just status buttons (first group)
  document.querySelectorAll('.filter-group:first-child .f-btn').forEach(b=>b.classList.remove('on'));
  btn.classList.add('on');
  render();
}

function toggleSys(sys,btn){
  if(visibleSys.has(sys)) visibleSys.delete(sys);
  else visibleSys.add(sys);
  btn.classList.toggle('on',visibleSys.has(sys));
  render();
}

function render(){
  const wrap=document.getElementById('wrap');
  const isArchmage=['archmage'].includes(userRole);
  let totalShown=0;

  wrap.innerHTML=SYSTEMS.filter(s=>visibleSys.has(s)).map(sys=>{
    let items=all.filter(i=>i.system===sys);
    if(statusFilter!=='all') items=items.filter(i=>i.status===statusFilter);
    totalShown+=items.length;

    // Sort: active first, then done, then idea
    const order={active:0,done:1,idea:2};
    items.sort((a,b)=>(order[a.status]??3)-(order[b.status]??3));

    return`<div class="sys-section" id="sys-${sys}">
      <div class="sys-header ${sys}">
        <span class="sys-name ${sys}">${SYS_LABEL[sys]}</span>
        <span class="sys-count">${items.length} item${items.length===1?'':'s'}</span>
        ${isArchmage?`<button class="btn-add-item" onclick="showAddForm('${sys}')">+ add</button>`:''}
      </div>
      <div class="item-list" id="list-${sys}">
        ${items.length===0?`<div style="font-size:12px;color:var(--dim);font-family:var(--mono);padding:8px 0;font-style:italic">nothing here with this filter</div>`:''}
        ${items.map(item=>renderItem(item,isArchmage)).join('')}
      </div>
      ${isArchmage?`<div class="add-form" id="addform-${sys}">
        <div class="add-row">
          <input class="af-input" id="af-title-${sys}" placeholder="Title *" style="flex:2">
          <select class="af-select" id="af-status-${sys}">
            <option value="idea">○ idea</option>
            <option value="active">→ active</option>
            <option value="done">✓ done</option>
          </select>
        </div>
        <textarea class="af-textarea" id="af-desc-${sys}" placeholder="Description (optional)…"></textarea>
        <div style="display:flex;gap:8px;">
          <button class="af-btn" onclick="saveItem('${sys}')">save</button>
          <button class="af-cancel" onclick="hideAddForm('${sys}')">cancel</button>
          <span id="af-status-msg-${sys}" style="font-size:11px;font-family:var(--mono);color:var(--green);align-self:center;"></span>
        </div>
      </div>`:''}
    </div>`;
  }).join('');

  document.getElementById('counts').textContent=`${totalShown} item${totalShown===1?'':'s'}`;
}

function renderItem(item,isArchmage){
  const s=item.status;
  return`<div class="item ${s}" id="item-${item.id}">
    <div class="item-main" onclick="toggleItem(${item.id})">
      <div class="item-bar ${s}"></div>
      <div class="item-content">
        <div class="item-title ${s}">
          <span class="status-pip ${s}"></span>
          ${item.title}
        </div>
      </div>
      <div class="item-expand">›</div>
    </div>
    <div class="item-detail" id="detail-${item.id}">
      ${item.description?`<div class="item-desc">${item.description}</div>`:''}
      ${isArchmage?`<div class="item-actions">
        <span style="font-size:10px;color:var(--dim);font-family:var(--mono)">status:</span>
        <button class="status-btn ${s==='done'?'cur-done':''}" onclick="setStatus(${item.id},'done',this)">✓ done</button>
        <button class="status-btn ${s==='active'?'cur-active':''}" onclick="setStatus(${item.id},'active',this)">→ active</button>
        <button class="status-btn ${s==='idea'?'cur-idea':''}" onclick="setStatus(${item.id},'idea',this)">○ idea</button>
        <span class="save-confirm" id="sc-${item.id}">✓</span>
        <button class="del-btn" onclick="deleteItem(${item.id})">delete</button>
      </div>`:''}
    </div>
  </div>`;
}

function toggleItem(id){
  const d=document.getElementById('detail-'+id);
  const e=document.querySelector(`#item-${id} .item-expand`);
  if(!d) return;
  d.classList.toggle('open');
  e.textContent=d.classList.contains('open')?'∨':'›';
}

async function setStatus(id,status,btn){
  await db.from('roadmap').update({status}).eq('id',id);
  const item=all.find(i=>i.id===id);
  if(item) item.status=status;
  const sc=document.getElementById('sc-'+id);
  if(sc){sc.style.display='inline';setTimeout(()=>sc.style.display='none',1200);}
  render();
  // Reopen the detail after re-render
  setTimeout(()=>{
    const d=document.getElementById('detail-'+id);
    if(d){d.classList.add('open'); const e=document.querySelector(`#item-${id} .item-expand`); if(e)e.textContent='∨';}
  },10);
}

async function deleteItem(id){
  if(!confirm('Remove this item from the roadmap?')) return;
  await db.from('roadmap').delete().eq('id',id);
  all=all.filter(i=>i.id!==id);
  render();
}

function showAddForm(sys){
  document.querySelectorAll('.add-form').forEach(f=>f.classList.remove('open'));
  const f=document.getElementById('addform-'+sys);
  if(f){f.classList.add('open');document.getElementById('af-title-'+sys)?.focus();}
  addingTo=sys;
}
function hideAddForm(sys){
  const f=document.getElementById('addform-'+sys);
  if(f) f.classList.remove('open');
  addingTo=null;
}

async function saveItem(sys){
  const title=document.getElementById('af-title-'+sys)?.value.trim();
  const desc=document.getElementById('af-desc-'+sys)?.value.trim()||null;
  const status=document.getElementById('af-status-'+sys)?.value||'idea';
  const msg=document.getElementById('af-status-msg-'+sys);
  if(!title){if(msg){msg.textContent='Title required.';msg.style.color='#e06060';}return;}
  if(msg){msg.textContent='saving…';msg.style.color='var(--dim)';}
  const maxOrder=Math.max(0,...all.filter(i=>i.system===sys).map(i=>i.sort_order||0));
  const{data,error}=await db.from('roadmap').insert({title,description:desc,system:sys,status,sort_order:maxOrder+10}).select().single();
  if(error){if(msg){msg.textContent=`Error: ${error.message}`;msg.style.color='#e06060';}return;}
  all.push(data);
  if(msg){msg.textContent='✓ added';msg.style.color='var(--green)';}
  document.getElementById('af-title-'+sys).value='';
  document.getElementById('af-desc-'+sys).value='';
  setTimeout(()=>{hideAddForm(sys);render();},600);
}

// Initial load (handles case where auth fires before or after)
load();
</script>
</body>
</html>
