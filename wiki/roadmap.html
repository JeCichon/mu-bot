<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Roadmap · TricknoLodge</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
if(window.location.search.includes('embed=1')||window.self!==window.top){
  document.addEventListener('DOMContentLoaded',()=>{const h=document.querySelector('header');if(h)h.style.display='none';});
}
</script>
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0;}
:root{
  --green:rgb(144,171,153);--green2:rgb(110,135,118);--green3:rgb(80,105,90);
  --brown:rgb(43,28,16);--brown2:rgb(60,42,26);--brown3:rgb(80,58,36);
  --purple:rgb(76,46,87);--purple2:rgb(100,65,112);
  --parchment:rgb(220,210,190);--parchment2:rgb(200,188,168);
  --dim:rgb(120,100,80);--gold:rgb(201,169,110);
  --c-lodge:#90ab99;--c-organ:#c9a96e;--c-library:#9055b8;
  --c-cards:#4fa8c8;--c-engine:#d06040;
  --c-done:rgb(144,171,153);--c-active:rgb(201,169,110);--c-idea:rgb(100,82,62);
  --mono:'Courier New',Courier,monospace;--serif:Georgia,'Times New Roman',serif;
}
body{background:var(--brown);color:var(--parchment);font-family:var(--serif);font-size:14px;min-height:100vh;overflow:hidden;}
header{background:var(--brown2);border-bottom:2px solid var(--purple);padding:10px 20px;display:flex;align-items:center;gap:14px;}
.back-link{color:var(--green);text-decoration:none;font-family:var(--mono);font-size:12px;}
.back-link:hover{color:var(--parchment);}
.page-title{font-size:17px;color:var(--green);font-weight:normal;letter-spacing:0.08em;}
.page-sub{font-size:10px;color:var(--dim);font-family:var(--mono);}
.header-right{margin-left:auto;display:flex;align-items:center;gap:8px;}

/* View toggle */
.view-toggle{display:flex;background:var(--brown);border:1px solid var(--brown3);border-radius:5px;overflow:hidden;}
.vt-btn{background:none;border:none;color:var(--dim);font-family:var(--mono);font-size:11px;padding:5px 12px;cursor:pointer;transition:all .15s;}
.vt-btn:hover{color:var(--parchment);}
.vt-btn.on{background:var(--brown3);color:var(--parchment);}

/* Filter bar */
.filter-bar{background:var(--brown2);border-bottom:1px solid var(--brown3);padding:8px 18px;display:flex;gap:6px;flex-wrap:wrap;align-items:center;}
.filter-group{display:flex;gap:4px;flex-wrap:wrap;}
.filter-sep{width:1px;height:18px;background:var(--brown3);margin:0 4px;}
.f-btn{background:var(--brown3);border:1px solid var(--brown3);color:var(--dim);font-family:var(--mono);font-size:11px;padding:3px 9px;border-radius:10px;cursor:pointer;transition:all .15s;white-space:nowrap;}
.f-btn:hover{border-color:var(--green3);color:var(--parchment);}
.f-btn.on{border-color:var(--green);color:var(--green);background:rgba(80,105,90,.2);}
.f-btn.sys-lodge.on{border-color:var(--c-lodge);color:var(--c-lodge);background:rgba(144,171,153,.1);}
.f-btn.sys-organ.on{border-color:var(--c-organ);color:var(--c-organ);background:rgba(201,169,110,.1);}
.f-btn.sys-library.on{border-color:var(--c-library);color:var(--c-library);background:rgba(144,85,184,.1);}
.f-btn.sys-cards.on{border-color:var(--c-cards);color:var(--c-cards);background:rgba(79,168,200,.1);}
.f-btn.sys-engine.on{border-color:var(--c-engine);color:var(--c-engine);background:rgba(208,96,64,.1);}
.counts{font-size:11px;color:var(--dim);font-family:var(--mono);margin-left:auto;}

/* ── LIST VIEW ───────────────────────────────────────────────────────────── */
#list-view{height:calc(100vh - 112px);overflow-y:auto;}
.wrap{max-width:820px;margin:0 auto;padding:20px;}
.sys-section{margin-bottom:28px;}
.sys-header{display:flex;align-items:center;gap:10px;margin-bottom:10px;padding-bottom:7px;border-bottom:2px solid;}
.sys-header.lodge{border-color:rgba(144,171,153,.35);}.sys-header.organ{border-color:rgba(201,169,110,.35);}
.sys-header.library{border-color:rgba(144,85,184,.35);}.sys-header.cards{border-color:rgba(79,168,200,.35);}
.sys-header.engine{border-color:rgba(208,96,64,.35);}
.sys-name{font-size:12px;font-weight:bold;font-family:var(--mono);letter-spacing:0.1em;text-transform:uppercase;}
.sys-name.lodge{color:var(--c-lodge);}.sys-name.organ{color:var(--c-organ);}
.sys-name.library{color:var(--c-library);}.sys-name.cards{color:var(--c-cards);}
.sys-name.engine{color:var(--c-engine);}
.sys-count{font-size:11px;color:var(--dim);font-family:var(--mono);}
.btn-add-item{margin-left:auto;background:none;border:1px dashed var(--brown3);color:var(--dim);font-family:var(--mono);font-size:11px;padding:3px 9px;border-radius:4px;cursor:pointer;}
.btn-add-item:hover{border-color:var(--green3);color:var(--green);}
.item-list{display:flex;flex-direction:column;gap:4px;}
.item{border-radius:4px;border:1px solid var(--brown3);overflow:hidden;cursor:pointer;}
.item.done{opacity:.68;}.item.done:hover{opacity:1;}
.item-main{display:flex;align-items:center;background:var(--brown2);}
.item-bar{width:3px;flex-shrink:0;align-self:stretch;}
.item-bar.done{background:var(--c-done);}.item-bar.active{background:var(--c-active);}.item-bar.idea{background:var(--c-idea);}
.item-content{flex:1;padding:8px 11px;min-width:0;}
.item-title{font-size:12px;font-family:var(--mono);display:flex;align-items:center;gap:7px;}
.item-title.done{color:var(--c-done);text-decoration:line-through;text-decoration-color:rgba(144,171,153,.35);}
.item-title.active{color:var(--c-active);}.item-title.idea{color:var(--parchment2);}
.status-pip{width:6px;height:6px;border-radius:50%;flex-shrink:0;}
.status-pip.done{background:var(--c-done);}.status-pip.active{background:var(--c-active);}.status-pip.idea{background:var(--c-idea);}
.item-expand{padding:7px 11px;color:var(--dim);font-size:12px;flex-shrink:0;}
.item-detail{display:none;background:var(--brown);border-top:1px solid var(--brown3);padding:9px 14px 11px;}
.item-detail.open{display:block;}
.item-desc{font-size:13px;color:var(--parchment2);line-height:1.6;margin-bottom:9px;}
.item-actions{display:flex;gap:5px;flex-wrap:wrap;align-items:center;}
.status-btn{font-size:10px;font-family:var(--mono);padding:3px 8px;border-radius:3px;cursor:pointer;border:1px solid var(--brown3);background:none;color:var(--dim);}
.status-btn.cur-done{border-color:var(--c-done);color:var(--c-done);}
.status-btn.cur-active{border-color:var(--c-active);color:var(--c-active);}
.status-btn.cur-idea{border-color:var(--c-idea);color:var(--c-idea);}
.del-btn{font-size:10px;font-family:var(--mono);padding:3px 8px;border-radius:3px;cursor:pointer;border:1px solid var(--brown3);background:none;color:var(--dim);margin-left:auto;}
.del-btn:hover{border-color:#cc4444;color:#cc4444;}
.save-confirm{font-size:11px;font-family:var(--mono);color:var(--green);display:none;}
.add-form{background:var(--brown);border:1px dashed var(--brown3);border-radius:4px;padding:10px 12px;margin-top:6px;display:none;}
.add-form.open{display:block;}
.add-row{display:flex;gap:7px;margin-bottom:7px;flex-wrap:wrap;}
.af-input{background:var(--brown2);border:1px solid var(--brown3);color:var(--parchment);font-family:var(--mono);font-size:12px;padding:5px 8px;border-radius:4px;outline:none;flex:1;min-width:100px;}
.af-input:focus,.af-textarea:focus{border-color:var(--green3);}
.af-input::placeholder,.af-textarea::placeholder{color:var(--dim);}
.af-textarea{width:100%;background:var(--brown2);border:1px solid var(--brown3);color:var(--parchment);font-family:var(--serif);font-size:12px;padding:6px 8px;border-radius:4px;outline:none;resize:vertical;min-height:50px;margin-bottom:7px;}
.af-select{background:var(--brown2);border:1px solid var(--brown3);color:var(--parchment);font-family:var(--mono);font-size:12px;padding:5px 8px;border-radius:4px;outline:none;cursor:pointer;}
.af-select option{background:var(--brown2);}
.af-btn{background:var(--purple);border:1px solid var(--purple2);color:var(--parchment);font-family:var(--mono);font-size:12px;padding:5px 12px;border-radius:4px;cursor:pointer;}
.af-btn:hover{background:var(--purple2);}
.af-cancel{background:none;border:1px solid var(--brown3);color:var(--dim);font-family:var(--mono);font-size:12px;padding:5px 10px;border-radius:4px;cursor:pointer;}
.loading{color:var(--dim);font-family:var(--mono);font-size:12px;font-style:italic;padding:30px;text-align:center;}

/* ── MAP VIEW ───────────────────────────────────────────────────────────── */
#map-view{display:none;position:relative;height:calc(100vh - 112px);overflow:hidden;}
#roadmap-svg{width:100%;height:100%;cursor:grab;display:block;background:var(--brown);}
#roadmap-svg:active{cursor:grabbing;}
/* Map controls overlay */
.map-controls{position:absolute;top:12px;left:14px;display:flex;gap:6px;z-index:10;}
.map-ctrl-btn{background:var(--brown2);border:1px solid var(--brown3);color:var(--dim);font-family:var(--mono);font-size:11px;padding:4px 9px;border-radius:4px;cursor:pointer;}
.map-ctrl-btn:hover{border-color:var(--green3);color:var(--green);}
.map-hint{position:absolute;bottom:12px;left:14px;font-size:10px;font-family:var(--mono);color:rgba(120,100,80,.6);}
#minimap{position:absolute;bottom:36px;right:12px;width:170px;height:115px;background:rgba(40,26,12,.92);border:1px solid var(--brown3);border-radius:5px;overflow:hidden;cursor:crosshair;z-index:15;user-select:none;}
#minimap-label{position:absolute;top:4px;left:7px;font-family:var(--mono);font-size:9px;color:rgba(120,100,80,.7);pointer-events:none;}
#zoom-bar{position:absolute;bottom:12px;left:50%;transform:translateX(-50%);display:flex;align-items:center;gap:7px;background:rgba(40,26,12,.75);border:1px solid var(--brown3);border-radius:10px;padding:4px 10px;z-index:15;}
#zoom-track{width:80px;height:3px;background:rgba(80,58,36,.8);border-radius:2px;cursor:pointer;}
#zoom-fill{height:100%;background:rgba(201,169,110,.6);border-radius:2px;transition:width .1s;}
#zoom-pct{font-family:var(--mono);font-size:10px;color:var(--dim);width:30px;text-align:right;}
/* Map detail panel */
#map-panel{position:absolute;top:0;right:0;width:280px;height:100%;background:var(--brown2);border-left:1px solid var(--brown3);padding:16px;overflow-y:auto;display:none;flex-direction:column;gap:10px;z-index:20;}
#map-panel.open{display:flex;}
.mp-close{align-self:flex-end;background:none;border:none;color:var(--dim);font-size:18px;cursor:pointer;line-height:1;}
.mp-close:hover{color:var(--parchment);}
.mp-sys{font-size:10px;font-family:var(--mono);text-transform:uppercase;letter-spacing:0.08em;margin-bottom:2px;}
.mp-title{font-size:15px;color:var(--parchment);margin-bottom:6px;line-height:1.3;}
.mp-status{font-size:11px;font-family:var(--mono);padding:2px 8px;border-radius:8px;display:inline-block;margin-bottom:10px;}
.mp-status.done{background:rgba(144,171,153,.15);color:var(--c-done);border:1px solid rgba(144,171,153,.3);}
.mp-status.active{background:rgba(201,169,110,.15);color:var(--c-active);border:1px solid rgba(201,169,110,.3);}
.mp-status.idea{background:rgba(100,82,62,.3);color:var(--dim);border:1px solid rgba(100,82,62,.5);}
.mp-desc{font-size:12px;color:var(--parchment2);line-height:1.65;flex:1;}
.mp-actions{display:flex;gap:5px;flex-wrap:wrap;margin-top:8px;padding-top:8px;border-top:1px solid var(--brown3);}

/* Tooltip */
#svg-tooltip{position:absolute;background:var(--brown2);border:1px solid var(--brown3);color:var(--parchment2);font-family:var(--mono);font-size:11px;padding:5px 9px;border-radius:4px;pointer-events:none;display:none;z-index:30;max-width:200px;line-height:1.4;}

::-webkit-scrollbar{width:5px;}
::-webkit-scrollbar-track{background:var(--brown);}
::-webkit-scrollbar-thumb{background:var(--brown3);border-radius:3px;}
</style>
</head>
<body>
<header>
  <a class="back-link" href="index.html">← Lodge</a>
  <div>
    <div class="page-title">✦ Roadmap</div>
    <div class="page-sub">what is · what grows · what is coming</div>
  </div>
  <div class="header-right">
  </div>
</header>

<div class="filter-bar">
  <div class="filter-group">
    <button class="f-btn on" id="sf-all" onclick="setStatusFilter('all',this)">all</button>
    <button class="f-btn" id="sf-done" onclick="setStatusFilter('done',this)">✓ done</button>
    <button class="f-btn" id="sf-active" onclick="setStatusFilter('active',this)">→ active</button>
    <button class="f-btn" id="sf-idea" onclick="setStatusFilter('idea',this)">○ idea</button>
  </div>
  <div class="filter-sep"></div>
  <div class="filter-group">
    <button class="f-btn sys-lodge on" id="fs-lodge" onclick="toggleSys('lodge',this)">Lodge</button>
    <button class="f-btn sys-organ on" id="fs-organ" onclick="toggleSys('organ',this)">Organ</button>
    <button class="f-btn sys-library on" id="fs-library" onclick="toggleSys('library',this)">Library</button>
    <button class="f-btn sys-cards on" id="fs-cards" onclick="toggleSys('cards',this)">Cards</button>
    <button class="f-btn sys-engine on" id="fs-engine" onclick="toggleSys('engine',this)">Engine</button>
  </div>
  <span class="counts" id="counts"></span>
  <div class="filter-sep"></div>
  <div class="view-toggle">
    <button class="vt-btn on" id="vt-list" onclick="setView('list')">≡ List</button>
    <button class="vt-btn" id="vt-map" onclick="setView('map')">◈ Map</button>
  </div>
</div>

<!-- LIST VIEW -->
<div id="list-view">
  <div class="wrap" id="wrap"><div class="loading">*gathering the threads…*</div></div>
</div>

<!-- MAP VIEW -->
<div id="map-view">
  <div class="map-controls">
    <button class="map-ctrl-btn" onclick="resetMapView()">⌂ center</button>
  </div>
  <svg id="roadmap-svg">
    <defs>
      <filter id="glow">
        <feGaussianBlur stdDeviation="3" result="blur"/>
        <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
      </filter>
    </defs>
    <g id="map-transform"></g>
  </svg>
  <div id="minimap">
  <div id="minimap-label">overview</div>
  <svg id="minimap-svg" width="170" height="115" style="display:block;">
    <g id="minimap-nodes"></g>
    <rect id="minimap-vp" fill="rgba(201,169,110,.08)" stroke="rgba(201,169,110,.45)" stroke-width="1" rx="2" x="0" y="0" width="0" height="0"/>
  </svg>
</div>
<div id="zoom-bar">
  <button onclick="mapZoomStep(-1)" style="background:none;border:none;color:var(--dim);font-family:var(--mono);font-size:13px;cursor:pointer;line-height:1;padding:0;">−</button>
  <div id="zoom-track" onclick="zoomBarClick(event)"><div id="zoom-fill" style="width:40%;"></div></div>
  <button onclick="mapZoomStep(1)" style="background:none;border:none;color:var(--dim);font-family:var(--mono);font-size:13px;cursor:pointer;line-height:1;padding:0;">+</button>
  <span id="zoom-pct">100%</span>
</div>
<div id="map-panel">
    <button class="mp-close" onclick="closeMapPanel()">×</button>
    <div class="mp-sys" id="mp-sys"></div>
    <div class="mp-title" id="mp-title"></div>
    <div class="mp-status" id="mp-status"></div>
    <div class="mp-desc" id="mp-desc"></div>
    <div class="mp-actions" id="mp-actions"></div>
  </div>
  <div id="svg-tooltip"></div>
  <div class="map-hint">scroll to zoom · drag to pan · click node to open</div>
</div>

<script>
const SUPABASE_URL='https://tngvginwtsldulqgufoe.supabase.co';
const SUPABASE_KEY='eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InRuZ3ZnaW53dHNsZHVscWd1Zm9lIiwicm9sZSI6ImFub24iLCJpYXQiOjE3Nzg5NTc3NTAsImV4cCI6MjA5NDUzMzc1MH0.4NzjqjdB_56gtbt_lf3ZAiE6Gfn0zpaZC36hIcjmIMI';
const db=supabase.createClient(SUPABASE_URL,SUPABASE_KEY);

const SYSTEMS=[
  {id:'cards',   angle:-90,  color:'#4fa8c8', label:'Cards'},
  {id:'organ',   angle:-18,  color:'#c9a96e', label:'Organ'},
  {id:'lodge',   angle: 54,  color:'#90ab99', label:'Lodge'},
  {id:'library', angle:126,  color:'#9055b8', label:'Library'},
  {id:'engine',  angle:198,  color:'#d06040', label:'Engine'},
];
const SYS_LABEL={lodge:'Lodge',organ:'Organ',library:'Library',cards:'Cards',engine:'Engine'};
const STATUS_LABEL={done:'✓ done',active:'→ active',idea:'○ idea'};
const NS='http://www.w3.org/2000/svg';

let all=[], currentUser=null, userRole='';
let statusFilter='all', visibleSys=new Set(['lodge','organ','library','cards','engine']);
let currentView='list';

// Map state
let mapT={x:0,y:0,scale:1};
let mapDragging=false, mapLast={x:0,y:0};

// ── Auth ────────────────────────────────────────────────────────────────────
db.auth.onAuthStateChange(async(_e,session)=>{
  currentUser=session?.user||null;
  if(currentUser){
    const{data}=await db.from('user_roles').select('role').eq('user_id',currentUser.id).maybeSingle();
    userRole=data?.role||'';
  }
  load();
});

async function load(){
  const{data}=await db.from('roadmap').select('*').order('system').order('sort_order').order('id');
  all=data||[];
  if(currentView==='list') renderList();
  else renderMap();
}

// ── Filters ─────────────────────────────────────────────────────────────────
function filteredItems(){
  return all.filter(i=>{
    if(!visibleSys.has(i.system)) return false;
    if(statusFilter!=='all'&&i.status!==statusFilter) return false;
    return true;
  });
}

function setStatusFilter(s,btn){
  statusFilter=s;
  document.querySelectorAll('.filter-group:first-child .f-btn').forEach(b=>b.classList.remove('on'));
  btn.classList.add('on');
  if(currentView==='list') renderList(); else renderMap();
}
function toggleSys(sys,btn){
  if(visibleSys.has(sys)) visibleSys.delete(sys); else visibleSys.add(sys);
  btn.classList.toggle('on',visibleSys.has(sys));
  if(currentView==='list') renderList(); else renderMap();
}

// ── View toggle ──────────────────────────────────────────────────────────────
function setView(v){
  currentView=v;
  document.getElementById('vt-list').classList.toggle('on',v==='list');
  document.getElementById('vt-map').classList.toggle('on',v==='map');
  document.getElementById('list-view').style.display=v==='list'?'block':'none';
  document.getElementById('map-view').style.display=v==='map'?'block':'none';
  if(v==='map') renderMap();
}

// ── LIST VIEW ────────────────────────────────────────────────────────────────
function renderList(){
  const isArchmage=userRole==='archmage';
  const items=filteredItems();
  let total=0;
  const wrap=document.getElementById('wrap');
  wrap.innerHTML=SYSTEMS.filter(s=>visibleSys.has(s.id)).map(sys=>{
    let sItems=items.filter(i=>i.system===sys.id);
    sItems.sort((a,b)=>({active:0,done:1,idea:2}[a.status]??3)-({active:0,done:1,idea:2}[b.status]??3));
    total+=sItems.length;
    return`<div class="sys-section">
      <div class="sys-header ${sys.id}">
        <span class="sys-name ${sys.id}">${sys.label}</span>
        <span class="sys-count">${sItems.length}</span>
        ${isArchmage?`<button class="btn-add-item" onclick="showAddForm('${sys.id}')">+ add</button>`:''}
      </div>
      <div class="item-list">
        ${sItems.length===0?`<div style="font-size:11px;color:var(--dim);font-family:var(--mono);padding:6px 0;font-style:italic">nothing here with this filter</div>`:''}
        ${sItems.map(item=>`<div class="item ${item.status}" id="item-${item.id}">
          <div class="item-main" onclick="toggleItem(${item.id})">
            <div class="item-bar ${item.status}"></div>
            <div class="item-content"><div class="item-title ${item.status}">
              <span class="status-pip ${item.status}"></span>${item.title}
            </div></div>
            <div class="item-expand">›</div>
          </div>
          <div class="item-detail" id="detail-${item.id}">
            ${item.description?`<div class="item-desc">${item.description}</div>`:''}
            ${isArchmage?`<div class="item-actions">
              <span style="font-size:10px;color:var(--dim);font-family:var(--mono)">status:</span>
              <button class="status-btn ${item.status==='done'?'cur-done':''}" onclick="setStatus(${item.id},'done')">✓ done</button>
              <button class="status-btn ${item.status==='active'?'cur-active':''}" onclick="setStatus(${item.id},'active')">→ active</button>
              <button class="status-btn ${item.status==='idea'?'cur-idea':''}" onclick="setStatus(${item.id},'idea')">○ idea</button>
              <span class="save-confirm" id="sc-${item.id}">✓</span>
              <button class="del-btn" onclick="deleteItem(${item.id})">delete</button>
            </div>`:''}
          </div>
        </div>`).join('')}
      </div>
      ${isArchmage?`<div class="add-form" id="addform-${sys.id}">
        <div class="add-row">
          <input class="af-input" id="af-title-${sys.id}" placeholder="Title *" style="flex:2">
          <select class="af-select" id="af-status-${sys.id}">
            <option value="idea">○ idea</option><option value="active">→ active</option><option value="done">✓ done</option>
          </select>
        </div>
        <textarea class="af-textarea" id="af-desc-${sys.id}" placeholder="Description…"></textarea>
        <div style="display:flex;gap:7px;align-items:center;">
          <button class="af-btn" onclick="saveItem('${sys.id}')">save</button>
          <button class="af-cancel" onclick="hideAddForm('${sys.id}')">cancel</button>
          <span id="af-msg-${sys.id}" style="font-size:11px;font-family:var(--mono);color:var(--green);"></span>
        </div>
      </div>`:''}
    </div>`;
  }).join('');
  document.getElementById('counts').textContent=`${total} item${total===1?'':'s'}`;
}

function toggleItem(id){
  const d=document.getElementById('detail-'+id);
  const e=document.querySelector(`#item-${id} .item-expand`);
  if(!d)return;
  d.classList.toggle('open');
  e.textContent=d.classList.contains('open')?'∨':'›';
}

async function setStatus(id,status){
  await db.from('roadmap').update({status}).eq('id',id);
  const i=all.find(x=>x.id===id); if(i)i.status=status;
  const sc=document.getElementById('sc-'+id);
  if(sc){sc.style.display='inline';setTimeout(()=>sc.style.display='none',1200);}
  renderList();
  setTimeout(()=>{const d=document.getElementById('detail-'+id);if(d){d.classList.add('open');const e=document.querySelector(`#item-${id} .item-expand`);if(e)e.textContent='∨';}},10);
}

async function deleteItem(id){
  if(!confirm('Remove this item?'))return;
  await db.from('roadmap').delete().eq('id',id);
  all=all.filter(i=>i.id!==id);
  renderList();
}

function showAddForm(sys){
  document.querySelectorAll('.add-form').forEach(f=>f.classList.remove('open'));
  const f=document.getElementById('addform-'+sys); if(f){f.classList.add('open');document.getElementById('af-title-'+sys)?.focus();}
}
function hideAddForm(sys){const f=document.getElementById('addform-'+sys);if(f)f.classList.remove('open');}

async function saveItem(sys){
  const title=document.getElementById('af-title-'+sys)?.value.trim();
  const desc=document.getElementById('af-desc-'+sys)?.value.trim()||null;
  const status=document.getElementById('af-status-'+sys)?.value||'idea';
  const msg=document.getElementById('af-msg-'+sys);
  if(!title){if(msg){msg.textContent='Title required.';msg.style.color='#e06060';}return;}
  if(msg){msg.textContent='saving…';msg.style.color='var(--dim)';}
  const maxOrder=Math.max(0,...all.filter(i=>i.system===sys).map(i=>i.sort_order||0));
  const{data,error}=await db.from('roadmap').insert({title,description:desc,system:sys,status,sort_order:maxOrder+10}).select().single();
  if(error){if(msg){msg.textContent=`Error: ${error.message}`;msg.style.color='#e06060';}return;}
  all.push(data);
  if(msg){msg.textContent='✓ added';msg.style.color='var(--green)';}
  document.getElementById('af-title-'+sys).value='';
  document.getElementById('af-desc-'+sys).value='';
  setTimeout(()=>{hideAddForm(sys);renderList();},500);
}

// ── MAP VIEW ─────────────────────────────────────────────────────────────────
const ARM=155, RDONE=235, RACTIVE=305, RIDEA=375, SECTOR=52*Math.PI/180;
const MM_W=170, MM_H=115, MAP_EXTENT=430;
function renderMap(){
  const svg=document.getElementById('roadmap-svg');
  const g=document.getElementById('map-transform');
  const W=svg.clientWidth, H=svg.clientHeight;
  g.innerHTML='';

  const items=filteredItems();
  document.getElementById('counts').textContent=`${items.length} item${items.length===1?'':'s'}`;

  // ARM, RDONE, RACTIVE, RIDEA, SECTOR defined at module level

  // Draw center node
  const cx=0, cy=0;
  const cg=svgEl('g'); cg.setAttribute('transform',`translate(0,0)`);
  const cpulse=svgEl('circle'); cpulse.setAttribute('r','42'); cpulse.setAttribute('fill','rgba(201,169,110,.06)');
  cpulse.setAttribute('stroke','rgba(201,169,110,.2)'); cpulse.setAttribute('stroke-width','1');
  const cc=svgEl('circle'); cc.setAttribute('r','34'); cc.setAttribute('fill','rgb(52,34,18)');
  cc.setAttribute('stroke','rgba(201,169,110,.5)'); cc.setAttribute('stroke-width','1.5');
  const ct=svgEl('text'); ct.setAttribute('text-anchor','middle'); ct.setAttribute('dy','4');
  ct.setAttribute('fill','#c9a96e'); ct.setAttribute('font-family','"Courier New",monospace');
  ct.setAttribute('font-size','11'); ct.setAttribute('font-weight','bold'); ct.setAttribute('letter-spacing','1');
  ct.textContent='Tricknologic';
  cg.append(cpulse,cc,ct);
  g.appendChild(cg);

  SYSTEMS.filter(s=>visibleSys.has(s.id)).forEach(sys=>{
    const rad=sys.angle*Math.PI/180;
    const sx=Math.cos(rad)*ARM, sy=Math.sin(rad)*ARM;

    // Arm line center→system
    const arm=svgEl('line');
    arm.setAttribute('x1',0); arm.setAttribute('y1',0);
    arm.setAttribute('x2',sx); arm.setAttribute('y2',sy);
    arm.setAttribute('stroke',sys.color); arm.setAttribute('stroke-width','1.5');
    arm.setAttribute('stroke-opacity','0.35');
    g.appendChild(arm);

    // System node
    const sg=svgEl('g'); sg.setAttribute('transform',`translate(${sx},${sy})`);
    const sc=svgEl('circle'); sc.setAttribute('r','22'); sc.setAttribute('fill','rgb(52,34,18)');
    sc.setAttribute('stroke',sys.color); sc.setAttribute('stroke-width','1.5');
    const st=svgEl('text'); st.setAttribute('text-anchor','middle'); st.setAttribute('dy','4');
    st.setAttribute('fill',sys.color); st.setAttribute('font-family','"Courier New",monospace');
    st.setAttribute('font-size','10'); st.setAttribute('font-weight','bold');
    st.textContent=sys.label;
    sg.append(sc,st); g.appendChild(sg);

    // Items per status group
    const groups={done:[],active:[],idea:[]};
    items.filter(i=>i.system===sys.id).forEach(i=>{
      if(groups[i.status]) groups[i.status].push(i);
    });

    Object.entries(groups).forEach(([status,gItems])=>{
      if(!gItems.length)return;
      const r=status==='done'?RDONE:status==='active'?RACTIVE:RIDEA;
      gItems.forEach((item,idx)=>{
        const t=gItems.length>1?(idx/(gItems.length-1)-0.5):0;
        const iAngle=rad+t*SECTOR;
        const ix=Math.cos(iAngle)*r, iy=Math.sin(iAngle)*r;

        // Connection line
        const ln=svgEl('line');
        ln.setAttribute('x1',sx); ln.setAttribute('y1',sy);
        ln.setAttribute('x2',ix); ln.setAttribute('y2',iy);
        ln.setAttribute('stroke',sys.color); ln.setAttribute('stroke-width','0.8');
        ln.setAttribute('stroke-opacity','0.2');
        g.appendChild(ln);

        // Node shape
        const ng=svgEl('g');
        ng.setAttribute('transform',`translate(${ix},${iy})`);
        ng.style.cursor='pointer';
        ng.setAttribute('data-id',item.id);

        if(status==='done'){
          // Filled rounded rect (settled, grounded)
          const nr=svgEl('rect'); nr.setAttribute('x','-18'); nr.setAttribute('y','-7');
          nr.setAttribute('width','36'); nr.setAttribute('height','14'); nr.setAttribute('rx','7');
          nr.setAttribute('fill',sys.color); nr.setAttribute('fill-opacity','0.55');
          nr.setAttribute('stroke',sys.color); nr.setAttribute('stroke-width','1');
          ng.appendChild(nr);
        } else if(status==='active'){
          // Diamond (in motion)
          const nd=svgEl('path'); nd.setAttribute('d','M0,-10 L10,0 L0,10 L-10,0 Z');
          nd.setAttribute('fill',sys.color); nd.setAttribute('fill-opacity','0.7');
          nd.setAttribute('stroke',sys.color); nd.setAttribute('stroke-width','1');
          nd.setAttribute('filter','url(#glow)');
          ng.appendChild(nd);
        } else {
          // Hollow circle (potential, not yet solid)
          const nc=svgEl('circle'); nc.setAttribute('r','7');
          nc.setAttribute('fill','none');
          nc.setAttribute('stroke',sys.color); nc.setAttribute('stroke-width','1');
          nc.setAttribute('stroke-opacity','0.5');
          ng.appendChild(nc);
        }

        // Label (positioned away from center)
        const labelAway=iAngle; // text goes radially outward
        const lx=Math.cos(labelAway)*16, ly=Math.sin(labelAway)*16;
        const anchor=Math.cos(labelAway)>0.1?'start':Math.cos(labelAway)<-0.1?'end':'middle';
        const nt=svgEl('text'); nt.setAttribute('x',lx); nt.setAttribute('y',ly);
        nt.setAttribute('text-anchor',anchor); nt.setAttribute('dominant-baseline','middle');
        nt.setAttribute('fill','rgba(200,188,168,0.75)'); nt.setAttribute('font-family','"Courier New",monospace');
        nt.setAttribute('font-size','9'); nt.setAttribute('pointer-events','none');
        nt.textContent=item.title.length>26?item.title.slice(0,24)+'…':item.title;
        ng.appendChild(nt);

        // Interaction
        ng.addEventListener('mouseenter',e=>{
          const tt=document.getElementById('svg-tooltip');
          tt.textContent=item.title;
          tt.style.display='block';
          moveTip(e);
        });
        ng.addEventListener('mousemove',moveTip);
        ng.addEventListener('mouseleave',()=>document.getElementById('svg-tooltip').style.display='none');
        ng.addEventListener('click',()=>openMapPanel(item,sys));
        g.appendChild(ng);
      });
    });
  });

  // Apply default transform (center map in SVG)
  mapT={x:W/2,y:H/2,scale:1};
  applyMapTransform();
  renderMinimap();
}

function svgEl(tag){ return document.createElementNS(NS,tag); }

function moveTip(e){
  const tt=document.getElementById('svg-tooltip');
  const r=document.getElementById('map-view').getBoundingClientRect();
  tt.style.left=(e.clientX-r.left+14)+'px';
  tt.style.top=(e.clientY-r.top-32)+'px';
}

function openMapPanel(item,sys){
  const panel=document.getElementById('map-panel');
  const sysObj=SYSTEMS.find(s=>s.id===item.system)||{color:'#888',label:item.system};
  document.getElementById('mp-sys').textContent=SYS_LABEL[item.system]||item.system;
  document.getElementById('mp-sys').style.color=sysObj.color;
  document.getElementById('mp-title').textContent=item.title;
  const sb=document.getElementById('mp-status'); sb.textContent=STATUS_LABEL[item.status]; sb.className='mp-status '+item.status;
  document.getElementById('mp-desc').textContent=item.description||'No description yet.';
  const acts=document.getElementById('mp-actions');
  if(userRole==='archmage'){
    acts.innerHTML=`<span style="font-size:10px;color:var(--dim);font-family:var(--mono)">status:</span>
      <button class="status-btn ${item.status==='done'?'cur-done':''}" onclick="setStatusMap(${item.id},'done')">✓ done</button>
      <button class="status-btn ${item.status==='active'?'cur-active':''}" onclick="setStatusMap(${item.id},'active')">→ active</button>
      <button class="status-btn ${item.status==='idea'?'cur-idea':''}" onclick="setStatusMap(${item.id},'idea')">○ idea</button>`;
  } else { acts.innerHTML=''; }
  panel.classList.add('open');
}

async function setStatusMap(id,status){
  await db.from('roadmap').update({status}).eq('id',id);
  const i=all.find(x=>x.id===id); if(i)i.status=status;
  closeMapPanel();
  renderMap();
}

function closeMapPanel(){ document.getElementById('map-panel').classList.remove('open'); }

// ── Minimap ──────────────────────────────────────────────────────────────────
function renderMinimap(){
  const mmg=document.getElementById('minimap-nodes');
  if(!mmg) return;
  mmg.innerHTML='';
  const scl=Math.min(MM_W,MM_H)/(MAP_EXTENT*2);
  const cx=MM_W/2, cy=MM_H/2;
  // Center dot
  const cd=svgEl('circle'); cd.setAttribute('cx',cx); cd.setAttribute('cy',cy);
  cd.setAttribute('r','4'); cd.setAttribute('fill','rgba(201,169,110,.3)'); mmg.appendChild(cd);
  SYSTEMS.filter(s=>visibleSys.has(s.id)).forEach(sys=>{
    const rad=sys.angle*Math.PI/180;
    const sx=Math.cos(rad)*ARM, sy=Math.sin(rad)*ARM;
    // Arm
    const ln=svgEl('line'); ln.setAttribute('x1',cx); ln.setAttribute('y1',cy);
    ln.setAttribute('x2',cx+sx*scl); ln.setAttribute('y2',cy+sy*scl);
    ln.setAttribute('stroke',sys.color); ln.setAttribute('stroke-width','0.7');
    ln.setAttribute('stroke-opacity','0.25'); mmg.appendChild(ln);
    // System dot
    const sd=svgEl('circle'); sd.setAttribute('cx',cx+sx*scl); sd.setAttribute('cy',cy+sy*scl);
    sd.setAttribute('r','3'); sd.setAttribute('fill',sys.color); sd.setAttribute('opacity','0.7');
    mmg.appendChild(sd);
    // Item dots
    const items=filteredItems().filter(i=>i.system===sys.id);
    const groups={done:[],active:[],idea:[]};
    items.forEach(i=>groups[i.status]&&groups[i.status].push(i));
    Object.entries(groups).forEach(([status,gItems])=>{
      const r=status==='done'?RDONE:status==='active'?RACTIVE:RIDEA;
      gItems.forEach((item,idx)=>{
        const t=gItems.length>1?(idx/(gItems.length-1)-0.5):0;
        const iAngle=rad+t*SECTOR;
        const ix=Math.cos(iAngle)*r, iy=Math.sin(iAngle)*r;
        const dot=svgEl('circle'); dot.setAttribute('cx',cx+ix*scl); dot.setAttribute('cy',cy+iy*scl);
        dot.setAttribute('r','1.8'); dot.setAttribute('fill',sys.color);
        dot.setAttribute('opacity',status==='idea'?'0.25':status==='active'?'0.7':'0.45');
        mmg.appendChild(dot);
      });
    });
  });
  updateMinimapVp();
}

function updateMinimapVp(){
  const vp=document.getElementById('minimap-vp');
  const svg=document.getElementById('roadmap-svg');
  if(!vp||!svg) return;
  const W=svg.clientWidth, H=svg.clientHeight;
  const scl=Math.min(MM_W,MM_H)/(MAP_EXTENT*2);
  const cx=MM_W/2, cy=MM_H/2;
  const left=(0-mapT.x)/mapT.scale, top=(0-mapT.y)/mapT.scale;
  const right=(W-mapT.x)/mapT.scale, bottom=(H-mapT.y)/mapT.scale;
  vp.setAttribute('x',cx+left*scl); vp.setAttribute('y',cy+top*scl);
  vp.setAttribute('width',(right-left)*scl); vp.setAttribute('height',(bottom-top)*scl);
}

// Minimap drag navigation
let mmDragging=false;
const mmEl=document.getElementById('minimap');
function mmNavigate(mx,my){
  const svg=document.getElementById('roadmap-svg');
  const W=svg.clientWidth,H=svg.clientHeight;
  const scl=Math.min(MM_W,MM_H)/(MAP_EXTENT*2);
  const localX=(mx-MM_W/2)/scl, localY=(my-MM_H/2)/scl;
  mapT.x=W/2-localX*mapT.scale; mapT.y=H/2-localY*mapT.scale;
  applyMapTransform();
}
mmEl.addEventListener('mousedown',e=>{
  mmDragging=true; e.stopPropagation();
  const r=mmEl.getBoundingClientRect();
  mmNavigate(e.clientX-r.left,e.clientY-r.top);
});
document.addEventListener('mousemove',e=>{
  if(!mmDragging) return;
  const r=mmEl.getBoundingClientRect();
  mmNavigate(e.clientX-r.left,e.clientY-r.top);
});
document.addEventListener('mouseup',()=>mmDragging=false);

// Zoom bar
const MIN_SCALE=0.25, MAX_SCALE=4;
function updateZoomBar(){
  const pct=(Math.log(mapT.scale)-Math.log(MIN_SCALE))/(Math.log(MAX_SCALE)-Math.log(MIN_SCALE));
  const fill=document.getElementById('zoom-fill');
  if(fill) fill.style.width=(pct*100)+'%';
  const lbl=document.getElementById('zoom-pct');
  if(lbl) lbl.textContent=Math.round(mapT.scale*100)+'%';
}
function zoomBarClick(e){
  const r=e.currentTarget.getBoundingClientRect();
  const pct=(e.clientX-r.left)/r.width;
  mapT.scale=Math.exp(Math.log(MIN_SCALE)+pct*(Math.log(MAX_SCALE)-Math.log(MIN_SCALE)));
  applyMapTransform();
}
function mapZoomStep(dir){
  mapT.scale=Math.max(MIN_SCALE,Math.min(MAX_SCALE,mapT.scale*(dir>0?1.15:0.87)));
  applyMapTransform();
}

// Pan & zoom
const mapSvg=document.getElementById('roadmap-svg');
mapSvg.addEventListener('mousedown',e=>{if(e.button===0){mapDragging=true;mapLast={x:e.clientX,y:e.clientY};}});
mapSvg.addEventListener('mousemove',e=>{
  if(!mapDragging)return;
  mapT.x+=e.clientX-mapLast.x; mapT.y+=e.clientY-mapLast.y;
  mapLast={x:e.clientX,y:e.clientY};
  applyMapTransform();
});
mapSvg.addEventListener('mouseup',()=>mapDragging=false);
mapSvg.addEventListener('mouseleave',()=>mapDragging=false);
mapSvg.addEventListener('wheel',e=>{
  e.preventDefault();
  const factor=e.deltaY>0?0.94:1.06;
  mapT.scale=Math.max(0.25,Math.min(4,mapT.scale*factor));
  applyMapTransform();
},{passive:false});

function applyMapTransform(){
  document.getElementById('map-transform').setAttribute('transform',`translate(${mapT.x},${mapT.y}) scale(${mapT.scale})`);
  updateMinimapVp();
  updateZoomBar();
}
function resetMapView(){
  const svg=document.getElementById('roadmap-svg');
  mapT={x:svg.clientWidth/2,y:svg.clientHeight/2,scale:1};
  applyMapTransform();
  closeMapPanel();
  updateZoomBar();
}

// Initial load
load();
</script>
</body>
