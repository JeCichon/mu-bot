<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Room Quest</title>
<style>
:root{
  --bg:#13151b; --panel:#1b1e27; --panel2:#242836; --line:#323850; --ink:#ebe7de; --mute:#98a0b3;
  --accent:#f2b84b; --danger:#e5707e; --furn:#262b39; --furn-line:#5b6482;
}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--ink);font:15px/1.45 system-ui,-apple-system,"Segoe UI",sans-serif;display:flex;flex-direction:column}
header{display:flex;align-items:center;gap:20px;padding:10px 18px;border-bottom:1px solid var(--line);background:var(--panel)}
header h1{font:600 20px Georgia,"Times New Roman",serif;margin:0;letter-spacing:.02em}
header h1 small{display:block;font:12px system-ui;color:var(--mute);letter-spacing:0}
.prog{flex:1;max-width:420px;margin-left:auto}
.prog .bar{height:10px;border-radius:6px;background:var(--panel2);overflow:hidden;border:1px solid var(--line)}
.prog .bar i{display:block;height:100%;background:linear-gradient(90deg,#6fcf97,#f2b84b);width:0;transition:width .5s}
.prog span{font-size:12px;color:var(--mute)}
main{flex:1;display:flex;min-height:0}
#mapwrap{flex:1;min-width:0;padding:12px;display:flex;flex-direction:column;gap:10px}
#map{width:100%;flex:1;min-height:0;background:#0f1117;border:1px solid var(--line);border-radius:12px;touch-action:none;user-select:none}
aside{width:390px;max-width:44vw;border-left:1px solid var(--line);background:var(--panel);display:flex;flex-direction:column;min-height:0}
nav{display:flex;border-bottom:1px solid var(--line)}
nav button{flex:1;background:none;border:0;color:var(--mute);padding:12px 4px;font:600 13px system-ui;cursor:pointer;border-bottom:3px solid transparent}
nav button.on{color:var(--ink);border-bottom-color:var(--accent)}
#panel{flex:1;overflow:auto;padding:16px}
h2{font:600 18px Georgia,serif;margin:0 0 6px}
.hint{color:var(--mute);margin:0 0 12px;font-size:14px}
.dim{opacity:.7}
button,select,input,textarea{font:inherit;color:var(--ink)}
button{background:var(--panel2);border:1px solid var(--line);border-radius:8px;padding:8px 12px;cursor:pointer}
button:hover{border-color:var(--furn-line)}
button.primary{background:var(--accent);color:#1a1405;border-color:var(--accent);font-weight:600}
button.danger{color:var(--danger)}
button.small{padding:3px 8px;font-size:13px}
input,select,textarea{background:#12141b;border:1px solid var(--line);border-radius:8px;padding:7px 9px;width:100%}
textarea{min-height:130px;resize:vertical}
label{display:block;font-size:13px;color:var(--mute);margin:8px 0}
label input,label select{margin-top:3px;color:var(--ink)}
.row{display:flex;gap:8px;flex-wrap:wrap;margin:8px 0}
.two{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.card{background:var(--panel2);border:1px solid var(--line);border-radius:12px;padding:12px;margin:12px 0}
.chk{display:flex;gap:8px;align-items:center;color:var(--ink)}
.chk input{width:auto;margin:0}
.list{display:flex;flex-direction:column;gap:6px;margin:8px 0}
.item{display:flex;gap:6px;align-items:center}
.item input[type=text]{flex:1}
.item select{width:120px}
.sw{width:14px;height:14px;border-radius:50%;flex:none;border:1px solid #0006}
input[type=color]{width:38px;height:34px;padding:2px;flex:none}
.chip{display:inline-flex;gap:8px;align-items:center;padding:8px 12px;border-radius:999px;border:2px solid var(--line);background:var(--panel2);cursor:pointer;font-weight:600}
.chip.on{border-color:var(--ink)}
.chip b{font-weight:700;opacity:.8}
.big{font:600 28px Georgia,serif;margin:6px 0 2px;line-height:1.2}
.homes{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin:12px 0}
.homes button{padding:14px 8px;font-weight:700;border:0;color:#10121a;font-size:15px}
.homes button.idk{grid-column:1/-1;color:var(--ink);background:#3a3f4d}
.cleanrow{display:flex;align-items:center;gap:10px;padding:10px;border-radius:10px;background:var(--panel2);border:1px solid var(--line)}
.cleanrow .nm{flex:1}
.cleanrow .nm small{display:block;color:var(--mute)}
.cleanrow button{padding:8px 14px;font-weight:700}
footer{border-top:1px solid var(--line);padding:10px 16px;font-size:12px;color:var(--mute)}
footer .row{margin:6px 0 0}
.pulse{animation:pulse 1.2s ease-in-out infinite}
@keyframes pulse{50%{opacity:.45}}
.good{color:#6fcf97}
#layoutbar{display:flex;gap:12px;align-items:center;flex-wrap:wrap}
.lays{display:flex;gap:6px;align-items:center;flex-wrap:wrap}
.lay{padding:7px 14px;font-weight:600}
.lay.on{background:var(--accent);color:#1a1405;border-color:var(--accent)}
kbd{font:600 11px system-ui;opacity:.6;border:1px solid currentColor;border-radius:4px;padding:0 4px}
.laytools{display:flex;gap:12px;align-items:center;flex-wrap:wrap;margin-left:auto}
.laytools input[type=text]{width:160px}
.laytools .chk{margin:0}
details.inside{margin:6px 0 0}
details.inside summary{cursor:pointer;color:var(--mute);font-size:13px}
.item .nm2{flex:1}
@media (max-width:900px){main{flex-direction:column}aside{width:auto;max-width:none;height:50vh;border-left:0;border-top:1px solid var(--line)}}
</style>
</head>
<body>
<header>
  <h1>Room Quest<small>name it · give it a home · clear the fog</small></h1>
  <div class="prog"><div class="bar"><i id="bar"></i></div><span id="progtxt"></span></div>
</header>
<main>
  <div id="mapwrap">
    <div id="layoutbar"></div>
    <svg id="map" viewBox="90 140 1720 1240" xmlns="http://www.w3.org/2000/svg">
      <defs>
        <filter id="fog" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="16"/></filter>
        <pattern id="grid" width="50" height="50" patternUnits="userSpaceOnUse"><path d="M50 0H0V50" fill="none" stroke="#1b1f2b" stroke-width="2"/></pattern>
      </defs>
      <rect x="-500" y="-500" width="4000" height="4000" fill="url(#grid)" data-t="bg"/>
      <image id="sketch" href="sketch.png" x="0" y="0" width="2208" height="1656" opacity=".2" style="pointer-events:none"/>
      <g id="walls" style="pointer-events:none"></g>
      <g id="ghost" style="pointer-events:none"></g>
      <g id="furn"></g>
      <g id="tags" style="pointer-events:none"></g>
      <g id="piles"></g>
      <g id="fx" style="pointer-events:none"></g>
    </svg>
  </div>
  <aside>
    <nav id="tabs"></nav>
    <div id="panel"></div>
    <footer>
      Everything stays in this browser, on your computer. Nothing is uploaded.
      <div class="row">
        <button class="small" data-act="export">Save backup</button>
        <button class="small" data-act="import">Load backup</button>
        <button class="small danger" data-act="reset" id="resetbtn">Start over</button>
        <input type="file" id="file" accept=".json" hidden>
      </div>
    </footer>
  </aside>
</main>

<script>
"use strict";
const KEY = "roomquest.v1";
const $ = s => document.querySelector(s);
const uid = () => Math.random().toString(36).slice(2, 9);
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const SVGNS = "http://www.w3.org/2000/svg";
const snap = v => Math.round(v / 10) * 10;

/* ---------- starting data, traced from the sketch ---------- */
function defaults() {
  const F = (name, x, y, w, h, shape = "rect", kind = "furn") => ({ id: uid(), name, x, y, w, h, shape, kind, type: "furniture", rot: 0, face: 0, locked: false });
  const furniture = [
    F("Lofted bed", 690, 615, 940, 515, "rect", "loft"),
    F("Closet", 990, 200, 700, 270, "rect", "closet"),
    F("Desk + computer", 820, 570, 500, 250),
    F("Bean bag", 790, 870, 340, 340, "ellipse"),
    F("Cabinet?", 1380, 860, 240, 270),
    F("Top-right shelf?", 1430, 470, 290, 130),
    F("Corner stack?", 1400, 1150, 340, 180),
    F("Table?", 480, 605, 150, 215),
    F("Left wall A", 150, 530, 120, 180),
    F("Left wall B", 175, 730, 95, 95, "ellipse"),
    F("Left wall C", 170, 835, 100, 75),
    F("Left wall D", 160, 930, 90, 190),
    F("Left wall E", 175, 1170, 90, 130, "ellipse"),
    F("Window", 530, 1295, 440, 30, "rect", "window"),
  ];
  [[715,655],[1585,625],[715,1125],[1620,1110],[1165,870]].forEach((p, i) =>
    furniture.push(F("Post " + (i + 1), p[0] - 36, p[1] - 36, 72, 72, "ellipse", "post")));
  const byName = n => furniture.find(f => f.name === n).id;
  const homes = [
    { id: "closet", name: "Closet", color: "#5b9cf6", furnId: byName("Closet") },
    { id: "desk",   name: "Desk",   color: "#6fcf97", furnId: byName("Desk + computer") },
    { id: "shelf",  name: "Shelf",  color: "#b58cf0", furnId: null },
    { id: "donate", name: "Donate", color: "#f2b84b", furnId: null },
    { id: "trash",  name: "Trash",  color: "#e5707e", furnId: null },
    { id: "idk",    name: "Not sure yet", color: "#8a8f9c", furnId: null, special: true },
  ];
  return { furniture, homes, piles: [], items: [], log: [], showSketch: true };
}
let S = (() => { try { const r = localStorage.getItem(KEY); if (r) return JSON.parse(r); } catch (e) {} return defaults(); })();
function syncLayout() { const L = S.layouts && S.layouts.find(l => l.id === S.layoutId); if (L) L.furniture = S.furniture; }
function save() { syncLayout(); try { const c = { ...S }; delete c.furniture; localStorage.setItem(KEY, JSON.stringify(c)); } catch (e) {} }
function migrate() {
  if (!S.layouts) { S.layouts = [{ id: uid(), name: "Current room", furniture: S.furniture }]; S.layoutId = S.layouts[0].id; }
  const L = S.layouts.find(l => l.id === S.layoutId) || S.layouts[0]; S.layoutId = L.id; S.furniture = L.furniture;
  S.layouts.forEach(l => l.furniture.forEach(f => { if (f.type == null) f.type = "furniture"; if (f.rot == null) f.rot = 0; if (f.face == null) f.face = 0; if (f.locked == null) f.locked = false; }));
}
migrate();
const PALETTE = ["#5b9cf6","#6fcf97","#b58cf0","#f2b84b","#e5707e","#4dd0c8","#f08a4b","#d36fd0","#a3d65c","#6fa8dc"];
const nextColor = () => PALETTE.find(c => !S.homes.some(h => h.color.toLowerCase() === c)) || PALETTE[Math.floor(Math.random() * PALETTE.length)];

/* ---------- UI state ---------- */
let mode = "layout";            // layout | homes | piles | sort | clean
let sel = null;                 // {type:'furn'|'pile', id}
let placing = false;            // next map click drops a new pile
let revisit = false;            // sort: include 'not sure yet' items
let skips = {};
let cleanHome = null;
let flash = "";

const homeOf = id => S.homes.find(h => h.id === id);
const pending = () => S.items.filter(i => !i.done);

/* ---------- map ---------- */
const svg = $("#map");
const el = (tag, attrs = {}, parent) => { const n = document.createElementNS(SVGNS, tag); for (const k in attrs) n.setAttribute(k, attrs[k]); if (parent) parent.appendChild(n); return n; };

function drawWalls() {
  const g = $("#walls"); g.innerHTML = "";
  const L = (x1, y1, x2, y2, c = "#7d86a6", w = 10) => el("line", { x1, y1, x2, y2, stroke: c, "stroke-width": w, "stroke-linecap": "round" }, g);
  L(140,190,1740,190); L(1740,190,1740,1310); L(1740,1310,140,1310); L(140,1310,140,190);
  L(140,480,340,480); L(830,480,990,480); L(990,190,990,480);
  L(350,470,540,215,"#d9625a",14);
  el("line", { x1:540, y1:215, x2:910, y2:470, stroke:"#d9625a", "stroke-width":4, "stroke-dasharray":"14 12", opacity:.6 }, g);
  const t = (x, y, s, c = "#d9625a") => { const n = el("text", { x, y, fill: c, "font-size": 40, "font-family": "Georgia,serif", opacity: .85 }, g); n.textContent = s; };
  t(190, 330, "door"); g.lastChild.setAttribute("id", "doorlabel");
}

function dotLayout(pile) {
  const items = S.items.filter(i => i.pileId === pile.id && !i.done);
  const pos = {}; let ring = 0, placed = 0;
  while (placed < items.length) {
    const R = 52 + ring * 32, cap = Math.max(6, Math.floor(2 * Math.PI * R / 30));
    const n = Math.min(cap, items.length - placed);
    for (let k = 0; k < n; k++) {
      const a = -Math.PI / 2 + (2 * Math.PI * k) / n + ring * .4;
      pos[items[placed + k].id] = { x: R * Math.cos(a), y: R * Math.sin(a) };
    }
    placed += n; ring++;
  }
  return { pos, outer: items.length ? 52 + (ring - 1) * 32 + 26 : 50, items };
}
const hash = s => { let h = 0; for (const c of s) h = (h * 31 + c.charCodeAt(0)) | 0; return Math.abs(h); };
function homeCenter(h) {
  const f = h && S.furniture.find(x => x.id === h.furnId);
  return f ? { x: f.x + f.w / 2, y: f.y + f.h / 2 } : null;
}

function rotPt(f, x, y) {
  const r = (f.rot || 0) * Math.PI / 180, cx = f.x + f.w / 2, cy = f.y + f.h / 2;
  return { x: cx + x * Math.cos(r) - y * Math.sin(r), y: cy + x * Math.sin(r) + y * Math.cos(r) };
}
function renderMap() {
  $("#sketch").setAttribute("display", S.showSketch ? "" : "none");
  $("#doorlabel").setAttribute("display", S.showSketch ? "none" : "");
  renderGhost();
  const fg = $("#furn"); fg.innerHTML = "";
  const hl = mode === "clean" && cleanHome ? homeOf(cleanHome) : null;
  S.furniture.forEach(f => {
    const cx = f.x + f.w / 2, cy = f.y + f.h / 2;
    const g = el("g", { "data-t": "furn", "data-id": f.id, transform: `translate(${cx} ${cy}) rotate(${f.rot || 0})`, style: mode === "layout" ? "cursor:move" : "pointer-events:none" }, fg);
    const loft = f.kind === "loft", post = f.kind === "post", win = f.kind === "window", large = f.type === "large";
    const style = {
      fill: loft ? "#c9c98a" : win ? "#3c6f78" : post ? "#1b1e27" : large ? "#2d2a3d" : "#262b39",
      "fill-opacity": loft ? .13 : 1,
      stroke: loft ? "#c9c98a" : win ? "#6aa9b4" : large ? "#9a8fd0" : "#5b6482",
      "stroke-width": 4, "stroke-dasharray": loft ? "16 10" : large ? "12 7" : ""
    };
    if (f.shape === "ellipse") el("ellipse", { cx: 0, cy: 0, rx: f.w / 2, ry: f.h / 2, ...style }, g);
    else el("rect", { x: -f.w / 2, y: -f.h / 2, width: f.w, height: f.h, rx: 10, ...style }, g);
    if (post) el("circle", { r: 10, fill: "#5b6482" }, g);
    if (!post && !win) {   // the front-facing arrow
      const face = f.face || 0, d = (face % 2 === 0 ? f.h : f.w) / 2, k = Math.max(.45, Math.min(1, d / 70));
      const a = el("g", { transform: `rotate(${face * 90})`, style: "pointer-events:none" }, g);
      el("path", { d: `M0 ${-d + 8 * k} L${-14 * k} ${-d + 30 * k} L${14 * k} ${-d + 30 * k} Z`, fill: "#f2b84b" }, a);
      el("line", { x1: 0, y1: -d + 30 * k, x2: 0, y2: -d + 52 * k, stroke: "#f2b84b", "stroke-width": 5 * k + 1, "stroke-linecap": "round" }, a);
    }
    if (mode === "layout" && sel && sel.type === "furn" && sel.id === f.id) {
      el("rect", { x: -f.w / 2 - 6, y: -f.h / 2 - 6, width: f.w + 12, height: f.h + 12, fill: "none", stroke: "#f2b84b", "stroke-width": 4, "stroke-dasharray": "10 8", rx: 12, style: "pointer-events:none" }, g);
      el("line", { x1: 0, y1: -f.h / 2 - 6, x2: 0, y2: -f.h / 2 - 44, stroke: "#f2b84b", "stroke-width": 4 }, g);
      el("circle", { "data-t": "rotate", "data-id": f.id, cx: 0, cy: -f.h / 2 - 44, r: 18, fill: "#13151b", stroke: "#f2b84b", "stroke-width": 5, style: "cursor:grab" }, g);
      if (f.locked) { const l = el("text", { x: f.w / 2, y: f.h / 2 + 8, "text-anchor": "middle", "font-size": 34, style: "pointer-events:none" }, g); l.textContent = "🔒"; }
      else el("circle", { "data-t": "resize", "data-id": f.id, cx: f.w / 2, cy: f.h / 2, r: 20, fill: "#f2b84b", style: "cursor:nwse-resize" }, g);
    }
  });
  S.furniture.forEach(f => {   // labels last, so nothing covers them
    if (f.kind === "post" || f.kind === "window" || f.w <= 70) return;
    const lp = f.kind === "loft" ? rotPt(f, 60, f.h / 2 - 24) : rotPt(f, 0, 10);
    const t = el("text", { x: lp.x, y: lp.y, "text-anchor": "middle", fill: f.kind === "loft" ? "#c9c98a" : "#b9c0d6", "font-size": Math.min(34, f.w / Math.max(5, f.name.length * .55)), "font-family": "system-ui", style: "pointer-events:none" }, fg);
    t.textContent = f.name;
  });

  // home color tags on the furniture they live in
  const tg = $("#tags"); tg.innerHTML = "";
  const stack = {};
  S.homes.forEach(h => {
    const f = S.furniture.find(x => x.id === h.furnId);
    if (!f) return;
    const n = stack[f.id] = (stack[f.id] || 0) + 1;
    const active = !hl || hl.id === h.id;
    const count = pending().filter(i => i.homeId === h.id).length;
    const og = el("g", { transform: `translate(${f.x + f.w / 2} ${f.y + f.h / 2}) rotate(${f.rot || 0})` }, tg);
    const ring = { fill: "none", stroke: h.color, "stroke-width": hl && hl.id === h.id ? 12 : 6, opacity: active ? .95 : .2 };
    if (f.shape === "ellipse") el("ellipse", { rx: f.w / 2 + 4, ry: f.h / 2 + 4, ...ring }, og);
    else el("rect", { x: -f.w / 2 - 4, y: -f.h / 2 - 4, width: f.w + 8, height: f.h + 8, rx: 12, ...ring }, og);
    const bp = rotPt(f, -f.w / 2 + 26 + (n - 1) * 54, -f.h / 2 - 4);
    el("circle", { cx: bp.x, cy: bp.y, r: 24, fill: h.color, opacity: active ? 1 : .25 }, tg);
    const t = el("text", { x: bp.x, y: bp.y + 9, "text-anchor": "middle", fill: "#10121a", "font-size": 26, "font-weight": 700, "font-family": "system-ui" }, tg);
    t.textContent = count;
  });

  // piles
  const pg = $("#piles"); pg.innerHTML = "";
  S.piles.forEach(p => {
    const g = el("g", { transform: `translate(${p.x} ${p.y})`, "data-t": "pile", "data-id": p.id, style: mode === "piles" ? "cursor:move" : "pointer-events:none" }, pg);
    const { pos, outer, items } = dotLayout(p);
    const total = S.items.filter(i => i.pileId === p.id).length;
    const fogShare = total === 0 ? 1 : items.length === 0 ? 0 : items.filter(i => !i.homeId || i.homeId === "idk").length / items.length;
    const cleared = total > 0 && items.length === 0;
    if (cleared) {
      el("circle", { r: 46, fill: "none", stroke: "#6fcf97", "stroke-width": 4, "stroke-dasharray": "8 8", opacity: .7 }, g);
      const t = el("text", { y: 14, "text-anchor": "middle", fill: "#6fcf97", "font-size": 40 }, g); t.textContent = "✓";
    } else {
      const cloud = el("g", { filter: "url(#fog)", opacity: Math.max(.12, .12 + fogShare * .62) }, g), h = hash(p.id);
      for (let k = 0; k < 4; k++) el("circle", { cx: ((h >> (k * 3)) % 40) - 20, cy: ((h >> (k * 3 + 5)) % 40) - 20, r: outer * (.62 + k * .1), fill: "#cdd3e6" }, cloud);
      if (total === 0) {
        el("rect", { x: -30, y: -24, width: 60, height: 48, rx: 8, fill: "#3a3f4d", stroke: "#cdd3e6", "stroke-width": 3 }, g);
        const q = el("text", { y: 12, "text-anchor": "middle", fill: "#ebe7de", "font-size": 34, "font-weight": 700 }, g); q.textContent = "?";
      }
    }
    items.forEach(it => {
      const h = homeOf(it.homeId), c = h ? h.color : "#cdd3e6";
      const dim = mode === "clean" && cleanHome && it.homeId !== cleanHome;
      const hot = mode === "clean" && cleanHome && it.homeId === cleanHome;
      const d = el("circle", { cx: pos[it.id].x, cy: pos[it.id].y, r: hot ? 17 : 13, fill: c, stroke: h ? "#0008" : "#0009", "stroke-width": 3, opacity: dim ? .15 : 1 }, g);
      if (hot) d.setAttribute("class", "pulse");
      const tt = el("title", {}, d); tt.textContent = it.name + (h ? " → " + h.name : " (no home yet)");
    });
    const nm = el("text", { y: outer + 34, "text-anchor": "middle", fill: "#ebe7de", "font-size": 30, "font-family": "Georgia,serif", stroke: "#0f1117", "stroke-width": 6, "paint-order": "stroke" }, g);
    nm.textContent = p.name + (items.length ? " · " + items.length : "");
    if (sel && sel.type === "pile" && sel.id === p.id) el("circle", { r: outer + 10, fill: "none", stroke: "#f2b84b", "stroke-width": 4, "stroke-dasharray": "10 8" }, g);
  });
  const hint = placing ? "Click the map to drop the pile" : "";
  svg.style.cursor = placing ? "crosshair" : "";
  renderProgress(hint);
}

function renderProgress() {
  const total = S.items.length, done = S.items.filter(i => i.done).length;
  $("#bar").style.width = total ? (100 * done / total) + "%" : "0";
  $("#progtxt").textContent = total ? `${done} of ${total} things put away` : "No things named yet";
}

/* ---------- map interaction ---------- */

function renderBar() {
  const L = S.layouts, cur = L.find(l => l.id === S.layoutId), o = otherLayout();
  $("#layoutbar").innerHTML = `<div class="lays">${L.map((l, i) => `<button class="lay ${l.id === S.layoutId ? "on" : ""}" data-lay="${l.id}"><kbd>${i + 1}</kbd> <span class="nm">${esc(l.name)}</span></button>`).join("")}
    <button class="small" data-lay-act="new" title="Copy this layout so you can try changes">+ New layout</button></div>
    <div class="laytools"><input type="text" id="layname" value="${esc(cur.name)}" aria-label="Layout name">
    ${o ? `<label class="chk"><input type="checkbox" id="ghostchk" ${S.ghost ? "checked" : ""}> Ghost of “${esc(o.name)}” <kbd>G</kbd></label>` : ""}
    ${L.length > 1 ? `<button class="small danger" data-lay-act="del" id="laydel">Delete layout</button>` : ""}
    <span id="moved" class="hint" style="margin:0"></span></div>`;
}
function switchLayout(id) {
  const l = S.layouts.find(x => x.id === id); if (!l || id === S.layoutId) return;
  syncLayout(); S.prevId = S.layoutId; S.layoutId = id; S.furniture = l.furniture; sel = null; drag = null; save(); render();
}
let layDelArmed = false;
$("#layoutbar").addEventListener("click", e => {
  const lb = e.target.closest("[data-lay]"); if (lb) return switchLayout(lb.dataset.lay);
  const a = e.target.closest("[data-lay-act]"); if (!a) return;
  if (a.dataset.layAct === "new") {
    syncLayout();
    const nl = { id: uid(), name: "Layout " + (S.layouts.length + 1), furniture: JSON.parse(JSON.stringify(S.furniture)) };
    S.layouts.push(nl); switchLayout(nl.id); S.ghost = true; save(); render();
    const n = $("#layname"); if (n) { n.focus(); n.select(); }
  }
  if (a.dataset.layAct === "del") {
    if (!layDelArmed) { layDelArmed = true; a.textContent = "Really delete?"; setTimeout(() => { layDelArmed = false; const b = $("#laydel"); if (b) b.textContent = "Delete layout"; }, 4000); return; }
    layDelArmed = false;
    const rest = S.layouts.filter(l => l.id !== S.layoutId); S.layouts = rest; S.layoutId = rest[0].id; S.furniture = rest[0].furniture; S.prevId = null; sel = null; save(); render();
  }
});
$("#layoutbar").addEventListener("input", e => {
  if (e.target.id !== "layname") return;
  const cur = S.layouts.find(l => l.id === S.layoutId); cur.name = e.target.value;
  const n = document.querySelector(".lay.on .nm"); if (n) n.textContent = e.target.value; save();
});
$("#layoutbar").addEventListener("change", e => {
  if (e.target.id === "ghostchk") { S.ghost = e.target.checked; save(); e.target.blur(); renderMap(); }
  if (e.target.id === "layname") { renderBar(); renderMap(); }
});
document.addEventListener("keydown", e => {
  if (e.target.matches && e.target.matches("input,textarea,select") || e.ctrlKey || e.metaKey || e.altKey) return;
  const n = +e.key; if (n >= 1 && n <= S.layouts.length) switchLayout(S.layouts[n - 1].id);
  if (e.key === "g" || e.key === "G") { if (otherLayout()) { S.ghost = !S.ghost; save(); render(); } }
});

/* ---------- backup / reset ---------- */
let resetArmed = false;
document.querySelector("footer").addEventListener("click", e => {
  const b = e.target.closest("[data-act]"); if (!b) return;
  if (b.dataset.act === "export") {
    const a = document.createElement("a");
    a.href = URL.createObjectURL(new Blob([JSON.stringify(S, null, 2)], { type: "application/json" }));
    a.download = "room-quest-backup.json"; a.click();
  }
  if (b.dataset.act === "import") $("#file").click();
  if (b.dataset.act === "reset") {
    if (!resetArmed) { resetArmed = true; b.textContent = "Really start over?"; setTimeout(() => { resetArmed = false; b.textContent = "Start over"; }, 4000); return; }
    S = defaults(); migrate(); sel = null; cleanHome = null; save(); resetArmed = false; b.textContent = "Start over"; render();
  }
});
$("#file").addEventListener("change", e => {
  const f = e.target.files[0]; if (!f) return;
  f.text().then(t => { try { S = JSON.parse(t); migrate(); save(); sel = null; render(); } catch (err) { alert("That file didn't look like a backup."); } });
});

drawWalls(); render();
</script>
</body>
</html>
