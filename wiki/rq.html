<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Room Quest</title>
<style>
:root{
  --bg:#13151b; --panel:#1b1e27; --panel2:#242836; --line:#323850; --ink:#ebe7de; --mute:#98a0b3;
  --accent:#f2b84b; --danger:#e5707e; --furn:#262b39; --furn-line:#5b6482;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{background:#13151b}
html,body{height:100%;margin:0;overscroll-behavior:none}
body{height:100vh;height:100dvh;background:var(--bg);color:var(--ink);font:15px/1.45 system-ui,-apple-system,"Segoe UI",sans-serif;display:flex;flex-direction:column;-webkit-text-size-adjust:100%}
/* sticky + opaque: iOS 26 skips its Liquid Glass blur over a header pinned to the top edge (tested on iPhone 17 Pro, iOS 27.2) */
header{position:sticky;top:0;z-index:50;display:flex;align-items:center;gap:20px;padding:10px 18px;border-bottom:1px solid var(--line);background:var(--panel);padding-top:max(10px,env(safe-area-inset-top))}
header h1{font:600 20px Georgia,"Times New Roman",serif;margin:0;letter-spacing:.02em}
header h1 small{display:block;font:12px system-ui;color:var(--mute);letter-spacing:0}
.prog{flex:1;max-width:420px;margin-left:auto}
.prog .bar{height:10px;border-radius:6px;background:var(--panel2);overflow:hidden;border:1px solid var(--line)}
.prog .bar i{display:block;height:100%;background:linear-gradient(90deg,#6fcf97,#f2b84b);width:0;transition:width .5s}
.prog span{font-size:12px;color:var(--mute)}
main{flex:1;display:flex;min-height:0}
#mapwrap{flex:1;min-width:0;padding:12px;display:flex;flex-direction:column;gap:10px}
#stage{position:relative;flex:1;min-height:0}
#map{position:absolute;inset:0;width:100%;height:100%;background:#0f1117;border:1px solid var(--line);border-radius:12px;touch-action:none;user-select:none;-webkit-user-select:none}
#side{position:absolute;inset:0;width:100%;height:100%;display:none;background:#0f1117;border:1px solid var(--line);border-radius:12px;touch-action:none;user-select:none;-webkit-user-select:none}
#iso{position:absolute;inset:0;width:100%;height:100%;display:none;background:#0f1117;border:1px solid var(--line);border-radius:12px;touch-action:none;user-select:none;-webkit-user-select:none;cursor:grab}
#stage.isov #iso{display:block}
#stage.isov #side{display:none!important}
.viewsw .isoctl{display:flex;gap:4px;align-items:center}
.viewsw .isoctl button{background:#13151bd9;border:1px solid var(--line);border-radius:10px;min-height:36px;min-width:44px;font:600 15px system-ui}
#stage.side #side{display:block}
#stage.side #map,#stage.side .zoomctl,#stage.side #popup{display:none!important}
.viewsw{position:absolute;left:8px;top:8px;z-index:6;display:flex;flex-direction:column;gap:4px;align-items:flex-start;max-width:calc(100% - 16px)}
.viewsw .seg{display:flex;background:#13151bd9;border:1px solid var(--line);border-radius:10px;overflow:hidden}
.viewsw .seg button{border:0;border-radius:0;background:transparent;padding:6px 11px;font:600 13px system-ui;min-height:36px}
.viewsw .seg button.on{background:var(--accent);color:#13151b}
.viewsw small{background:#13151bcc;border-radius:6px;padding:2px 7px;color:var(--mute);font:11px system-ui}
.zoomctl{position:absolute;right:10px;bottom:10px;display:flex;flex-direction:column;gap:6px;z-index:5}
.zoomctl button{width:40px;height:40px;padding:0;font-size:20px;background:#1b1e27e6}
aside{width:390px;max-width:44vw;border-left:1px solid var(--line);background:var(--panel);display:flex;flex-direction:column;min-height:0}
.grab{display:none;height:24px;cursor:pointer;flex:none}
.grab::after{content:"";display:block;width:44px;height:5px;border-radius:3px;background:var(--furn-line);margin:10px auto 0}
nav{display:flex;border-bottom:1px solid var(--line)}
nav button{flex:1;background:none;border:0;border-radius:0;color:var(--mute);padding:12px 2px;font:600 13px system-ui;cursor:pointer;border-bottom:3px solid transparent}
nav button.on{color:var(--ink);border-bottom-color:var(--accent)}
#panel{flex:1;overflow:auto;padding:16px;overscroll-behavior:contain;-webkit-overflow-scrolling:touch}
h2{font:600 18px Georgia,serif;margin:0 0 6px}
.hint{color:var(--mute);margin:0 0 12px;font-size:14px}
.dim{opacity:.7}
button,select,input,textarea{font:inherit;color:var(--ink)}
button{background:var(--panel2);border:1px solid var(--line);border-radius:8px;padding:8px 12px;cursor:pointer;touch-action:manipulation}
button:hover{border-color:var(--furn-line)}
button:disabled{opacity:.4;cursor:not-allowed}
button.primary{background:var(--accent);color:#1a1405;border-color:var(--accent);font-weight:600}
button.danger{color:var(--danger)}
button.small{padding:3px 8px;font-size:13px}
input,select,textarea{font-size:16px;background:#12141b;border:1px solid var(--line);border-radius:8px;padding:7px 9px;width:100%}
textarea{min-height:130px;resize:vertical}
textarea.short{min-height:80px}
label{display:block;font-size:13px;color:var(--mute);margin:8px 0}
label input,label select{margin-top:3px;color:var(--ink)}
.row{display:flex;gap:8px;flex-wrap:wrap;margin:8px 0}
.two{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.card{background:var(--panel2);border:1px solid var(--line);border-radius:12px;padding:12px;margin:12px 0}
.chk{display:flex;gap:8px;align-items:center;color:var(--ink)}
.chk input{width:auto;margin:0}
.list{display:flex;flex-direction:column;gap:6px;margin:8px 0}
.item{display:flex;gap:6px;align-items:center}
.item input[type=text]{flex:1}
.item select{width:120px}
.item .nm2{flex:1}
.sw{width:14px;height:14px;border-radius:50%;flex:none;border:1px solid #0006}
input[type=color]{width:38px;height:34px;padding:2px;flex:none}
.chip{display:inline-flex;gap:8px;align-items:center;padding:8px 12px;border-radius:999px;border:2px solid var(--line);background:var(--panel2);cursor:pointer;font-weight:600}
.chip.on{border-color:var(--ink)}
.chip b{font-weight:700;opacity:.8}
.big{font:600 28px Georgia,serif;margin:6px 0 2px;line-height:1.2}
.homes{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin:12px 0}
.homes button{padding:14px 8px;font-weight:700;border:0;color:#10121a;font-size:15px}
.homes button.idk{grid-column:1/-1;color:var(--ink);background:#3a3f4d}
.cleanrow{display:flex;align-items:center;gap:10px;padding:10px;border-radius:10px;background:var(--panel2);border:1px solid var(--line)}
.cleanrow .nm{flex:1;min-width:0}
.cleanrow .nm small{display:block;color:var(--mute)}
.cleanrow button{padding:8px 14px;font-weight:700}
.foot{margin-top:22px;padding-top:12px;border-top:1px solid var(--line);font-size:12px;color:var(--mute)}
.pulse{animation:pulse 1.2s ease-in-out infinite}
@keyframes pulse{50%{opacity:.45}}
.good{color:#6fcf97}
#layoutbar{display:flex;gap:12px;align-items:center;flex-wrap:wrap}
.lays{display:flex;gap:6px;align-items:center;flex-wrap:wrap}
.lay{padding:7px 14px;font-weight:600}
.lay.on{background:var(--accent);color:#1a1405;border-color:var(--accent)}
kbd{font:600 11px system-ui;opacity:.6;border:1px solid currentColor;border-radius:4px;padding:0 4px}
.laytools{display:flex;gap:12px;align-items:center;flex-wrap:wrap;margin-left:auto}
.laytools input[type=text]{width:160px}
.laytools .chk{margin:0}
details.inside{margin:6px 0 0}
details.inside summary{cursor:pointer;color:var(--mute);font-size:13px}
.act{display:grid;grid-template-columns:auto 1fr auto;gap:6px 8px;align-items:center;padding:8px 0;border-top:1px solid var(--line)}
.act .ic{font-size:20px}
.act .nm small{display:block;color:var(--mute);font-size:12px}
.act .ctl{grid-column:1/-1;display:flex;gap:8px;align-items:center}
.act .ctl select{flex:1}
.done-txt{text-decoration:line-through;opacity:.6}
/* floating menu for a pile or a spot */
#popup{position:absolute;z-index:20;width:330px;max-width:calc(100% - 16px);max-height:78%;overflow:auto;background:var(--panel);border:1px solid var(--furn-line);border-radius:14px;box-shadow:0 12px 40px #000a;padding:12px;display:none}
#popup.show{display:block}
.pm-head{display:flex;align-items:center;gap:8px;margin-bottom:6px}
.pm-head b{flex:1;font:600 17px Georgia,serif;min-width:0;overflow-wrap:anywhere}
.pm-item{display:grid;grid-template-columns:auto 1fr;gap:6px 8px;align-items:center;padding:9px 0;border-top:1px solid var(--line)}
.pm-item .ctl{grid-column:1/-1;display:flex;gap:8px}
.pm-item .ctl select{flex:1;min-width:0}
.pm-item .ctl button{font-weight:700}
.pm-note{white-space:pre-wrap;color:var(--mute);font-size:14px;margin:0 0 8px}
@media (pointer:coarse){
  button,select,input:not([type=checkbox]):not([type=color]){min-height:44px}
  button.small{min-height:38px;padding:6px 12px}
  nav button{padding:14px 2px}
  .chk input{width:22px;height:22px}
  input[type=color]{width:46px}
}
@media (max-width:900px){
  header{padding:8px 12px;gap:10px;padding-top:max(8px,env(safe-area-inset-top))}
  header h1{font-size:17px}
  header h1 small{display:none}
  main{flex-direction:column}
  #mapwrap{padding:8px;gap:8px}
  .lays{flex-wrap:nowrap;overflow-x:auto;max-width:100%;padding-bottom:2px}
  .lay{white-space:nowrap}
  .laytools{margin-left:0}
  .laytools input[type=text]{width:130px}
  #moved{display:none}
  aside{width:auto;max-width:none;height:46vh;height:46dvh;border-left:0;border-top:1px solid var(--line);border-radius:16px 16px 0 0;box-shadow:0 -6px 20px #0008}
  aside.collapsed{height:auto}
  aside.collapsed #panel{display:none}
  .grab{display:block}
  #panel{padding:14px 14px calc(18px + env(safe-area-inset-bottom))}
  #popup{position:fixed;left:8px!important;right:8px;top:auto!important;bottom:calc(8px + env(safe-area-inset-bottom));width:auto;max-width:none;max-height:58vh}
  .zoomctl{bottom:8px;right:8px}
}
/* undo bar */
.undo{display:flex;gap:6px;align-items:stretch}
.ubtn{display:flex;flex-direction:column;align-items:flex-start;justify-content:center;padding:4px 12px;min-width:44px;line-height:1.15;font-weight:700}
.ubtn small{font:11px system-ui;color:var(--mute);max-width:170px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-weight:400}
.ubtn.r{align-items:center;font-size:18px}
.ubtn.r b{font:600 11px system-ui;color:var(--mute)}
.ubtn:not(:disabled){border-color:var(--accent)}
#undoBtn:not(:disabled){color:var(--accent)}
#history{position:fixed;z-index:60;left:12px;width:min(380px,calc(100vw - 24px));max-height:60vh;overflow:auto;background:var(--panel);border:1px solid var(--furn-line);border-radius:14px;box-shadow:0 12px 40px #000a;padding:12px;display:none}
#history.show{display:block}
#syncBtn.off{opacity:.65}
#syncBtn.bad b{color:var(--danger)}
#syncBtn.ok b{color:#6fcf97}
.dlgback{position:fixed;inset:0;z-index:90;background:#000a;display:none;align-items:center;justify-content:center;padding:12px}
.dlgback.show{display:flex}
.dlg{background:var(--panel);border:1px solid var(--furn-line);border-radius:14px;box-shadow:0 12px 40px #000a;padding:16px;width:min(460px,100%);max-height:92vh;overflow:auto}
.dlg h3{margin:0 0 6px;font-size:18px}
.dlg p{margin:6px 0;color:var(--mute);font-size:14px}
.dlg .row{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px;align-items:center}
.dlg .x{float:right;padding:2px 9px}
.dlg .err{color:var(--danger)}
.dlg input.code{font-size:26px;letter-spacing:.35em;text-align:center}
.cmp{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin:8px 0}
.cmp>div{border:1px solid var(--line);border-radius:10px;padding:8px;font-size:13px;background:var(--panel2)}
.cmp b{display:block;font-size:14px}
.cmp .new{border-color:var(--accent)}
.cmp .tag{color:var(--accent);font-size:12px;font-weight:700}
.dlg ul{margin:6px 0 0 18px;padding:0;font-size:13px;color:var(--ink)}
#history .hh{display:flex;align-items:center;justify-content:space-between;margin-bottom:4px}
#history .hh b{font:600 16px Georgia,serif}
#history .hrow{display:flex;width:100%;justify-content:space-between;align-items:center;gap:10px;text-align:left;margin:4px 0}
#history .hrow small{color:var(--mute);white-space:nowrap}
@media (max-width:900px){
  header{flex-wrap:wrap;row-gap:6px}
  .prog{order:5;flex-basis:100%;max-width:none;margin-left:0}
  .prog span{display:none}
  .prog .bar{height:6px}
  .ubtn small{max-width:92px}
  .undo{margin-left:auto}
}
#house{position:absolute;inset:0;width:100%;height:100%;display:none;background:#0f1117;border:1px solid var(--line);border-radius:12px;touch-action:none;user-select:none;-webkit-user-select:none}
.hzoom{position:absolute;right:10px;bottom:10px;display:none;flex-direction:column;gap:6px;z-index:5}
.hzoom button{width:40px;height:40px;padding:0;font-size:20px;background:#1b1e27e6}
#stage.hs #house,#stage.hs .hzoom{display:block}
#stage.hs .hzoom{display:flex}
#stage.hs #map,#stage.hs #side,#stage.hs #iso,#stage.hs .zoomctl,#stage.hs #popup,#stage.hs .viewsw{display:none!important}
</style>
</head>
<body>
<header>
  <h1>Room Quest<small>name it · give it a home · clear the fog</small></h1>
  <div class="undo" id="undobar">
    <button id="undoBtn" class="ubtn" title="Undo (Ctrl+Z)" disabled><span>↶ Undo</span><small id="undoLabel">nothing yet</small></button>
    <button id="redoBtn" class="ubtn r" title="Redo (Ctrl+Shift+Z)" aria-label="Redo" disabled>↷</button>
    <button id="histBtn" class="ubtn r" title="Recent changes" aria-label="Recent changes" disabled>🕘<b id="histN"></b></button>
    <button id="syncBtn" class="ubtn r off" title="Sign in to sync" aria-label="Sign in and sync">☁<b id="syncN"></b></button>
  </div>
  <div class="prog"><div class="bar"><i id="bar"></i></div><span id="progtxt"></span></div>
</header>
<main>
  <div id="mapwrap">
    <div id="layoutbar"></div>
    <div id="stage">
      <svg id="map" viewBox="90 140 1720 1240" xmlns="http://www.w3.org/2000/svg">
        <defs>
          <filter id="fog" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="16"/></filter>
          <pattern id="grid" width="120" height="120" patternUnits="userSpaceOnUse"><path d="M120 0H0V120" fill="none" stroke="#1b1f2b" stroke-width="2"/></pattern>
        </defs>
        <rect x="-1500" y="-1500" width="6000" height="6000" fill="url(#grid)" data-t="bg"/>
        <g id="walls" style="pointer-events:none"></g>
        <g id="ghost" style="pointer-events:none"></g>
        <g id="furn"></g>
        <g id="tags" style="pointer-events:none"></g>
        <g id="piles"></g>
        <g id="spots"></g>
        <g id="fx" style="pointer-events:none"></g>
      </svg>
      <svg id="side" xmlns="http://www.w3.org/2000/svg"></svg>
      <svg id="iso" xmlns="http://www.w3.org/2000/svg"></svg>
      <svg id="house" xmlns="http://www.w3.org/2000/svg"></svg>
      <div class="viewsw" id="viewsw"><div class="seg">
        <button data-view="top" class="on">Top</button><button data-view="front">Front</button><button data-view="right">Right</button><button data-view="back">Back</button><button data-view="left">Left</button><button data-view="iso">3D</button>
      </div><div class="isoctl" id="isoctl" hidden><button data-iso="-90" aria-label="Turn left">⟲</button><button data-iso="90" aria-label="Turn right">⟳</button></div><small id="viewcap" hidden></small></div>
      <div class="zoomctl">
        <button data-zoom="in" aria-label="Zoom in">+</button>
        <button data-zoom="out" aria-label="Zoom out">−</button>
        <button data-zoom="fit" aria-label="Fit the room">⤢</button>
      </div>
      <div class="hzoom"><button data-hzoom="in" aria-label="Zoom in">+</button><button data-hzoom="out" aria-label="Zoom out">−</button><button data-hzoom="fit" aria-label="Fit the house">⤢</button></div>
      <div id="popup" role="dialog"></div>
    </div>
  </div>
  <aside id="sheet">
    <div class="grab" id="grab" title="Show or hide the panel"></div>
    <nav id="tabs"></nav>
    <div id="panel"></div>
  </aside>
</main>
<input type="file" id="file" accept=".json,application/json" hidden>
<div id="history" role="dialog" aria-label="Recent changes"></div>
<div class="dlgback" id="syncdlg"><div class="dlg" role="dialog" aria-label="Sync" id="syncbody"></div></div>

<script>
"use strict";
const KEY = "roomquest.v1";
const $ = s => document.querySelector(s);
const uid = () => Math.random().toString(36).slice(2, 9);
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const SVGNS = "http://www.w3.org/2000/svg";
const snap = v => Math.round(v / 10) * 10;
const DAY = 864e5;
const KINDS = {
  vacuum: { label: "Vacuum",      icon: "🧹", color: "#7aa2f7" },
  dust:   { label: "Dust",        icon: "🪶", color: "#e0af68" },
  spray:  { label: "Spray clean", icon: "🧴", color: "#73daca" },
  wipe:   { label: "Wipe",        icon: "🧽", color: "#bb9af7" },
  other:  { label: "Other",       icon: "✨", color: "#c0caf5" },
};
const EVERY = [[0, "Once"], [7, "Weekly"], [14, "Every 2 weeks"], [30, "Monthly"], [90, "Every 3 months"]];

/* ---------- rooms: a shape drawn in inches (1 inch = 10 map units) ---------- */
const OFF = 200;                                   // where the room's top-left corner sits on the map
const inU = v => v * 10 + OFF;                     // room inches -> map units
const outU = v => (v - OFF) / 10;                  // map units -> room inches
const rp = p => ({ x: inU(p.x), y: inU(p.y) });
const hyp = (a, b) => Math.hypot(b.x - a.x, b.y - a.y);
const inch = u => +(u / 10).toFixed(1);
const ftin = u => { const i = Math.round(u / 10 * 2) / 2, ft = Math.floor(i / 12), r = +(i - ft * 12).toFixed(1); return ft ? `${ft}′ ${r}″` : `${r}″`; };
function templatePts(kind, p) {
  const w = p.w || 144, l = p.l || 120;
  if (kind === "L") { const cw = Math.min(p.cw || 48, w - 12), cl = Math.min(p.cl || 48, l - 12); return [[0,0],[w-cw,0],[w-cw,cl],[w,cl],[w,l],[0,l]]; }
  if (kind === "nook") { const nw = p.nw || 60, nd = p.nd || 30, no = Math.min(p.no == null ? 40 : p.no, w - nw); return [[0,nd],[no,nd],[no,0],[no+nw,0],[no+nw,nd],[w,nd],[w,nd+l],[0,nd+l]]; }
  return [[0,0],[w,0],[w,l],[0,l]];
}
function justinFloor() {                       // traced from Justin's SmartDraw sketch (house inches; ~2.5 px per inch); all but his own room are still estimates
  const mk = (name, kind, pts, doors, priv, owner, measured) => ({ id: uid(), name, kind, pts: pts.map(([x, y]) => ({ x, y })), openings: doors.map(o => ({ id: uid(), type: "door", h: 80, sill: 0, ...o })), privacy: priv, owner, measured, ceiling: 96, link: null });
  const hall = mk("Hall", "hall", [[62.0,62.0],[114.0,44.8],[139.2,83.2],[171.2,124.8],[215.2,91.2],[262.8,146.0],[244.8,160.8],[279.2,198.8],[250.0,222.0],[218.0,186.0],[199.2,206.0],[102.0,174.8]], [{"edge":0,"at":2.0,"w":47.0},{"edge":11,"at":26.0,"w":26.5},{"edge":4,"at":8.5,"w":29.0},{"edge":6,"at":9.0,"w":31.0},{"edge":7,"at":9.0,"w":25.5},{"edge":8,"at":13.5,"w":30.0}], "shared", "", false);
  const a = hall.pts[2], b = hall.pts[3]; hall.openings.push({ id: uid(), type: "open", edge: 2, at: 0, w: +Math.hypot(b.x - a.x, b.y - a.y).toFixed(1), h: 96, sill: 0 });   // open to the stairwell
  const rooms = [hall, mk("Bathroom", "bath", [[291.2,108.8],[354.4,108.8],[354.4,125.2],[411.2,125.2],[411.2,170.0],[351.2,170.0],[323.2,196.0],[272.0,148.0],[291.2,128.8]], [{"edge":6,"at":23.5,"w":28.5}], "shared", "", false), mk("Stairs", "stairs", [[152.0,92.8],[188.0,61.2],[210.8,89.6],[174.8,118.8]], [], "shared", "", false),
    mk("Sister's room", "room", [[66.0,200.8],[112.0,217.2],[97.2,254.0],[197.2,288.8],[152.8,411.2],[8.0,358.8]], [{"edge":0,"at":8.5,"w":28.0}], "private", "Sister", false)];
  if (S.room) rooms.unshift({ id: uid(), name: S.room.name, kind: "room", pts: [], openings: [], privacy: "private", owner: "Justin", measured: true, ceiling: S.room.ceiling, link: { x: 241.2, y: 234.0, rot: 0 } });
  return rooms;
}
function justinRoom() {   // measured with a tape: 133 left wall, 155 window wall, 130 right wall, 72 closet wall, 21 stub, 44.5 door wall, 44 angled wall

function fly(from, home) {
  const u = U(), to = homeCenter(home) || { x: from.x, y: from.y - 90 };
  const c = el("circle", { cx: from.x, cy: from.y, r: 16 * u, fill: home ? home.color : "#cdd3e6", stroke: "#0008", "stroke-width": 3 }, $("#fx"));
  const t0 = performance.now(), dur = 700;
  (function step(t) {
    const k = Math.min(1, (t - t0) / dur), e = 1 - Math.pow(1 - k, 3);
    c.setAttribute("cx", from.x + (to.x - from.x) * e); c.setAttribute("cy", from.y + (to.y - from.y) * e);
    c.setAttribute("r", 16 * u * (1 - .6 * e)); c.setAttribute("opacity", 1 - .7 * k * k);
    if (k < 1) requestAnimationFrame(step); else c.remove();
  })(t0);
}
function putAway(id) {
  const it = S.items.find(i => i.id === id); if (!it) return null;
  const pile = S.piles.find(p => p.id === it.pileId), h = homeOf(it.homeId);
  const lay = pile && dotLayout(pile).pos[id];
  if (lay) fly({ x: pile.x + lay.x, y: pile.y + lay.y }, h);
  it.done = true; it.doneAt = Date.now(); S.log.push(id);
  return h;
}
function doAction(spotId, aid) {
  const sp = S.spots.find(x => x.id === spotId), a = sp && sp.actions.find(x => x.id === aid); if (!a) return;
  a.last = Date.now(); if (!a.every) a.done = true;
  flash = actName(a) + " done — " + spotName(sp);
}

      <p><b style="color:var(--ink)">What's different</b></p><ul>${diffLines(L, R).map(x => "<li>" + esc(x) + "</li>").join("")}</ul>
      <div class="row"><button class="primary" data-s="keeplocal">Keep this device's copy</button><button data-s="usecloud">Use the cloud copy</button><button class="small" data-s="later">Decide later</button></div>`;
  } else if (!auth) {
    el.innerHTML = dlgStep === "code"
      ? `${X}<h3>Check your email</h3><p>We sent a 6-digit code to <b style="color:var(--ink)">${esc(dlgEmail)}</b>. Type it here. (On an iPhone or iPad Home Screen app, typing the code is easier than tapping the link.)</p>
         <input class="code" id="sCode" inputmode="numeric" autocomplete="one-time-code" maxlength="8" placeholder="······">${err}
         <div class="row"><button class="primary" data-s="verify" ${dlgBusy ? "disabled" : ""}>Sign in</button><button class="small" data-s="resend">Send a new code</button><button class="small" data-s="back">Different email</button></div>`
      : `${X}<h3>Sign in to sync</h3><p>Your room always stays on this device. Signing in also keeps a copy in the cloud, so your phone, iPad and computer match. No password — we email you a code.</p>
         <input id="sEmail" type="email" inputmode="email" autocomplete="email" placeholder="you@example.com" value="${esc(dlgEmail)}">${err}
         <div class="row"><button class="primary" data-s="send" ${dlgBusy ? "disabled" : ""}>${dlgBusy ? "Sending…" : "Email me a code"}</button></div>`;
  } else {
    const st = { ok: "Everything is saved to the cloud.", busy: "Syncing…", pending: "Changes are waiting to sync.", offline: "Can't reach the cloud right now. Your room is safe on this device and will sync when you're back online.", error: syncMsg || "Something went wrong syncing." }[syncState] || "";
    el.innerHTML = `${X}<h3>Signed in</h3><p><b style="color:var(--ink)">${esc(auth.email || "")}</b></p><p>${st}${meta.syncedAt ? " Last synced " + ago(meta.syncedAt) + "." : ""}</p>
      <div class="row"><button class="primary" data-s="sync">Sync now</button><button data-s="signout">Sign out</button></div><p>Signing out keeps your room on this device.</p>`;
  }
}
$("#syncBtn").addEventListener("click", () => { dlgErr = ""; if (!auth) dlgStep = "email"; openDlg(); });
$("#syncdlg").addEventListener("click", async e => {
  if (e.target.id === "syncdlg") { if (!conflict) closeDlg(); return; }
  const a = e.target.closest("[data-s]"); if (!a) return; const act = a.dataset.s;
  if (act === "close" || act === "later") return closeDlg();
  if (act === "keeplocal") return resolveConflict("local");
  if (act === "usecloud") return resolveConflict("cloud");
  if (act === "sync") { setSync("busy"); renderSyncDlg(); return syncNow(true); }
  if (act === "signout") return signOut();
  if (act === "back") { dlgStep = "email"; dlgErr = ""; return renderSyncDlg(); }
  if (act === "send" || act === "resend") {
    const em = act === "resend" ? dlgEmail : ($("#sEmail").value || "").trim(); if (!/^\S+@\S+\.\S+$/.test(em)) { dlgErr = "That doesn't look like an email address."; return renderSyncDlg(); }
    dlgEmail = em; dlgErr = ""; dlgBusy = true; renderSyncDlg();
    try { await sendCode(em); dlgStep = "code"; } catch (x) { dlgErr = x.message || "Couldn't send the email."; }
    dlgBusy = false; renderSyncDlg(); const c = $("#sCode"); if (c) c.focus(); return;
  }
  if (act === "verify") {
    const code = ($("#sCode").value || "").replace(/\D/g, ""); if (code.length < 6) { dlgErr = "Enter the 6-digit code from the email."; return renderSyncDlg(); }
    dlgBusy = true; dlgErr = ""; renderSyncDlg();
    try { await verifyCode(dlgEmail, code); dlgBusy = false; dlgStep = "email"; return finishSignIn(); } catch (x) { dlgErr = x.message; dlgBusy = false; renderSyncDlg(); }
  }
});
$("#syncdlg").addEventListener("keydown", e => { if (e.key === "Enter") { const b = $("#syncbody [data-s=send],#syncbody [data-s=verify]"); if (b && !b.disabled) b.click(); } });
/* --- when to sync --- */
document.addEventListener("visibilitychange", () => { if (document.visibilityState === "visible") syncNow(); else if (auth && dirty()) syncNow(); });
window.addEventListener("online", () => syncNow()); window.addEventListener("focus", () => syncNow());
setInterval(() => { if (document.visibilityState === "visible") syncNow(); }, 60000);
(async function startSync() {
  const h = location.hash;                                                        // came back from the email link?
  if (/access_token=/.test(h)) {
    const p = new URLSearchParams(h.slice(1)); history.replaceState(null, "", location.pathname + location.search);
    try { keepSession({ access_token: p.get("access_token"), refresh_token: p.get("refresh_token"), expires_in: +p.get("expires_in") || 3600 });
      const u = await sb("/auth/v1/user"); if (u.ok && u.json) keepSession({ access_token: auth.access_token, user: u.json }); finishSignIn(); return; } catch (e) {}
  } else if (/error_description=/.test(h)) { const p = new URLSearchParams(h.slice(1)); history.replaceState(null, "", location.pathname + location.search); dlgErr = (p.get("error_description") || "That link didn't work.").replace(/\+/g, " ") + " Ask for a new code instead."; openDlg(); }
  setSync(auth ? "busy" : "off"); if (auth) syncNow();
})();

fitView(); render(); renderUndo();
</script>
</body>
</html>
