<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#1b1e27">
<title>Room Quest</title>
<style>
:root{
  --bg:#13151b; --panel:#1b1e27; --panel2:#242836; --line:#323850; --ink:#ebe7de; --mute:#98a0b3;
  --accent:#f2b84b; --danger:#e5707e; --furn:#262b39; --furn-line:#5b6482;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%;margin:0;overscroll-behavior:none}
body{height:100vh;height:100dvh;background:var(--bg);color:var(--ink);font:15px/1.45 system-ui,-apple-system,"Segoe UI",sans-serif;display:flex;flex-direction:column;-webkit-text-size-adjust:100%}
header{display:flex;align-items:center;gap:20px;padding:10px 18px;border-bottom:1px solid var(--line);background:var(--panel);padding-top:max(10px,env(safe-area-inset-top))}
header h1{font:600 20px Georgia,"Times New Roman",serif;margin:0;letter-spacing:.02em}
header h1 small{display:block;font:12px system-ui;color:var(--mute);letter-spacing:0}
.prog{flex:1;max-width:420px;margin-left:auto}
.prog .bar{height:10px;border-radius:6px;background:var(--panel2);overflow:hidden;border:1px solid var(--line)}
.prog .bar i{display:block;height:100%;background:linear-gradient(90deg,#6fcf97,#f2b84b);width:0;transition:width .5s}
.prog span{font-size:12px;color:var(--mute)}
main{flex:1;display:flex;min-height:0}
#mapwrap{flex:1;min-width:0;padding:12px;display:flex;flex-direction:column;gap:10px}
#stage{position:relative;flex:1;min-height:0}
#map{position:absolute;inset:0;width:100%;height:100%;background:#0f1117;border:1px solid var(--line);border-radius:12px;touch-action:none;user-select:none;-webkit-user-select:none}
.zoomctl{position:absolute;right:10px;bottom:10px;display:flex;flex-direction:column;gap:6px;z-index:5}
.zoomctl button{width:40px;height:40px;padding:0;font-size:20px;background:#1b1e27e6}
aside{width:390px;max-width:44vw;border-left:1px solid var(--line);background:var(--panel);display:flex;flex-direction:column;min-height:0}
.grab{display:none;height:24px;cursor:pointer;flex:none}
.grab::after{content:"";display:block;width:44px;height:5px;border-radius:3px;background:var(--furn-line);margin:10px auto 0}
nav{display:flex;border-bottom:1px solid var(--line)}
nav button{flex:1;background:none;border:0;border-radius:0;color:var(--mute);padding:12px 2px;font:600 13px system-ui;cursor:pointer;border-bottom:3px solid transparent}
nav button.on{color:var(--ink);border-bottom-color:var(--accent)}
#panel{flex:1;overflow:auto;padding:16px;overscroll-behavior:contain;-webkit-overflow-scrolling:touch}
h2{font:600 18px Georgia,serif;margin:0 0 6px}
.hint{color:var(--mute);margin:0 0 12px;font-size:14px}
.dim{opacity:.7}
button,select,input,textarea{font:inherit;color:var(--ink)}
button{background:var(--panel2);border:1px solid var(--line);border-radius:8px;padding:8px 12px;cursor:pointer;touch-action:manipulation}
button:hover{border-color:var(--furn-line)}
button:disabled{opacity:.4;cursor:not-allowed}
button.primary{background:var(--accent);color:#1a1405;border-color:var(--accent);font-weight:600}
button.danger{color:var(--danger)}
button.small{padding:3px 8px;font-size:13px}
input,select,textarea{font-size:16px;background:#12141b;border:1px solid var(--line);border-radius:8px;padding:7px 9px;width:100%}
textarea{min-height:130px;resize:vertical}
textarea.short{min-height:80px}
label{display:block;font-size:13px;color:var(--mute);margin:8px 0}
label input,label select{margin-top:3px;color:var(--ink)}
.row{display:flex;gap:8px;flex-wrap:wrap;margin:8px 0}
.two{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.card{background:var(--panel2);border:1px solid var(--line);border-radius:12px;padding:12px;margin:12px 0}
.chk{display:flex;gap:8px;align-items:center;color:var(--ink)}
.chk input{width:auto;margin:0}
.list{display:flex;flex-direction:column;gap:6px;margin:8px 0}
.item{display:flex;gap:6px;align-items:center}
.item input[type=text]{flex:1}
.item select{width:120px}
.item .nm2{flex:1}
.sw{width:14px;height:14px;border-radius:50%;flex:none;border:1px solid #0006}
input[type=color]{width:38px;height:34px;padding:2px;flex:none}
.chip{display:inline-flex;gap:8px;align-items:center;padding:8px 12px;border-radius:999px;border:2px solid var(--line);background:var(--panel2);cursor:pointer;font-weight:600}
.chip.on{border-color:var(--ink)}
.chip b{font-weight:700;opacity:.8}
.big{font:600 28px Georgia,serif;margin:6px 0 2px;line-height:1.2}
.homes{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin:12px 0}
.homes button{padding:14px 8px;font-weight:700;border:0;color:#10121a;font-size:15px}
.homes button.idk{grid-column:1/-1;color:var(--ink);background:#3a3f4d}
.cleanrow{display:flex;align-items:center;gap:10px;padding:10px;border-radius:10px;background:var(--panel2);border:1px solid var(--line)}
.cleanrow .nm{flex:1;min-width:0}
.cleanrow .nm small{display:block;color:var(--mute)}
.cleanrow button{padding:8px 14px;font-weight:700}
.foot{margin-top:22px;padding-top:12px;border-top:1px solid var(--line);font-size:12px;color:var(--mute)}
.pulse{animation:pulse 1.2s ease-in-out infinite}
@keyframes pulse{50%{opacity:.45}}
.good{color:#6fcf97}
#layoutbar{display:flex;gap:12px;align-items:center;flex-wrap:wrap}
.lays{display:flex;gap:6px;align-items:center;flex-wrap:wrap}
.lay{padding:7px 14px;font-weight:600}
.lay.on{background:var(--accent);color:#1a1405;border-color:var(--accent)}
kbd{font:600 11px system-ui;opacity:.6;border:1px solid currentColor;border-radius:4px;padding:0 4px}
.laytools{display:flex;gap:12px;align-items:center;flex-wrap:wrap;margin-left:auto}
.laytools input[type=text]{width:160px}
.laytools .chk{margin:0}
details.inside{margin:6px 0 0}
details.inside summary{cursor:pointer;color:var(--mute);font-size:13px}
.act{display:grid;grid-template-columns:auto 1fr auto;gap:6px 8px;align-items:center;padding:8px 0;border-top:1px solid var(--line)}
.act .ic{font-size:20px}
.act .nm small{display:block;color:var(--mute);font-size:12px}
.act .ctl{grid-column:1/-1;display:flex;gap:8px;align-items:center}
.act .ctl select{flex:1}
.done-txt{text-decoration:line-through;opacity:.6}
/* floating menu for a pile or a spot */
#popup{position:absolute;z-index:20;width:330px;max-width:calc(100% - 16px);max-height:78%;overflow:auto;background:var(--panel);border:1px solid var(--furn-line);border-radius:14px;box-shadow:0 12px 40px #000a;padding:12px;display:none}
#popup.show{display:block}
.pm-head{display:flex;align-items:center;gap:8px;margin-bottom:6px}
.pm-head b{flex:1;font:600 17px Georgia,serif;min-width:0;overflow-wrap:anywhere}
.pm-item{display:grid;grid-template-columns:auto 1fr;gap:6px 8px;align-items:center;padding:9px 0;border-top:1px solid var(--line)}
.pm-item .ctl{grid-column:1/-1;display:flex;gap:8px}
.pm-item .ctl select{flex:1;min-width:0}
.pm-item .ctl button{font-weight:700}
.pm-note{white-space:pre-wrap;color:var(--mute);font-size:14px;margin:0 0 8px}
@media (pointer:coarse){
  button,select,input:not([type=checkbox]):not([type=color]){min-height:44px}
  button.small{min-height:38px;padding:6px 12px}
  nav button{padding:14px 2px}
  .chk input{width:22px;height:22px}
  input[type=color]{width:46px}
}
@media (max-width:900px){
  header{padding:8px 12px;gap:10px;padding-top:max(8px,env(safe-area-inset-top))}
  header h1{font-size:17px}
  header h1 small{display:none}
  main{flex-direction:column}
  #mapwrap{padding:8px;gap:8px}
  .lays{flex-wrap:nowrap;overflow-x:auto;max-width:100%;padding-bottom:2px}
  .lay{white-space:nowrap}
  .laytools{margin-left:0}
  .laytools input[type=text]{width:130px}
  #moved{display:none}
  aside{width:auto;max-width:none;height:46vh;height:46dvh;border-left:0;border-top:1px solid var(--line);border-radius:16px 16px 0 0;box-shadow:0 -6px 20px #0008}
  aside.collapsed{height:auto}
  aside.collapsed #panel{display:none}
  .grab{display:block}
  #panel{padding:14px 14px calc(18px + env(safe-area-inset-bottom))}
  #popup{position:fixed;left:8px!important;right:8px;top:auto!important;bottom:calc(8px + env(safe-area-inset-bottom));width:auto;max-width:none;max-height:58vh}
  .zoomctl{bottom:8px;right:8px}
}
</style>
</head>
<body>
<header>
  <h1>Room Quest<small>name it · give it a home · clear the fog</small></h1>
  <div class="prog"><div class="bar"><i id="bar"></i></div><span id="progtxt"></span></div>
</header>
<main>
  <div id="mapwrap">
    <div id="layoutbar"></div>
    <div id="stage">
      <svg id="map" viewBox="90 140 1720 1240" xmlns="http://www.w3.org/2000/svg">
        <defs>
          <filter id="fog" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="16"/></filter>
          <pattern id="grid" width="50" height="50" patternUnits="userSpaceOnUse"><path d="M50 0H0V50" fill="none" stroke="#1b1f2b" stroke-width="2"/></pattern>
        </defs>
        <rect x="-1500" y="-1500" width="6000" height="6000" fill="url(#grid)" data-t="bg"/>
        <image id="sketch" href="sketch.png" x="0" y="0" width="2208" height="1656" opacity=".2" style="pointer-events:none"/>
        <g id="walls" style="pointer-events:none"></g>
        <g id="ghost" style="pointer-events:none"></g>
        <g id="furn"></g>
        <g id="tags" style="pointer-events:none"></g>
        <g id="piles"></g>
        <g id="spots"></g>
        <g id="fx" style="pointer-events:none"></g>
      </svg>
      <div class="zoomctl">
        <button data-zoom="in" aria-label="Zoom in">+</button>
        <button data-zoom="out" aria-label="Zoom out">−</button>
        <button data-zoom="fit" aria-label="Fit the room">⤢</button>
      </div>
      <div id="popup" role="dialog"></div>
    </div>
  </div>
  <aside id="sheet">
    <div class="grab" id="grab" title="Show or hide the panel"></div>
    <nav id="tabs"></nav>
    <div id="panel"></div>
  </aside>
</main>
<input type="file" id="file" accept=".json,application/json" hidden>

<script>
"use strict";
const KEY = "roomquest.v1";
const $ = s => document.querySelector(s);
const uid = () => Math.random().toString(36).slice(2, 9);
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const SVGNS = "http://www.w3.org/2000/svg";
const snap = v => Math.round(v / 10) * 10;
const DAY = 864e5;
const KINDS = {
  vacuum: { label: "Vacuum",      icon: "🧹", color: "#7aa2f7" },
  dust:   { label: "Dust",        icon: "🪶", color: "#e0af68" },
  spray:  { label: "Spray clean", icon: "🧴", color: "#73daca" },
  wipe:   { label: "Wipe",        icon: "🧽", color: "#bb9af7" },
  other:  { label: "Other",       icon: "✨", color: "#c0caf5" },
};
const EVERY = [[0, "Once"], [7, "Weekly"], [14, "Every 2 weeks"], [30, "Monthly"], [90, "Every 3 months"]];

/* ---------- starting data, traced from the sketch ---------- */
function defaults() {
  const F = (name, x, y, w, h, shape = "rect", kind = "furn") => ({ id: uid(), name, x, y, w, h, shape, kind, type: "furniture", rot: 0, face: 0, locked: false });
  const furniture = [
    F("Lofted bed", 690, 615, 940, 515, "rect", "loft"),
    F("Closet", 990, 200, 700, 270, "rect", "closet"),
    F("Desk + computer", 820, 570, 500, 250),
    F("Bean bag", 790, 870, 340, 340, "ellipse"),
    F("Cabinet?", 1380, 860, 240, 270),
    F("Top-right shelf?", 1430, 470, 290, 130),
    F("Corner stack?", 1400, 1150, 340, 180),
    F("Table?", 480, 605, 150, 215),
    F("Left wall A", 150, 530, 120, 180),
    F("Left wall B", 175, 730, 95, 95, "ellipse"),
    F("Left wall C", 170, 835, 100, 75),
    F("Left wall D", 160, 930, 90, 190),
    F("Left wall E", 175, 1170, 90, 130, "ellipse"),
    F("Window", 530, 1295, 440, 30, "rect", "window"),
  ];
  [[715,655],[1585,625],[715,1125],[1620,1110],[1165,870]].forEach((p, i) =>
    furniture.push(F("Post " + (i + 1), p[0] - 36, p[1] - 36, 72, 72, "ellipse", "post")));
  const byName = n => furniture.find(f => f.name === n).id;
  const homes = [
    { id: "closet", name: "Closet", color: "#5b9cf6", furnId: byName("Closet") },
    { id: "desk",   name: "Desk",   color: "#6fcf97", furnId: byName("Desk + computer") },
    { id: "shelf",  name: "Shelf",  color: "#b58cf0", furnId: null },
    { id: "donate", name: "Donate", color: "#f2b84b", furnId: null },
    { id: "trash",  name: "Trash",  color: "#e5707e", furnId: null },
    { id: "idk",    name: "Not sure yet", color: "#8a8f9c", furnId: null, special: true },
  ];
  return { furniture, homes, piles: [], items: [], spots: [], log: [], showSketch: true };
}
let S = (() => { try { const r = localStorage.getItem(KEY); if (r) return JSON.parse(r); } catch (e) {} return defaults(); })();
function syncLayout() { const L = S.layouts && S.layouts.find(l => l.id === S.layoutId); if (L) L.furniture = S.furniture; }
function save() { syncLayout(); try { const c = { ...S }; delete c.furniture; localStorage.setItem(KEY, JSON.stringify(c)); } catch (e) {} }
function migrate() {
  if (!S.layouts) { S.layouts = [{ id: uid(), name: "Current room", furniture: S.furniture }]; S.layoutId = S.layouts[0].id; }
  const L = S.layouts.find(l => l.id === S.layoutId) || S.layouts[0]; S.layoutId = L.id; S.furniture = L.furniture;
  S.layouts.forEach(l => l.furniture.forEach(f => { if (f.type == null) f.type = "furniture"; if (f.rot == null) f.rot = 0; if (f.face == null) f.face = 0; if (f.locked == null) f.locked = false; }));
  if (!S.spots) S.spots = [];
  S.spots.forEach(sp => { if (!sp.actions) sp.actions = []; if (sp.note == null) sp.note = ""; if (sp.title == null) sp.title = ""; });
}
migrate();
const PALETTE = ["#5b9cf6","#6fcf97","#b58cf0","#f2b84b","#e5707e","#4dd0c8","#f08a4b","#d36fd0","#a3d65c","#6fa8dc"];
const nextColor = () => PALETTE.find(c => !S.homes.some(h => h.color.toLowerCase() === c)) || PALETTE[Math.floor(Math.random() * PALETTE.length)];

/* ---------- UI state ---------- */
let mode = "layout";            // layout | piles | spots | sort | clean
let sel = null;                 // {type:'furn'|'pile'|'spot', id}
let placing = false;            // next map tap drops a new pile
let placingSpot = false;        // next map tap drops a new spot
let revisit = false;
let skips = {};
let cleanHome = null;
let cleanKind = null;
let flash = "";
let menu = null;                // {type:'pile'|'spot', id}  the floating menu
let sketchOK = true;

const homeOf = id => S.homes.find(h => h.id === id);
const pending = () => S.items.filter(i => !i.done);
const actOpen = a => { if (a.done) return false; if (!a.every || !a.last) return true; return Date.now() - a.last >= a.every * DAY; };
const actName = a => a.label || (KINDS[a.kind] || KINDS.other).label;
const kindOf = a => KINDS[a.kind] || KINDS.other;
const agoTxt = t => { const d = Math.floor((Date.now() - t) / DAY); return d <= 0 ? "today" : d === 1 ? "yesterday" : d + " days ago"; };
function actText(a) {
  if (a.done) return "done " + agoTxt(a.last);
  if (!a.last) return a.every ? "not done yet · repeats" : "to do";
  if (actOpen(a)) return "due again · last done " + agoTxt(a.last);
  return "done " + agoTxt(a.last) + " · due in " + Math.ceil((a.last + a.every * DAY - Date.now()) / DAY) + "d";
}
const spotName = sp => sp.title || "Untitled spot";

/* the probe tells us if the optional sketch backdrop exists (it won't on a shared site) */
(() => { const p = new Image(); p.onerror = () => { sketchOK = false; try { render(); } catch (e) {} }; p.src = "sketch.png"; })();

/* ---------- map + view ---------- */
const svg = $("#map"), stage = $("#stage");
const el = (tag, attrs = {}, parent) => { const n = document.createElementNS(SVGNS, tag); for (const k in attrs) n.setAttribute(k, attrs[k]); if (parent) parent.appendChild(n); return n; };
const BASE = { cx: 950, cy: 750, w: 1720, h: 1240 };
let view = { x: 90, y: 140, w: 1720, h: 1240 };
let touched = false;           // true once the person zooms or pans; until then we keep re-fitting the room
const stageRect = () => stage.getBoundingClientRect();
const scale = () => { const w = stage.clientWidth; return w ? w / view.w : .57; };
const U = () => Math.max(1, .5 / scale());          // markers grow on small screens so they stay tappable
function applyView() {
  const r = stageRect(); if (r.width) view.h = view.w * r.height / r.width;
  view.w = Math.min(3200, Math.max(260, view.w)); if (r.width) view.h = view.w * r.height / r.width;
  const cx = Math.min(2100, Math.max(-100, view.x + view.w / 2)), cy = Math.min(1800, Math.max(-100, view.y + view.h / 2));
  view.x = cx - view.w / 2; view.y = cy - view.h / 2;
  svg.setAttribute("viewBox", `${view.x} ${view.y} ${view.w} ${view.h}`);
}
function fitView() {
  const r = stageRect(); if (!r.width) return;
  const ar = r.height / r.width, w = Math.max(BASE.w, BASE.h / ar);
  view = { w, h: w * ar, x: BASE.cx - w / 2, y: BASE.cy - w * ar / 2 }; touched = false; applyView();
}
function zoomAt(f, px, py) {
  const r = stageRect(); if (!r.width) return;
  const sx = view.x + (px - r.left) * view.w / r.width, sy = view.y + (py - r.top) * view.h / r.height;
  touched = true;
  const nw = Math.min(3200, Math.max(260, view.w / f)), k = nw / view.w;
  view.x = sx - (sx - view.x) * k; view.y = sy - (sy - view.y) * k; view.w = nw;
  applyView(); renderMap();
}
stage.addEventListener("wheel", e => { e.preventDefault(); zoomAt(Math.exp(-e.deltaY * (e.ctrlKey ? .01 : .0015)), e.clientX, e.clientY); }, { passive: false });
document.querySelector(".zoomctl").addEventListener("click", e => {
  const b = e.target.closest("[data-zoom]"); if (!b) return; const r = stageRect(), z = b.dataset.zoom;
  if (z === "fit") { fitView(); renderMap(); } else zoomAt(z === "in" ? 1.4 : 1 / 1.4, r.left + r.width / 2, r.top + r.height / 2);
});
new ResizeObserver(() => { if (!touched) fitView(); else applyView(); renderMap(); }).observe(stage);

function drawWalls() {
  const g = $("#walls"); g.innerHTML = "";
  const L = (x1, y1, x2, y2, c = "#7d86a6", w = 10) => el("line", { x1, y1, x2, y2, stroke: c, "stroke-width": w, "stroke-linecap": "round" }, g);
  L(140,190,1740,190); L(1740,190,1740,1310); L(1740,1310,140,1310); L(140,1310,140,190);
  L(140,480,340,480); L(830,480,990,480); L(990,190,990,480);
  L(350,470,540,215,"#d9625a",14);
  el("line", { x1:540, y1:215, x2:910, y2:470, stroke:"#d9625a", "stroke-width":4, "stroke-dasharray":"14 12", opacity:.6 }, g);
  const n = el("text", { x: 190, y: 330, fill: "#d9625a", "font-size": 40, "font-family": "Georgia,serif", opacity: .85, id: "doorlabel" }, g); n.textContent = "door";
}

function dotLayout(pile) {
  const u = U(), items = S.items.filter(i => i.pileId === pile.id && !i.done);
  const pos = {}; let ring = 0, placed = 0;
  while (placed < items.length) {
    const R = (52 + ring * 32) * u, cap = Math.max(6, Math.floor(2 * Math.PI * R / (30 * u)));
    const n = Math.min(cap, items.length - placed);
    for (let k = 0; k < n; k++) {
      const a = -Math.PI / 2 + (2 * Math.PI * k) / n + ring * .4;
      pos[items[placed + k].id] = { x: R * Math.cos(a), y: R * Math.sin(a) };
    }
    placed += n; ring++;
  }
  return { pos, outer: items.length ? (52 + (ring - 1) * 32 + 26) * u : 50 * u, items };
}
const hash = s => { let h = 0; for (const c of s) h = (h * 31 + c.charCodeAt(0)) | 0; return Math.abs(h); };
function homeCenter(h) {
  const f = h && S.furniture.find(x => x.id === h.furnId);
  return f ? { x: f.x + f.w / 2, y: f.y + f.h / 2 } : null;
}
function rotPt(f, x, y) {
  const r = (f.rot || 0) * Math.PI / 180, cx = f.x + f.w / 2, cy = f.y + f.h / 2;
  return { x: cx + x * Math.cos(r) - y * Math.sin(r), y: cy + x * Math.sin(r) + y * Math.cos(r) };
}
function spotPos(sp) {
  const f = sp.furnId && S.furniture.find(x => x.id === sp.furnId);
  return f ? rotPt(f, sp.dx || 0, sp.dy || 0) : { x: sp.x, y: sp.y };
}
function attachSpot(sp) {     // a spot dropped on a piece sticks to it and follows it around
  sp.furnId = null;
  for (let i = S.furniture.length - 1; i >= 0; i--) {

function fly(from, home) {
  const u = U(), to = homeCenter(home) || { x: from.x, y: from.y - 90 };
  const c = el("circle", { cx: from.x, cy: from.y, r: 16 * u, fill: home ? home.color : "#cdd3e6", stroke: "#0008", "stroke-width": 3 }, $("#fx"));
  const t0 = performance.now(), dur = 700;
  (function step(t) {
    const k = Math.min(1, (t - t0) / dur), e = 1 - Math.pow(1 - k, 3);
    c.setAttribute("cx", from.x + (to.x - from.x) * e); c.setAttribute("cy", from.y + (to.y - from.y) * e);
    c.setAttribute("r", 16 * u * (1 - .6 * e)); c.setAttribute("opacity", 1 - .7 * k * k);
    if (k < 1) requestAnimationFrame(step); else c.remove();
  })(t0);
}
function putAway(id) {
  const it = S.items.find(i => i.id === id); if (!it) return null;
  const pile = S.piles.find(p => p.id === it.pileId), h = homeOf(it.homeId);
  const lay = pile && dotLayout(pile).pos[id];
  if (lay) fly({ x: pile.x + lay.x, y: pile.y + lay.y }, h);
  it.done = true; it.doneAt = Date.now(); S.log.push(id);
  return h;
}
function doAction(spotId, aid) {
  const sp = S.spots.find(x => x.id === spotId), a = sp && sp.actions.find(x => x.id === aid); if (!a) return;
  a.last = Date.now(); if (!a.every) a.done = true;
  flash = actName(a) + " done — " + spotName(sp);
}

  if (act === "home") { const cur = sortQueue()[0]; if (cur) { cur.homeId = id; delete skips[cur.id]; } const nx = sortQueue()[0]; sel = nx ? { type: "pile", id: nx.pileId } : sel; }
  if (act === "skip") { const cur = sortQueue()[0]; if (cur) skips[cur.id] = (skips[cur.id] || 0) + 1; const nx = sortQueue()[0]; if (nx) sel = { type: "pile", id: nx.pileId }; }
  if (act === "revisit") { revisit = true; S.items.forEach(i => { if (i.homeId === "idk") i.homeId = null; }); revisit = false; const nx = sortQueue()[0]; if (nx) sel = { type: "pile", id: nx.pileId }; }
  if (act === "trip") { cleanHome = cleanHome === id ? null : id; cleanKind = null; flash = ""; }
  if (act === "done") {
    const h = putAway(id);
    flash = h && !pending().some(i => i.homeId === h.id) ? h.name + " trip cleared!" : "";
  }
  if (act === "takeout") { const it = S.items.find(i => i.id === id); if (it) { it.done = false; S.log = S.log.filter(x => x !== id); } flash = ""; }
  if (act === "undo") { const last = S.log.pop(); const it = S.items.find(i => i.id === last); if (it) it.done = false; flash = ""; }
  save(); render();
  if (act === "unpack") { const d = $("#dump"); if (d) d.focus(); }
  if (act === "aaddcustom") focusId("acustom");
});
$("#panel").addEventListener("input", e => {
  const f = e.target.dataset.f, id = e.target.dataset.id, v = e.target.value;
  const fu = sel && sel.type === "furn" && S.furniture.find(x => x.id === sel.id);
  const pl = sel && sel.type === "pile" && S.piles.find(x => x.id === sel.id);
  const sp = sel && sel.type === "spot" && S.spots.find(x => x.id === sel.id);
  if (f === "fname" && fu) { fu.name = v; S.homes.forEach(h => { if (h.furnId === fu.id) { h.name = v; document.querySelectorAll('[data-f=hname]').forEach(n => { if (n.dataset.id === h.id) n.value = v; }); } }); }
  else if (f === "fw" && fu) { const c = fu.x + fu.w / 2; fu.w = Math.max(30, +v || 30); fu.x = c - fu.w / 2; }
  else if (f === "fh" && fu) { const c = fu.y + fu.h / 2; fu.h = Math.max(30, +v || 30); fu.y = c - fu.h / 2; }
  else if (f === "frot" && fu) fu.rot = (((+v || 0) % 360) + 360) % 360;
  else if (f === "pname" && pl) pl.name = v;
  else if (f === "lname") { const cur = S.layouts.find(l => l.id === S.layoutId); if (cur) { cur.name = v; const n = document.querySelector(".lay.on .nm"); if (n) n.textContent = v; } }
  else if (f === "stitle" && sp) sp.title = v;
  else if (f === "snote" && sp) sp.note = v;
  else if (f === "iname") { const it = S.items.find(i => i.id === id); if (it) it.name = v; }
  else if (f === "hname") { const h = homeOf(id); if (h) h.name = v; }
  else if (f === "hcolor") { const h = homeOf(id); if (h) h.color = v; }
  else return;
  save(); renderMap(); if (menu) renderMenu();
});
$("#panel").addEventListener("change", e => {
  const f = e.target.dataset.f, id = e.target.dataset.id, v = e.target.value;
  const sp = sel && sel.type === "spot" && S.spots.find(x => x.id === sel.id);
  if (f === "sketch") S.showSketch = e.target.checked;
  else if (f === "fshape") S.furniture.find(x => x.id === sel.id).shape = v;
  else if (f === "ftype") S.furniture.find(x => x.id === sel.id).type = v;
  else if (f === "flock") S.furniture.find(x => x.id === sel.id).locked = e.target.checked;
  else if (f === "ihome") { const it = S.items.find(i => i.id === id); it.homeId = v || null; }
  else if (f === "hfurn") homeOf(id).furnId = v || null;
  else if (f === "aevery" && sp) { const a = sp.actions.find(x => x.id === id); if (a) { a.every = +v; if (a.every) a.done = false; } }
  else return;
  save(); render();
});

/* ---------- layouts ---------- */
const otherLayout = () => S.layouts.find(l => l.id === S.prevId && l.id !== S.layoutId) || S.layouts.find(l => l.id !== S.layoutId);
const sameSpot = (a, b) => a.x === b.x && a.y === b.y && a.w === b.w && a.h === b.h && (a.rot || 0) === (b.rot || 0);
function renderGhost(u = 1) {
  const g = $("#ghost"); g.innerHTML = ""; let moved = 0; const o = otherLayout();
  if (o) o.furniture.forEach(of => {
    if (of.kind === "post" || of.kind === "window") return;
    const cur = S.furniture.find(f => f.id === of.id);
    if (cur && sameSpot(cur, of)) return;
    moved++;
    if (!S.ghost) return;
    const cx = of.x + of.w / 2, cy = of.y + of.h / 2;
    const og = el("g", { transform: `translate(${cx} ${cy}) rotate(${of.rot || 0})`, opacity: .75 }, g);
    const st = { fill: "#f2b84b", "fill-opacity": .07, stroke: "#f2b84b", "stroke-width": 3, "stroke-dasharray": "8 8" };
    if (of.shape === "ellipse") el("ellipse", { rx: of.w / 2, ry: of.h / 2, ...st }, og);
    else el("rect", { x: -of.w / 2, y: -of.h / 2, width: of.w, height: of.h, rx: 10, ...st }, og);
    if (cur) el("line", { x1: cx, y1: cy, x2: cur.x + cur.w / 2, y2: cur.y + cur.h / 2, stroke: "#f2b84b", "stroke-width": 3, opacity: .5, "stroke-dasharray": "2 9", "stroke-linecap": "round" }, g);
    const t = el("text", { x: cx, y: cy + 8, "text-anchor": "middle", fill: "#f2b84b", "font-size": 24 * Math.min(u, 1.6), opacity: .7 }, g); t.textContent = of.name;
  });
  const m = $("#moved"); if (m) m.textContent = o ? `${moved} piece${moved === 1 ? "" : "s"} sit differently than in “${o.name}”` : "";
}
function renderBar() {
  const L = S.layouts, o = otherLayout();
  $("#layoutbar").innerHTML = `<div class="lays">${L.map((l, i) => `<button class="lay ${l.id === S.layoutId ? "on" : ""}" data-lay="${l.id}"><kbd>${i + 1}</kbd> <span class="nm">${esc(l.name)}</span></button>`).join("")}
    <button class="small" data-lay-act="new" title="Copy this layout so you can try changes">+ New layout</button></div>
    <div class="laytools">${o ? `<label class="chk"><input type="checkbox" id="ghostchk" ${S.ghost ? "checked" : ""}> Ghost of “${esc(o.name)}” <kbd>G</kbd></label>` : ""}
    <span id="moved" class="hint" style="margin:0"></span></div>`;
}
function switchLayout(id) {
  const l = S.layouts.find(x => x.id === id); if (!l || id === S.layoutId) return;
  syncLayout(); S.prevId = S.layoutId; S.layoutId = id; S.furniture = l.furniture; sel = null; drag = null; save(); render();
}
let layDelArmed = false;
$("#layoutbar").addEventListener("click", e => {
  const lb = e.target.closest("[data-lay]"); if (lb) return switchLayout(lb.dataset.lay);
  const a = e.target.closest("[data-lay-act]"); if (!a) return;
  if (a.dataset.layAct === "new") {
    syncLayout();
    const nl = { id: uid(), name: "Layout " + (S.layouts.length + 1), furniture: JSON.parse(JSON.stringify(S.furniture)) };
    S.layouts.push(nl); switchLayout(nl.id); S.ghost = true; mode = "layout"; save(); render(); focusId("lname");
  }
});
$("#layoutbar").addEventListener("change", e => {
  if (e.target.id === "ghostchk") { S.ghost = e.target.checked; save(); e.target.blur(); renderMap(); }
});
document.addEventListener("keydown", e => {
  if (e.key === "Escape" && menu) { menu = null; renderMenu(); return; }
  if (e.target.matches && e.target.matches("input,textarea,select") || e.ctrlKey || e.metaKey || e.altKey) return;
  const n = +e.key; if (n >= 1 && n <= S.layouts.length) switchLayout(S.layouts[n - 1].id);
  if (e.key === "g" || e.key === "G") { if (otherLayout()) { S.ghost = !S.ghost; save(); render(); } }
});

/* ---------- backup / reset ---------- */
let resetArmed = false;
$("#panel").addEventListener("click", e => {
  const b = e.target.closest("[data-foot]"); if (!b) return; const a = b.dataset.foot;
  if (a === "export") {
    syncLayout();
    const link = document.createElement("a");
    link.href = URL.createObjectURL(new Blob([JSON.stringify(S, null, 2)], { type: "application/json" }));
    link.download = "room-quest-backup.json"; link.click();
  }
  if (a === "import") $("#file").click();
  if (a === "reset") {
    if (!resetArmed) { resetArmed = true; b.textContent = "Really start over?"; setTimeout(() => { resetArmed = false; const r = $("#resetbtn"); if (r) r.textContent = "Start over"; }, 4000); return; }
    S = defaults(); migrate(); sel = null; menu = null; cleanHome = null; cleanKind = null; save(); resetArmed = false; render(); fitView(); renderMap();
  }
});
$("#file").addEventListener("change", e => {
  const f = e.target.files[0]; if (!f) return;
  f.text().then(t => { try { S = JSON.parse(t); migrate(); save(); sel = null; menu = null; render(); } catch (err) { alert("That file didn't look like a backup."); } });
  e.target.value = "";
});

drawWalls(); fitView(); render();
</script>
</body>
</html>
