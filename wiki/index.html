<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  :root {
    --green:   rgb(144,171,153);
    --green2:  rgb(110,135,118);
    --green3:  rgb(80,105,90);
    --brown:   rgb(43,28,16);
    --brown2:  rgb(60,42,26);
    --brown3:  rgb(80,58,36);
    --purple:  rgb(76,46,87);
    --purple2: rgb(100,65,112);
    --ink:     rgb(28,23,24);
    --parchment: rgb(220,210,190);
    --parchment2: rgb(200,188,168);
    --dim: rgb(120,100,80);
    --mono: 'Courier New', Courier, monospace;
    --serif: Georgia, 'Times New Roman', serif;
  }
  html, body { height: 100%; }
  body {
    background: var(--brown);
    color: var(--parchment);
    font-family: var(--serif);
    font-size: 14px;
    display: flex;
    flex-direction: column;
    min-height: 100vh;
  }

  /* ── Header ── */
  header {
    background: var(--brown2);
    border-bottom: 2px solid var(--purple);
    padding: 12px 20px;
    display: flex;
    align-items: center;
    gap: 16px;
    flex-shrink: 0;
  }
  .logo-wrap {
    display: flex;
    align-items: center;
    gap: 12px;
  }
  .logo-img {
    width: 48px;
    height: 48px;
    border-radius: 50%;
    border: 1.5px solid var(--purple);
    object-fit: cover;
    background: var(--brown3);
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 22px;
    flex-shrink: 0;
  }
  .logo-text {
    font-size: 20px;
    letter-spacing: 0.12em;
    color: var(--green);
    font-family: var(--serif);
    font-weight: normal;
  }
  .logo-sub {
    font-size: 11px;
    color: var(--dim);
    letter-spacing: 0.08em;
    font-family: var(--mono);
  }
  .header-right {
    margin-left: auto;
    display: flex;
    align-items: center;
    gap: 12px;
  }
  .user-name {
    font-size: 13px;
    color: var(--green);
    font-family: var(--mono);
  }
  .user-avatar {
    width: 32px;
    height: 32px;
    border-radius: 50%;
    border: 1px solid var(--green3);
    object-fit: cover;
  }
  button {
    background: var(--brown3);
    border: 1px solid var(--green3);
    color: var(--parchment);
    font-family: var(--mono);
    font-size: 12px;
    padding: 6px 14px;
    border-radius: 4px;
    cursor: pointer;
    transition: border-color 0.15s;
  }
  button:hover { border-color: var(--green); }
  .btn-discord {
    background: #404eed;
    border-color: #5865f2;
    color: #fff;
    font-size: 13px;
    padding: 8px 18px;
    display: flex;
    align-items: center;
    gap: 8px;
  }
  .btn-discord:hover { background: #5865f2; border-color: #fff; }
  .btn-logout { background: var(--brown); border-color: var(--brown3); color: var(--dim); }
  .btn-logout:hover { border-color: var(--purple); color: var(--parchment); }

  /* ── Layout ── */
  .main-wrap {
    display: flex;
    flex: 1;
    overflow: hidden;
    min-height: 0;
  }

  /* ── Sidebar ── */
  aside {
    width: 220px;
    flex-shrink: 0;
    background: var(--brown2);
    border-right: 1px solid var(--brown3);
    display: flex;
    flex-direction: column;
    overflow-y: auto;
  }
  .sidebar-section {
    padding: 14px 16px;
    border-bottom: 1px solid var(--brown3);
  }
  .sidebar-label {
    font-size: 11px;
    letter-spacing: 0.1em;
    color: var(--dim);
    font-family: var(--mono);
    margin-bottom: 10px;
    text-transform: uppercase;
  }
  .sidebar-link {
    display: block;
    color: var(--green);
    text-decoration: none;
    font-size: 13px;
    padding: 4px 0;
    font-family: var(--mono);
    letter-spacing: 0.04em;
    transition: color 0.1s;
  }
  .sidebar-link:hover { color: var(--parchment); }
  .sidebar-entry {
    padding: 8px 0;
    border-bottom: 1px solid var(--brown3);
  }
  .sidebar-entry:last-child { border-bottom: none; }
  .sidebar-entry-title {
    font-size: 12px;
    color: var(--parchment2);
    font-family: var(--mono);
    display: block;
    cursor: pointer;
    transition: color 0.1s;
    text-decoration: none;
  }
  .sidebar-entry-title:hover { color: var(--green); }
  .sidebar-entry-type {
    font-size: 11px;
    color: var(--dim);
    font-family: var(--mono);
    margin-top: 2px;
  }
  .entry-dot {
    display: inline-block;
    width: 8px;
    height: 8px;
    border-radius: 50%;
    margin-right: 5px;
    vertical-align: middle;
    border: 0.5px solid rgba(255,255,255,0.15);
  }
  .sidebar-mu {
    padding: 14px 16px;
  }
  .mu-avatar {
    width: 52px;
    height: 52px;
    margin: 0 auto 10px;
    display: block;
    opacity: 0.85;
    filter: sepia(30%);
  }
  .mu-status {
    font-size: 11px;
    color: var(--dim);
    font-family: var(--mono);
    text-align: center;
    font-style: italic;
  }
  .mu-status.online { color: var(--green3); }

  /* ── Chat Area ── */
  .chat-wrap {
    flex: 1;
    display: flex;
    flex-direction: column;
    overflow: hidden;
    min-height: 0;
  }
  .chat-messages {
    flex: 1;
    overflow-y: auto;
    padding: 20px;
    display: flex;
    flex-direction: column;
    gap: 14px;
    scroll-behavior: smooth;
  }
  .msg {
    display: flex;
    gap: 12px;
    max-width: 680px;
  }
  .msg.mu { align-self: flex-start; }
  .msg.user { align-self: flex-end; flex-direction: row-reverse; }
  .msg-avatar {
    width: 34px;
    height: 34px;
    border-radius: 50%;
    flex-shrink: 0;
    border: 1px solid var(--brown3);
    background: var(--brown3);
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 15px;
    object-fit: cover;
  }
  .msg-body { max-width: 520px; }
  .msg-author {
    font-size: 11px;
    color: var(--dim);
    font-family: var(--mono);
    margin-bottom: 4px;
    display: flex;
    align-items: center;
    gap: 8px;
  }
  .msg.user .msg-author { flex-direction: row-reverse; }
  .msg-author-name { color: var(--green); }
  .msg.user .msg-author-name { color: var(--purple2); }
  .msg-bubble {
    background: var(--brown2);
    border: 1px solid var(--brown3);
    border-radius: 4px 12px 12px 12px;
    padding: 10px 14px;
    font-size: 14px;
    line-height: 1.55;
    color: var(--parchment);
  }
  .msg.user .msg-bubble {
    background: var(--brown3);
    border-color: var(--purple);
    border-radius: 12px 4px 12px 12px;
    color: var(--parchment2);
  }
  .msg-bubble em { color: var(--green2); font-style: italic; }
  .msg-cards {
    font-size: 11px;
    color: var(--dim);
    font-family: var(--mono);
    margin-top: 6px;
  }

  /* Login screen */
  .login-screen {
    flex: 1;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 20px;
    padding: 40px;
    text-align: center;
  }
  .login-title {
    font-size: 28px;
    color: var(--green);
    letter-spacing: 0.1em;
    font-weight: normal;
  }
  .login-sub {
    font-size: 14px;
    color: var(--dim);
    font-family: var(--mono);
    max-width: 360px;
    line-height: 1.6;
  }
  .login-mu {
    font-size: 60px;
    line-height: 1;
    margin: 10px 0;
  }

  /* Input */
  .chat-input-wrap {
    border-top: 1px solid var(--brown3);
    padding: 12px 20px;
    background: var(--brown2);
    display: flex;
    gap: 10px;
    flex-shrink: 0;
  }
  .chat-input {
    flex: 1;
    background: var(--brown);
    border: 1px solid var(--brown3);
    color: var(--parchment);
    font-family: var(--serif);
    font-size: 14px;
    padding: 8px 12px;
    border-radius: 4px;
    outline: none;
    resize: none;
    min-height: 40px;
    max-height: 120px;
  }
  .chat-input:focus { border-color: var(--green3); }
  .chat-input::placeholder { color: var(--dim); }

  /* Entry modal */
  .modal-bg { display:none; position:fixed; inset:0; background:rgba(20,12,8,0.85); z-index:300; align-items:center; justify-content:center; }
  .modal-bg.open { display:flex; }
  .modal {
    background: var(--brown2);
    border: 1px solid var(--purple);
    border-radius: 8px;
    padding: 24px;
    max-width: 500px;
    width: 90%;
    max-height: 80vh;
    overflow-y: auto;

  .modal-title { font-size: 16px; color: var(--green); margin-bottom: 6px; }
  .modal-meta { font-size: 11px; color: var(--dim); font-family: var(--mono); margin-bottom: 14px; }
  .modal-content { font-size: 14px; line-height: 1.65; color: var(--parchment2); }

  .loading { color: var(--dim); font-family: var(--mono); font-size: 12px; font-style: italic; }

  /* Scrollbar */
  ::-webkit-scrollbar { width: 6px; }
  ::-webkit-scrollbar-track { background: var(--brown); }
  ::-webkit-scrollbar-thumb { background: var(--brown3); border-radius: 3px; }
  ::-webkit-scrollbar-thumb:hover { background: var(--green3); }
</style>

const SUIT_LABEL={major:"Major Arcana",wands:"Wands",cups:"Cups",swords:"Swords",disks:"Disks"};
const ENTRY_EMOJI={item:"📖",character:"🧙",session:"🎭",concept:"🌀",place:"🗺️"};

// ── Sentence engine ───────────────────────────────────────────────────────────
const clean=s=>s.replace(/\s{2,}/g," ").replace(/ \./g,".").replace(/ ,/g,",").trim();
const pick=arr=>arr[Math.floor(Math.random()*arr.length)];

const MU_INTROS=[
  "*Mu sets something on the table. He does not say what it is.*",
  "*The library is quiet. Mu places a card face-down and walks away.*",
  "*From somewhere deep in the archive, Mu draws two threads together.*",
  "*Mu looks at you the way water looks at a stone.*",
  "*Without ceremony, Mu arrives. Without announcement, he leaves.*",
  "*The great librarian opens a door you didn't know was there.*",
  "*He draws. He does not interpret. He offers.*",
  "*The card chose itself. Mu only held the deck.*",
];

const SENTENCE_TEMPLATES=[
  c=>`${c[0].subject} ${c[1].verb} ${c[0].adv}.`,
  c=>`${c[0].adj} ${c[0].noun} — ${c[1].verb} ${c[1].adv}.`,
  c=>`${c[0].subject} ${c[1].verb} — ${c[1].adj} ${c[1].noun} ${c[0].adv}.`,
  c=>`${c[0].adj} ${c[1].noun} ${c[0].verb} ${c[1].adv}. ${c[1].subject} listens.`,
];

const GREET_TEMPLATES=[
  c=>`${c[0].timeframe} — ${c[1].command} your ${c[0].adj} ${c[1].noun}.`,
  c=>`${c[0].adj} ${c[0].noun} does not explain itself to ${c[1].adj} ${c[1].noun}.`,
  c=>`You are looking for ${c[1].noun}. ${c[0].adj} is the door.`,
  c=>`Before ${c[0].adj} ${c[0].noun} — what were you?`,
];

function drawCards(n){
  return [...CARDS].sort(()=>Math.random()-0.5).slice(0,n);
}

function cardName(c){
  if(c.suit==="major")return c.name;
  const s={wands:"W",cups:"C",swords:"S",disks:"D"};
  return`${c.sn}·${s[c.suit]}·${c.name}`;
}

function buildMuReply(userText){
  const cards=drawCards(2+Math.floor(Math.random()*2));
  let sentence;
  if(!userText||userText.trim()===""){
    sentence=clean(pick(GREET_TEMPLATES)(cards));
  } else {
    const intro=Math.random()>0.5?pick(MU_INTROS)+"\n\n":"";
    sentence=intro+clean(pick(SENTENCE_TEMPLATES)(cards));
    const kw=userText.toLowerCase().replace(/[^a-z\s]/g,"").split(/\s+/).filter(w=>w.length>3&&!["what","does","that","this","with","from","have","your","they","their"].includes(w));
    if(kw.length>0&&Math.random()>0.5){
      const word=pick(kw);
      sentence=pick([`*${word}* — ${sentence}`,`${sentence} What of *${word}*?`,`Before *${word}* — ${sentence}`]);
    }
  }
  return{sentence,cards};
}

// ── Auth ─────────────────────────────────────────────────────────────────────
let currentUser=null;

async function signIn(){
  await db.auth.signInWithOAuth({
    provider:"discord",
    options:{redirectTo:window.location.origin+window.location.pathname}
  });
}

async function signOut(){
  await db.auth.signOut();
  currentUser=null;
  showLoginScreen();
}

db.auth.onAuthStateChange((_event,session)=>{
  if(session?.user){
    currentUser=session.user;
    showApp(session.user);
  } else {
    currentUser=null;
    showLoginScreen();
  }
});

function showApp(user){
  document.getElementById("login-screen").style.display="none";
  document.getElementById("sidebar").style.display="flex";
  document.getElementById("chat-wrap").style.display="flex";
  const avatar=user.user_metadata?.avatar_url;
  const name=user.user_metadata?.full_name||user.user_metadata?.name||"traveler";
  document.getElementById("header-right").innerHTML=`
    ${avatar?`<img src="${avatar}" class="user-avatar" alt="">`:""}
    <span class="user-name">${name}</span>
    <button class="btn-logout" onclick="signOut()">leave</button>`;
  loadSidebarEntries();
  sendGreeting(name);
}

// ── Chat ─────────────────────────────────────────────────────────────────────
function addMsg(role,html,cardLine){
  const msgs=document.getElementById("chat-messages");
  const isUser=role==="user";
  const avatarHtml=isUser?"👤":"📦";
  const authorName=isUser?(currentUser?.user_metadata?.full_name||"you"):"Mu";
  const div=document.createElement("div");
  div.className=`msg ${isUser?"user":"mu"}`;
  div.innerHTML=`
    <div class="msg-avatar">${avatarHtml}</div>
    <div class="msg-body">
      <div class="msg-author"><span class="msg-author-name">${authorName}</span></div>
      <div class="msg-bubble">${html}</div>
      ${cardLine?`<div class="msg-cards">${cardLine}</div>`:""}
    </div>`;
  msgs.appendChild(div);
  msgs.scrollTop=msgs.scrollHeight;
}

function sendGreeting(){
  const{sentence,cards}=buildMuReply("");
  const cardLine=cards.map(c=>cardName(c)).join(" · ");
  addMsg("mu",sentence.replace(/\*(.*?)\*/g,"<em>$1</em>"),cardLine);
}

function sendMessage(){
  const inp=document.getElementById("chat-input");
  const text=inp.value.trim();
  if(!text)return;
  addMsg("user",text,"");
  inp.value="";
  inp.style.height="auto";
  setTimeout(()=>{
    const{sentence,cards}=buildMuReply(text);
    const cardLine=cards.map(c=>cardName(c)).join(" · ");
    addMsg("mu",sentence.replace(/\*(.*?)\*/g,"<em>$1</em>"),cardLine);
  },400+Math.random()*600);
}

function handleKey(e){
  if(e.key==="Enter"&&!e.shiftKey){e.preventDefault();sendMessage();}
}

function autoResize(el){
  el.style.height="auto";
  el.style.height=Math.min(el.scrollHeight,120)+"px";
}

// ── Library sidebar ───────────────────────────────────────────────────────────
async function loadSidebarEntries(){
  const el=document.getElementById("sidebar-entries");
  const{data}=await db.from("library_entries").select("*").order("created_at",{ascending:false}).limit(3);
  if(!data||data.length===0){el.innerHTML=`<div class="loading">nothing filed yet</div>`;return;}
  el.innerHTML=data.map(e=>{
    const rgb=e.r!=null?`rgb(${e.r},${e.g},${e.b})`:"#4C2E57";
    const emoji=ENTRY_EMOJI[e.entry_type]||"📜";
    return`<div class="sidebar-entry">
      <a class="sidebar-entry-title" href="#" onclick="openEntry(${e.id});return false;">
        <span class="entry-dot" style="background:${rgb}"></span>${emoji} ${e.title}
      </a>
      <div class="sidebar-entry-type">${e.entry_type}${e.subtype?" · "+e.subtype:""}</div>
    </div>`;
  }).join("");
}

async function openEntry(id){
  const{data}=await db.from("library_entries").select("*").eq("id",id).single();
  if(!data)return;
  const emoji=ENTRY_EMOJI[data.entry_type]||"📜";
  const rgb=data.r!=null?`rgb(${data.r},${data.g},${data.b})`:null;
  document.getElementById("modal-title").innerHTML=`${emoji} ${data.title}`;
  document.getElementById("modal-meta").innerHTML=
    `${data.entry_type}${data.subtype?" · "+data.subtype:""} · by ${data.author||"unknown"} · ${new Date(data.created_at).toLocaleDateString()}`+
    (rgb?` <span class="modal-rgb" style="background:${rgb}"></span>`:"");
  document.getElementById("modal-content").textContent=data.content||"—";
  document.getElementById("modal-bg").classList.add("open");
}

  alert("Library list view coming soon!");
}

function closeModal(){
  document.getElementById("modal-bg").classList.remove("open");
}

document.addEventListener("keydown",e=>{if(e.key==="Escape")closeModal();});
