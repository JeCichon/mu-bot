<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>The Cards · TricknoLodge</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  :root {
    --green:   rgb(144,171,153);
    --green2:  rgb(110,135,118);
    --green3:  rgb(80,105,90);
    --brown:   rgb(43,28,16);
    --brown2:  rgb(60,42,26);
    --brown3:  rgb(80,58,36);
    --purple:  rgb(76,46,87);
    --purple2: rgb(100,65,112);
    --parchment: rgb(220,210,190);
    --parchment2: rgb(200,188,168);
    --dim: rgb(120,100,80);
    --mono: 'Courier New', Courier, monospace;
    --serif: Georgia, 'Times New Roman', serif;
  }
  body { background:var(--brown); color:var(--parchment); font-family:var(--serif); font-size:14px; min-height:100vh; }

  header { background:var(--brown2); border-bottom:2px solid var(--purple); padding:12px 24px; display:flex; align-items:center; gap:16px; }
  .back-link { color:var(--green); text-decoration:none; font-family:var(--mono); font-size:12px; letter-spacing:0.06em; }
  .back-link:hover { color:var(--parchment); }
  .page-title { font-size:18px; color:var(--green); font-weight:normal; letter-spacing:0.08em; }
  .page-sub { font-size:11px; color:var(--dim); font-family:var(--mono); }

  .wrap { max-width:1000px; margin:0 auto; padding:24px 20px; }

  /* Filters */
  .filters { display:flex; gap:8px; margin-bottom:20px; flex-wrap:wrap; align-items:center; }
  .filter-btn { background:var(--brown2); border:1px solid var(--brown3); color:var(--dim); font-family:var(--mono); font-size:11px; padding:5px 12px; border-radius:20px; cursor:pointer; letter-spacing:0.05em; transition:all 0.15s; }
  .filter-btn:hover, .filter-btn.active { border-color:var(--green); color:var(--green); background:var(--brown3); }
  .search-wrap { margin-left:auto; }
  .search-input { background:var(--brown2); border:1px solid var(--brown3); color:var(--parchment); font-family:var(--mono); font-size:12px; padding:5px 12px; border-radius:4px; outline:none; width:200px; }
  .search-input:focus { border-color:var(--green3); }
  .search-input::placeholder { color:var(--dim); }
  .card-count { font-size:11px; color:var(--dim); font-family:var(--mono); margin-bottom:14px; }

  /* Card grid */
  .card-grid { display:grid; grid-template-columns:repeat(auto-fill, minmax(160px, 1fr)); gap:10px; }
  .card-tile { background:var(--brown2); border:1px solid var(--brown3); border-radius:6px; cursor:pointer; transition:border-color 0.15s; overflow:hidden; }
  .card-tile:hover { border-color:var(--green3); }
  .card-swatch { height:6px; width:100%; }
  .card-tile-body { padding:10px 12px; }
  .card-suit-label { font-size:11px; color:var(--green3); font-family:var(--mono); letter-spacing:0.06em; margin-bottom:5px; }
  .card-tile-name { font-size:15px; font-weight:bold; color:var(--parchment); margin-bottom:6px; line-height:1.3; }
  .card-tile-words { font-size:12px; color:var(--parchment2); font-family:var(--mono); }
  .card-tile-rgb { display:flex; align-items:center; gap:5px; margin-top:8px; }
  .rgb-dot { width:9px; height:9px; border-radius:50%; flex-shrink:0; border:0.5px solid rgba(255,255,255,0.12); }
  .rgb-val { font-size:11px; font-family:var(--mono); color:var(--green2); }

  /* Modal */
  .modal-bg { display:none; position:fixed; inset:0; background:rgba(20,12,8,0.88); z-index:200; align-items:center; justify-content:center; padding:20px; }
  .modal-bg.open { display:flex; }
  .modal { background:var(--brown2); border:1px solid var(--purple); border-radius:8px; padding:28px; max-width:560px; width:100%; max-height:88vh; overflow-y:auto; position:relative; }
  .modal-close { position:absolute; top:14px; right:18px; background:none; border:none; color:var(--dim); font-size:20px; cursor:pointer; padding:0; line-height:1; }
  .modal-close:hover { color:var(--parchment); }
  .modal-swatch { width:100%; height:6px; border-radius:3px; margin-bottom:16px; }
  .modal-name { font-size:22px; color:var(--green); font-weight:normal; margin-bottom:4px; }
  .modal-suit { font-size:12px; color:var(--dim); font-family:var(--mono); margin-bottom:16px; }
  .section-label { font-size:11px; color:var(--dim); font-family:var(--mono); letter-spacing:0.08em; margin-bottom:8px; margin-top:16px; text-transform:uppercase; border-bottom:1px solid var(--brown3); padding-bottom:4px; }
  .rgb-row { display:flex; align-items:center; gap:12px; }
  .rgb-swatch { width:48px; height:24px; border-radius:3px; border:0.5px solid rgba(255,255,255,0.15); }
  .rgb-text { font-size:13px; font-family:var(--mono); color:var(--green); }

  /* Word tables */
  .word-grid { display:grid; grid-template-columns:1fr 1fr; gap:6px 20px; }
  .word-row { font-size:13px; }
  .word-key { color:var(--dim); font-family:var(--mono); font-size:11px; }
  .word-val { color:var(--parchment2); }

  /* Chakra table */
  .chakra-grid { display:grid; grid-template-columns:auto 1fr; gap:5px 14px; align-items:center; }
  .chakra-key { font-size:11px; font-family:var(--mono); color:var(--purple2); font-weight:bold; }
  .chakra-val { font-size:13px; color:var(--parchment2); }

  .sentence-block { font-size:13px; color:var(--parchment2); line-height:1.6; font-style:italic; padding:10px 14px; background:var(--brown3); border-radius:4px; border-left:3px solid var(--purple); }

  .loading { color:var(--dim); font-family:var(--mono); font-size:13px; font-style:italic; padding:40px; text-align:center; }
  .card-tile-img-wrap { width:100%; aspect-ratio:1; }
  .card-tile-img { width:100%; height:100%; object-fit:cover; display:block; }
  .card-tile-placeholder { width:100%; height:100%; align-items:center; justify-content:center; opacity:0.55; font-size:12px; font-family:var(--mono); color:#fff; text-align:center; padding:12px; }
  .modal-img { width:100%; max-width:220px; display:block; margin:0 auto 4px; border-radius:4px; border:1px solid var(--brown3); background:var(--brown3); }

  ::-webkit-scrollbar { width:5px; }
  ::-webkit-scrollbar-track { background:var(--brown); }
  ::-webkit-scrollbar-thumb { background:var(--brown3); border-radius:3px; }
</style>

<script>
// Hide header when loaded inside the Lodge content panel
if(window.location.search.includes('embed=1')||window.self!==window.top){
  document.addEventListener('DOMContentLoaded',()=>{
    const h=document.querySelector('header');
    if(h) h.style.display='none';
  });
}
</script>
</head>
<body>

<header>
  <a class="back-link" href="index.html">← Lodge</a>
  <div>
    <div class="page-title">🃏 The Cards</div>
    <div class="page-sub">thoth tarot · 78 cards · the dream deck</div>
  </div>
</header>

<div class="wrap">
  <div class="filters">
    <button class="filter-btn active" onclick="setFilter('all',this)">all 78</button>
    <button class="filter-btn" onclick="setFilter('major',this)">☉ major arcana</button>
    <button class="filter-btn" onclick="setFilter('wands',this)">🔥 wands</button>
    <button class="filter-btn" onclick="setFilter('cups',this)">🌊 cups</button>
    <button class="filter-btn" onclick="setFilter('swords',this)">⚔️ swords</button>
    <button class="filter-btn" onclick="setFilter('disks',this)">🌍 disks</button>
    <div class="search-wrap">
      <input class="search-input" type="text" id="search" placeholder="search…" oninput="applySearch(this.value)">
    </div>
  </div>
  <div class="card-count" id="card-count"></div>
  <div class="card-grid" id="card-grid"><div class="loading">*Mu retrieves the deck…*</div></div>
</div>

<!-- Card Detail Modal -->
<div class="modal-bg" id="modal-bg" onclick="if(event.target===this)closeModal()">
  <div class="modal">
    <button class="modal-close" onclick="closeModal()">×</button>
    <div class="modal-swatch" id="modal-swatch"></div>
    <div class="modal-name" id="modal-name"></div>
    <div class="modal-suit" id="modal-suit"></div>

    <div class="section-label">color</div>
    <div class="rgb-row">
      <div class="rgb-swatch" id="modal-rgb-swatch"></div>
      <span class="rgb-text" id="modal-rgb-text"></span>
    </div>

    <div class="section-label">sentence fragments</div>
    <div class="sentence-block" id="modal-sentence"></div>

    <div class="section-label">word pair</div>
    <div class="word-grid" id="modal-words"></div>

    <div class="section-label">chakra words</div>
    <div class="chakra-grid" id="modal-chakra"></div>
  </div>
</div>

<script>
const SUPABASE_URL = 'YOUR_SUPABASE_URL_HERE';
const SUPABASE_KEY = 'YOUR_SUPABASE_ANON_KEY_HERE';
const db = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

const SUIT_EMOJI={major:"☉",wands:"🔥",cups:"🌊",swords:"⚔️",disks:"🌍"};
const SUIT_LABEL={major:"Major Arcana",wands:"Wands",cups:"Cups",swords:"Swords",disks:"Disks"};

let allCards=[];
let activeFilter="all";
let activeSearch="";

function cardDisplayName(c){
  if(c.suit==="major")return c.name;
  return`${c.suit_number} · ${SUIT_LABEL[c.suit]} · ${c.name}`;
}

function suitLine(c){
  if(c.suit==="major")return`${SUIT_EMOJI.major} Major Arcana · card ${c.suit_number}`;
  return`${SUIT_EMOJI[c.suit]} ${SUIT_LABEL[c.suit]} · ${c.suit_number}`;
}

async function loadCards(){
  const{data,error}=await db.from("cards").select("*").order("card_id",{ascending:true});
  if(error){ document.getElementById("card-grid").innerHTML=`<div class="loading">error: ${error.message}</div>`; return; }
  allCards=data;
  render();
}

function setFilter(suit,btn){
  activeFilter=suit;
  document.querySelectorAll(".filter-btn").forEach(b=>b.classList.remove("active"));
  btn.classList.add("active");
  render();
}

function applySearch(q){
  activeSearch=q.toLowerCase();
  render();
}

function render(){
  let cards=allCards;
  if(activeFilter!=="all") cards=cards.filter(c=>c.suit===activeFilter);
  if(activeSearch) cards=cards.filter(c=>
    c.name?.toLowerCase().includes(activeSearch)||
    c.adj?.toLowerCase().includes(activeSearch)||
    c.noun?.toLowerCase().includes(activeSearch)||
    c.suit?.toLowerCase().includes(activeSearch)||
    String(c.suit_number).includes(activeSearch)
  );

  document.getElementById("card-count").textContent=`${cards.length} card${cards.length===1?"":"s"}`;

  if(cards.length===0){
    document.getElementById("card-grid").innerHTML=`<div class="loading">*Mu searches the stacks. Nothing matches.*</div>`;
    return;
  }

  document.getElementById("card-grid").innerHTML=cards.map(c=>{
    const rgb=`rgb(${c.r},${c.g},${c.b})`;
    const imgSrc=`https://raw.githubusercontent.com/JeCichon/mu-bot/main/images/${String(c.card_id).padStart(2,'0')}.png`;
    return`<div class="card-tile" onclick="openCard(${c.card_id})">
      <div class="card-tile-img-wrap">
        <img class="card-tile-img" src="${imgSrc}" alt="${c.name}"
          onerror="this.style.display='none';this.nextElementSibling.style.display='flex'">
        <div class="card-tile-placeholder" style="display:none;background:${rgb}">
          <span>${c.adj||""}<br><em>${c.noun||""}</em></span>
        </div>
      </div>
      <div class="card-swatch" style="background:${rgb}"></div>
      <div class="card-tile-body">
        <div class="card-suit-label">${SUIT_EMOJI[c.suit]} ${c.suit==="major"?c.suit_number:SUIT_LABEL[c.suit]}</div>
        <div class="card-tile-name">${c.name}</div>
        <div class="card-tile-words">${c.adj||""} ${c.noun||""}</div>
        <div class="card-tile-rgb">
          <span class="rgb-dot" style="background:${rgb}"></span>
          <span class="rgb-val">${c.r}·${c.g}·${c.b}</span>
        </div>
      </div>
    </div>`;
  }).join("");
}

function openCard(cardId){
  const c=allCards.find(x=>x.card_id===cardId);
  if(!c)return;
  const rgb=`rgb(${c.r},${c.g},${c.b})`;

  document.getElementById("modal-swatch").style.background=rgb;
  const imgUrl=`https://raw.githubusercontent.com/JeCichon/mu-bot/main/images/${String(c.card_id).padStart(2,'0')}.png`;
  const existingImg=document.getElementById("modal-card-img");
  if(existingImg) existingImg.remove();
  const imgEl=document.createElement("img");
  imgEl.id="modal-card-img";
  imgEl.className="modal-img";
  imgEl.src=imgUrl;
  imgEl.alt=c.name;
  imgEl.onerror=function(){this.style.display="none"};
  document.getElementById("modal-name").before(imgEl);
  document.getElementById("modal-name").textContent=c.name;
  document.getElementById("modal-suit").textContent=suitLine(c);
  document.getElementById("modal-rgb-swatch").style.background=rgb;
  document.getElementById("modal-rgb-text").textContent=`R:${c.r}  G:${c.g}  B:${c.b}`;

  const sentence=`${c.subject||""} ${c.verb||""} ${c.adv||""}`.trim();
  document.getElementById("modal-sentence").textContent=sentence||"—";

  document.getElementById("modal-words").innerHTML=`
    <div class="word-row"><div class="word-key">adj</div><div class="word-val">${c.adj||"—"}</div></div>
    <div class="word-row"><div class="word-key">noun</div><div class="word-val">${c.noun||"—"}</div></div>
    <div class="word-row"><div class="word-key">command</div><div class="word-val">${c.command||"—"}</div></div>
    <div class="word-row"><div class="word-key">timeframe</div><div class="word-val">${c.timeframe||"—"}</div></div>`;

  const chakras=[
    ["I AM",c.i_am],["I FEEL",c.i_feel],["I ACT",c.i_act],["I LOVE",c.i_love],
    ["I SPEAK",c.i_speak],["I SEE",c.i_see],["I KNOW",c.i_know],["I UNDERSTAND",c.i_understand],
  ];
  document.getElementById("modal-chakra").innerHTML=chakras.map(([k,v])=>`
    <div class="chakra-key">${k}</div>
    <div class="chakra-val">${v||"—"}</div>`).join("");

  document.getElementById("modal-bg").classList.add("open");
}

function closeModal(){ document.getElementById("modal-bg").classList.remove("open"); }
document.addEventListener("keydown",e=>{ if(e.key==="Escape")closeModal(); });
loadCards();
</script>
</body>
</html>
